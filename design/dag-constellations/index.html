<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarPulse · DAG constellations mockup</title>
<style>
:root { --bg0: #05070d; --ink: #dbe4f3; --muted: #6b7a93; --rail: 250px; --nav: 250px; --fs: 1; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
canvas { position: fixed; left: 0; top: 0; display: block; }
aside { position: fixed; z-index: 2; top: 0; bottom: 0; box-sizing: border-box; padding: 20px 18px; overflow: hidden; background: rgba(8,12,22,.78);
  backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 18px; font-size: calc(11px * var(--fs)); color: var(--muted); }
aside h3 { margin: 0 0 8px; font-size: calc(10px * var(--fs)); font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
#rail { right: 0; width: var(--rail); border-left: 1px solid rgba(148,163,184,.10); }
#nav { left: 0; width: var(--nav); border-right: 1px solid rgba(148,163,184,.10); }
#nav h1 { margin: 0; font-size: calc(13px * var(--fs)); font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--ink); opacity: .85; }
#nav .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 6px; line-height: 1.6; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 8px #34d399; }
.views { margin: 0 -18px; }
.views h3 { padding-left: 18px; }
.vrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 4px 18px 4px 15px; color: var(--ink); font-size: calc(12px * var(--fs)); }
.vrow.on { background: linear-gradient(90deg, rgba(167,139,250,.22), transparent); border-left: 3px solid #a78bfa; padding-left: 12px; }
.vrow .n { color: var(--muted); }
#qwrap { position: relative; }
#q { all: unset; box-sizing: border-box; width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid rgba(148,163,184,.2); background: rgba(148,163,184,.06);
  font-size: calc(12px * var(--fs)); color: var(--ink); }
#q:focus { border-color: #a78bfa; }
#hits { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: #0b1120; border: 1px solid rgba(148,163,184,.2); border-radius: 6px; max-height: 340px; overflow: auto; display: none; }
#hits.on { display: block; }
#hits button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 6px 9px; cursor: pointer; font-size: calc(12px * var(--fs)); color: var(--ink); }
#hits button small { display: block; color: var(--muted); font-size: calc(10px * var(--fs)); }
#hits button:hover, #hits button.sel { background: rgba(167,139,250,.16); }
.layers { flex: 1; min-height: 0; overflow: auto; }
.lrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 3px 0; color: #c3cde0; font-size: calc(12px * var(--fs)); cursor: pointer; }
.lrow.sub { padding-left: 14px; color: #a8b3c8; }
.lrow.on { color: var(--ink); background: rgba(167,139,250,.12); border-radius: 5px; }
.lrow .n { color: var(--muted); font-size: calc(11px * var(--fs)); }
.ring { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #8b97ad; justify-self: center; }
.pool { margin-bottom: 7px; }
.pool .r { display: flex; justify-content: space-between; color: #b6c0d3; }
.pool .bar { height: 2px; background: rgba(148,163,184,.14); margin-top: 4px; }
.pool .bar i { display: block; height: 100%; background: #fbbf24; }
#recent { flex: 1; min-height: 0; overflow: hidden; font: calc(10.5px * var(--fs)) "JetBrains Mono", ui-monospace, monospace; }
#recent div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.75; }
#recent .t { color: #64748b; } #recent .id { color: var(--ink); } #recent .ev { color: #94a3b8; } #recent .ok { color: #34d399; } #recent .bad { color: #fb7185; } #recent .run { color: #fbbf24; }
#recent div.new { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: rgba(251,191,36,.18); } to { background: transparent; } }
.legend div { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend svg { overflow: visible; }
#clock { position: fixed; z-index: 2; top: 18px; right: calc(var(--rail) + 24px); color: #fbbf24; font: calc(10.5px * var(--fs)) "JetBrains Mono", ui-monospace, monospace; }
#crumb { position: fixed; z-index: 2; top: 16px; left: calc(var(--nav) + 24px); font-size: calc(12px * var(--fs)); color: var(--muted); display: none; }
#crumb button { all: unset; cursor: pointer; color: #a78bfa; } #crumb b { color: var(--ink); font-weight: 500; }
#tip { position: fixed; z-index: 6; pointer-events: none; max-width: 340px; padding: 8px 10px; border-radius: 7px; background: rgba(11,17,32,.96); border: 1px solid rgba(148,163,184,.22);
  font-size: calc(11.5px * var(--fs)); color: var(--ink); display: none; line-height: 1.45; }
#tip small { color: var(--muted); display: block; font-size: calc(10.5px * var(--fs)); }
#tip code { font: calc(10.5px * var(--fs)) "JetBrains Mono", ui-monospace, monospace; color: #cbd5e1; }
#panel { position: fixed; z-index: 4; top: 54px; right: calc(var(--rail) + 14px); width: calc(320px * var(--fs)); max-height: calc(100% - 160px); overflow: auto; box-sizing: border-box;
  padding: 16px 16px 14px; border-radius: 10px; background: rgba(9,14,26,.94); border: 1px solid rgba(148,163,184,.18); font-size: calc(12px * var(--fs)); color: #b6c0d3; display: none; }
#panel.on { display: block; }
#panel h2 { margin: 0 0 4px; font-size: calc(14px * var(--fs)); font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
#panel .meta { color: var(--muted); margin-bottom: 12px; }
#panel h4 { margin: 14px 0 6px; font-size: calc(9.5px * var(--fs)); font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
#panel .step { display: grid; grid-template-columns: 12px 1fr auto; gap: 7px; align-items: baseline; padding: 2px 0; }
#panel .step code { font: calc(11px * var(--fs)) "JetBrains Mono", ui-monospace, monospace; color: var(--ink); overflow-wrap: anywhere; }
#panel .step small { color: var(--muted); }
#panel .step i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
#panel .x { all: unset; cursor: pointer; position: absolute; top: 10px; right: 12px; color: var(--muted); font-size: calc(15px * var(--fs)); }
#panel .run { all: unset; cursor: pointer; margin-top: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid #34d399; color: #34d399; font-size: calc(12px * var(--fs)); }
#panel .run[disabled] { cursor: not-allowed; border-color: rgba(148,163,184,.25); color: var(--muted); }
#panel .refusal { margin-top: 10px; color: #fb7185; display: none; } #panel .refusal.on { display: block; }
.chip { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: calc(10.5px * var(--fs)); border: 1px solid currentColor; }
/* Mockup chrome: the review switcher, never part of the page. */
#mock { position: fixed; z-index: 3; bottom: 14px; left: calc(var(--nav) + 18px); right: calc(var(--rail) + 18px); display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; align-items: center;
  padding: 8px 12px; border-radius: 10px; border: 1px dashed rgba(251,191,36,.45); background: rgba(10,12,20,.88); font-size: calc(11px * var(--fs)); color: var(--muted); }
#mock .g { display: inline-flex; align-items: center; gap: 4px; }
#mock .g > span { margin-right: 2px; }
#mock button { all: unset; cursor: pointer; padding: 2px 7px; border-radius: 5px; border: 1px solid rgba(148,163,184,.18); color: #b6c0d3; }
#mock button.on { border-color: #fbbf24; color: #fde68a; background: rgba(251,191,36,.10); }
#mock button:focus-visible { outline: 1px solid #fbbf24; }
#mock .tag { color: #fbbf24; letter-spacing: .2em; text-transform: uppercase; font-size: calc(9.5px * var(--fs)); }
#mock .hide { margin-left: 4px; }
#mock.min .g, #mock.min .sep { display: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<aside id="nav">
  <section class="head"><h1>StarPulse</h1><div class="sub"><span class="dot"></span>live · <span id="navclock"></span></div></section>
  <section class="views"><h3>Views</h3>
    <div class="vrow on"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.2" fill="none" stroke="#c4b5fd" stroke-width="1.3"/></svg><span>Star Map</span><span class="n"></span></div>
    <div class="vrow"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2v9M6 2v6M10 2v4" stroke="#8b97ad" stroke-width="1.6"/></svg><span>Kanban</span><span class="n">235</span></div>
  </section>
  <section id="qwrap"><input id="q" placeholder="search tasks, states, DAGs…" autocomplete="off" aria-label="Search"><div id="hits" role="listbox"></div></section>
  <section class="layers"><h3>Layers</h3><div id="layers"></div></section>
  <section><h3>Queues</h3><div id="pools"></div></section>
</aside>
<aside id="rail">
  <section style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>Recent</h3><div id="recent"></div></section>
  <section class="legend"><h3>Legend</h3>
    <div><span><i style="background:#c4b5fd"></i>deep</span><span><i style="background:#67e8f9"></i>standard</span><span><i style="background:#fde047"></i>other</span></div>
    <div><span><i style="background:#34d399"></i>ok</span><span><i style="background:#fb7185"></i>failed</span><span><i style="background:#fbbf24"></i>running</span><span><i style="border:1px solid #8b97ad"></i>not run</span></div>
    <div><span><svg width="26" height="10"><circle cx="3" cy="6" r="2" fill="#e6fff7"/><line x1="5" y1="5.5" x2="21" y2="3" stroke="#94a3b8" stroke-opacity=".5"/><circle cx="23" cy="3" r="2" fill="#e6fff7"/></svg>DAG: step, depends on</span></div>
    <div><span><i style="background:#a78bfa"></i>lifecycle machine</span><span><i style="background:#fbbf24"></i>activity now</span></div>
  </section>
</aside>
<div id="clock"></div>
<div id="crumb"></div>
<div id="panel" role="dialog" aria-label="DAG"></div>
<div id="tip"></div>
<div id="mock"></div>
<script src="data.js"></script>
<script src="constellations.js"></script>
</body>
</html>
