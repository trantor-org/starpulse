<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Design mockup of the single-page StarPulse view, under operator review; not served by
  starpulse. data.js is a saved Board snapshot, and the page replays its last hour at 60x.
  View it with: uv run python -m http.server 8781 --directory design
-->
<title>StarPulse — single-page mockup</title>
<style>
:root { --bg0: #05070d; --ink: #dbe4f3; --muted: #6b7a93; --rail: 250px; --nav: 52px; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; }
canvas.drag { cursor: grabbing; }
aside { position: fixed; z-index: 2; top: 0; bottom: 0; box-sizing: border-box; padding: 20px 18px; overflow: hidden; background: rgba(8,12,22,.78);
  backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 18px; font-size: 11px; color: var(--muted); }
aside h3 { margin: 0 0 8px; font-size: 10px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
#rail { right: 0; width: var(--rail); border-left: 1px solid rgba(148,163,184,.10); }
/* the navigator is a hair-thin hover zone; hovering fades a wispy panel in over the canvas, no hard edge, no layout shift */
#nav { left: 0; width: var(--nav); padding: 0; overflow: visible; z-index: 5; background: none; backdrop-filter: none; gap: 0; }
/* nothing sits behind the navigator: a faint hairline is the only cue, and the panel fades in place (no slide, no growth) */
#nav::after { content: ""; position: absolute; left: 0; top: 25%; bottom: 25%; width: 1px; background: linear-gradient(transparent, rgba(148,163,184,.22), transparent); transition: opacity .4s ease; pointer-events: none; }
#nav:hover::after, #nav:focus-within::after { opacity: 0; }
body:has(#nav:hover) #crumbs, body:has(#nav:focus-within) #crumbs { opacity: 0; }
#crumbs { transition: opacity .4s ease; }
#full { position: absolute; left: 0; top: 0; bottom: 0; width: 310px; box-sizing: border-box; padding: 20px 52px 20px 18px; display: flex; flex-direction: column; gap: 16px;
  isolation: isolate; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
#full::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(4,7,14,.9), rgba(4,7,14,.6) 60%, rgba(4,7,14,0));
  -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent); mask-image: linear-gradient(90deg, #000 45%, transparent); backdrop-filter: blur(7px); }
#nav:hover #full, #nav:focus-within #full { opacity: 1; pointer-events: auto; }
#full .t { font-weight: 300; letter-spacing: .02em; }
#mini .mg { display: block; border-radius: 50%; border: 1.5px solid #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,.5); }
#mini .mg.here { background: rgba(167,139,250,.4); }
#mini .lv { width: 1px; height: 14px; background: rgba(148,163,184,.25); margin: -8px 0; }
#mini .pulse { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
#mini .cnt { font: 10px "JetBrains Mono", ui-monospace, monospace; color: #fbbf24; }
#q { all: unset; box-sizing: border-box; width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid rgba(148,163,184,.2); background: rgba(148,163,184,.06); font-size: 12px; color: var(--ink); }
#q:focus { border-color: #a78bfa; }
.node.series { align-items: start; } .node.series .t { white-space: normal; } .node.series .chain { display: block; margin-top: 3px; font-size: 10.5px; color: var(--muted); line-height: 1.7; }
.node.series .card { padding: 0 5px; border: 1px solid #2a3550; border-radius: 4px; } .node.series .via { margin: 0 4px; color: #64748b; font-size: 10px; }
body:not(.mock-a) .mocka { display: none !important; }
.node .chev { color: #475569; font-size: 10px; padding: 2px 4px; cursor: pointer; }
.node .chev:hover { color: var(--ink); }
.more { all: unset; cursor: pointer; display: block; padding: 3px 0 3px 30px; font-size: 11px; color: #64748b; }
.more:hover { color: var(--ink); }
#nav h1 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--ink); opacity: .85; }
#nav .sub { margin-top: 6px; font-size: 11px; line-height: 1.6; }
#nav .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 8px #34d399; }
#clock { color: #fbbf24; font: 10.5px "JetBrains Mono", ui-monospace, monospace; }
/* layer navigator: one node per level, a dashed spine joins a level to its children, the current path is lit */
.node { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px;
  width: 100%; padding: 5px 8px 5px 0; border-radius: 6px; color: #94a3b8; }
.node:hover { background: rgba(148,163,184,.08); color: var(--ink); }
.node.on { background: linear-gradient(90deg, rgba(167,139,250,.18), rgba(167,139,250,0)); color: var(--ink); }
.node.here { box-shadow: inset 2px 0 0 #a78bfa; }
.node .g { justify-self: center; border-radius: 50%; border: 1.5px solid currentColor; transition: box-shadow .2s, border-color .2s; }
.node .n { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.node.live .g { box-shadow: 0 0 0 3px rgba(251,191,36,.25), 0 0 10px #fbbf24; border-color: #fbbf24; }
.kids { margin-left: 10px; padding-left: 8px; border-left: 1px dashed rgba(148,163,184,.18); }
.lvl { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: #3f4c66; margin: 6px 0 2px 30px; }
#rail .row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
#rail button, #cons button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); letter-spacing: .04em; }
#rail button:hover, #cons button:hover { color: var(--ink); }
#cons button i { width: 5px; height: 5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399; }
#rail button.off { opacity: .35; text-decoration: line-through; }
#graphhead b { color: var(--ink); font-weight: 500; } #gates { font-size: 11px; line-height: 1.5; } #gates .k, .var .k { color: var(--muted); font-size: 10.5px; }
.var { display: grid; grid-template-columns: 58px 1fr 80px; text-align: left; align-items: center; gap: 6px; font-size: 11px; padding: 2px 4px; border-radius: 4px; cursor: default; white-space: nowrap; overflow: hidden; } .var:hover, .var.on { background: rgba(251,191,36,.08); } #outliers .var { cursor: pointer; } #ics a { color: #93c5fd; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; } .chip { font-size: 10.5px; padding: 1px 7px; border: 1px solid #2a3550; border-radius: 9px; color: var(--muted); cursor: pointer; white-space: nowrap; } .chip.on { color: var(--ink); border-color: #93c5fd; }
#levelcfg { margin: 0; font: 10.5px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre; }
#ics button { width: 100%; justify-content: space-between; white-space: nowrap; } #ics .k { font-size: 10.5px; opacity: .7; } #ics button.anon { cursor: default; opacity: .6; }
#feed { font: 10.5px/1.75 "JetBrains Mono", ui-monospace, monospace; flex: 1; min-height: 0; overflow: hidden; }
#feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed b { font-weight: 400; color: var(--ink); } #feed em { font-style: normal; opacity: .6; }
#legend { line-height: 1.9; }
#legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 5px 0 0; vertical-align: 0; }
#legend span { margin-right: 10px; white-space: nowrap; }
.hud { position: fixed; z-index: 2; left: calc(var(--nav) + 24px); pointer-events: none; font-size: 12px; color: var(--muted); }
#crumbs { display: none; }
#crumbs button { all: unset; cursor: pointer; color: var(--muted); } #crumbs button:hover { color: var(--ink); }
#crumbs b { font-weight: 500; color: var(--ink); } #crumbs span { color: #3b4760; }
#tip { position: fixed; z-index: 4; pointer-events: none; padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.5;
  background: rgba(12,19,34,.92); border: 1px solid rgba(148,163,184,.18); backdrop-filter: blur(6px); max-width: 380px; opacity: 0; transition: opacity .12s; }
#tip .k { color: var(--muted); font-size: 11px; } #tip .n { font-weight: 500; }
#panel { position: fixed; z-index: 3; top: 20px; right: calc(var(--rail) + 20px); width: 380px; max-height: calc(100% - 40px); overflow: auto; box-sizing: border-box;
  padding: 16px 18px; border-radius: 10px; font-size: 12px; line-height: 1.6; background: rgba(12,19,34,.95); border: 1px solid rgba(148,163,184,.2); display: none; }
#panel.open { display: block; }
#panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
#panel .k { color: var(--muted); font-size: 11px; }
#panel .x { position: absolute; top: 10px; right: 14px; cursor: pointer; color: var(--muted); }
#panel .desc { margin-top: 10px; white-space: pre-wrap; color: #b8c4d8; }
#panel table { border-collapse: collapse; margin-top: 8px; width: 100%; }
#tip .stats { display: flex; gap: 12px; margin: 6px 0 2px; } #tip .stats b { color: #fbbf24; font-weight: 600; }
#tip .fc { margin-top: 4px; color: #8b95a8; font-size: 11px; border-top: 1px dashed rgba(148,163,184,.25); padding-top: 4px; }
#panel table.trace td:first-child { color: #fbbf24; width: 22px; } #panel table.trace td:last-child { text-align: right; color: var(--muted); }
#panel td { padding: 2px 8px 2px 0; vertical-align: top; } #panel td:first-child { color: var(--muted); white-space: nowrap; }
#panel .run { margin-top: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #34d399; background: rgba(52,211,153,.12); color: #34d399; cursor: pointer; font: inherit; }
#panel .run[disabled] { border-color: #475569; color: #64748b; background: none; cursor: not-allowed; }
#panel .note { margin-top: 6px; color: var(--muted); font-size: 11px; }
.chip { display: inline-block; padding: 0 6px; margin: 2px 4px 0 0; border-radius: 4px; background: rgba(148,163,184,.12); font-size: 11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside id="nav">
  <div id="full">
    <section><h1>StarPulse</h1><div class="sub"><span class="dot"></span><span id="stamp"></span></div></section>
    <section><input id="q" placeholder="filter layers…" autocomplete="off"></section>
    <section style="flex:1;min-height:0;overflow:auto"><h3>Layers</h3><div id="layers"></div></section>
    <section><h3>Card series</h3><div id="series"></div></section>
    <section><h3>Constellations</h3><div id="cons"></div></section>
  </div>
</aside>
<div id="clock" class="hud" style="top:18px;left:auto;right:calc(var(--rail) + 24px)"></div>
<div id="crumbs" class="hud"></div>
<div id="graphhead" class="hud" style="top:18px"></div>
<aside id="rail">
  <section class="graphonly"><h3>Mock</h3><div id="mocks"></div></section>
  <section class="graphonly"><h3>Activity · one dot is</h3><div id="activity"></div></section>
  <section id="graphrail" class="graphonly"><h3>Group by</h3><div id="ics"></div></section>
  <section class="graphonly mocka"><h3>Gates</h3><div id="gates"></div></section>
  <section class="graphonly mocka"><h3>Path variants</h3><div id="variants"></div></section>
  <section class="graphonly mocka"><h3>Off the norm</h3><div id="outliers"></div></section>
  <section id="actors"><h3>Actors</h3><div class="row" id="kinds"></div></section>
  <section class="boardonly" style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>Recent</h3><div id="feed"></div></section>
  <section id="legend" class="boardonly"><h3>Legend</h3></section>
  <section class="graphonly"><h3>Defined by</h3><pre id="levelcfg"></pre></section>
  <section class="graphonly"><h3>Legend</h3><div id="graphlegend" style="font-size:11px;line-height:1.7;color:var(--muted)"></div></section>
</aside>
<div id="tip"></div>
<div id="panel"></div>
<script src="../data.js"></script>
<script src="../history.js"></script>
<script src="../trace.js"></script>
<script>
"use strict";
const S = window.SNAP, TAU = Math.PI * 2, TZ = "America/Phoenix";
// ?stress=N, for design review only: N more lifecycle machines under In Progress, each launched by two DAGs, and N/2 more DAGs that write
// Board events, so a review can see how the layout holds as the system grows
const STRESS = +new URLSearchParams(location.search).get("stress") || 0, STRESS_FLOWS = [], STRESS_DAGS = { launch: [], board: [] };
if (STRESS) { const base = S.flows["auditing-docs"], d0 = S.dags.find((d) => d.name === "board-autopilot"), evs = ["CLAIM", "REVIEW", "DEFER", "MERGED", "DEPS_DONE", "PARK_ON_TASK", "SEND_BACK", "RESUME"];
  for (let i = 1; i <= STRESS; i++) { const n = `machine-${String(i).padStart(2, "0")}`; S.flows[n] = { ...base, name: n, agents: [] }; STRESS_FLOWS.push(n);
    for (const k of [1, 2]) { const dn = `${n}-dag-${k}`; S.dags.push({ ...d0, name: dn }); S.launches.push({ dag: dn, skill: n, flow: n }); STRESS_DAGS.launch.push(dn); } }
  for (let i = 1; i <= Math.ceil(STRESS / 2); i++) { const dn = `board-writer-${String(i).padStart(2, "0")}`; S.dags.push({ ...d0, name: dn }); STRESS_DAGS.board.push(dn);
    (S.writers[evs[i % evs.length]] ||= []).push({ actor: dn, trigger: "stress" }); } }
const BOARD_COLOR = { new: "#94a3b8", ready: "#60a5fa", waiting: "#fbbf24", blocked: "#fb7185", in_progress: "#a78bfa",
  review: "#e879f9", needs_attention: "#64748b", done: "#34d399", completed: "#2dd4bf", archived: "#475569" };
const DAG_COLOR = { running: "#fbbf24", queued: "#93c5fd", succeeded: "#34d399", failed: "#fb7185", partially_succeeded: "#fcd34d",
  aborted: "#94a3b8", cancelled: "#94a3b8", not_started: "#334155" };
const RAMP = ["#94a3b8", "#60a5fa", "#818cf8", "#a78bfa", "#c084fc", "#e879f9", "#f472b6", "#fbbf24", "#34d399"];
const ACT = "#fbbf24"; // activity: everything that moves on any level uses this one colour
const modelColor = (m = "") => (m.includes("opus") ? "#c4b5fd" : m.includes("sonnet") ? "#67e8f9" : "#fde68a");
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const hhmm = (sec) => new Date(sec * 1000).toLocaleTimeString("en-US", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);

// ---- DAG constellations: grouped by domain, ordered by name, spread along a band ----
const GROUPS = [
  { id: "delivery", name: "Delivery & CI", dags: ["apply-on-merge", "coderabbit-usage-metrics", "cr-sweep", "deliver", "github-actions-queue-metrics", "github-rulesets-drift", "mutation-metrics", "setup-vm-apply", "unraid-apply-merged", "whole-repo-gate"] },
  { id: "board", name: "Board", dags: ["backlog-sweep", "board-autopilot", "board-dependency-reconciliation", "drift-to-task", "main-follow", "phantom-deletes-to-task", "worktree-reap"] },
  { id: "agents", name: "Agent jobs & evals", dags: ["alert-investigation", "nightly-audit", "session-transcript-stats", "skill-conformance", "skill-eval", "skill-optimize", "trace-cluster-report", "weekly-code-audit"] },
  { id: "retrieval", name: "Retrieval & tags", dags: ["graph-refresh", "memory-reindex", "rag-audit-nominations", "rag-metrics", "semantic-tag-merges", "tag-analytics", "tag-optimizer", "tag-performers", "tag-signals"] },
  { id: "ops", name: "Host ops & backups", dags: ["cleanup-workspace", "grafana-db-snapshot", "grafana-rule-health", "healthcheck", "postgres-backup", "postgres-restore-verify", "superseded-images-sweep", "testcontainers-sweep"] },
];
GROUPS.find((g) => g.id === "agents").dags.push(...STRESS_DAGS.launch); GROUPS.find((g) => g.id === "board").dags.push(...STRESS_DAGS.board);
const GTINT = { "Delivery & CI": "#7dd3fc", Board: "#c4b5fd", "Agent jobs & evals": "#f0abfc", "Retrieval & tags": "#86efac", "Host ops & backups": "#fcd34d" };
// Operator-approved run-safe set (idempotent re-runs); the build slice declares this per DAG.
const RUNNABLE = new Set(["whole-repo-gate", "healthcheck", "graph-refresh", "memory-reindex", "rag-metrics", "tag-analytics", "grafana-rule-health",
  "github-rulesets-drift", "mutation-metrics", "session-transcript-stats", "github-actions-queue-metrics", "coderabbit-usage-metrics", "trace-cluster-report", "skill-conformance"]);
const dagBy = Object.fromEntries(S.dags.map((d) => [d.name, d]));
const dagGroup = Object.fromEntries(GROUPS.flatMap((g) => g.dags.map((d) => [d, g.name])));
// a DAG is drawn as its own step graph: steps layered by dependency depth, one link per dependency
function glyph(d) {
  // a fold of several DAGs is a fanned stack of up to three steps, one per DAG, in each one's status colour
  if (d.fold) { const top = d.fold.slice(0, 3); return { nodes: top.map((n, i) => ({ name: n, status: dagBy[n]?.status || "not_started", x: (i - (top.length - 1) / 2) * 9, y: -(i - (top.length - 1) / 2) * 5 })), links: [], w: 18, h: 10, br: 18 }; }
  const steps = d.steps || [], by = Object.fromEntries(steps.map((s) => [s.name, s])), depth = {};
  const dep = (n) => (depth[n] ??= 1 + Math.max(-1, ...by[n].depends.filter((x) => by[x] && x !== n).map(dep)));
  steps.forEach((s) => dep(s.name));
  const cols = {}; steps.forEach((s) => (cols[depth[s.name]] ||= []).push(s));
  const L = Math.max(0, ...Object.keys(cols).map(Number)) + 1, SX = 28, SY = 18, pos = {}, nodes = [];
  for (const [l, list] of Object.entries(cols)) list.forEach((s, i) => { const n = { name: s.name, status: s.status, x: (l - (L - 1) / 2) * SX, y: (i - (list.length - 1) / 2) * SY }; pos[s.name] = n; nodes.push(n); });
  const links = steps.flatMap((s) => s.depends.filter((x) => pos[x]).map((x) => [pos[x], pos[s.name]]));
  const w = (L - 1) * SX, h = (Math.max(1, ...Object.values(cols).map((c) => c.length)) - 1) * SY;
  return { nodes: nodes.length ? nodes : [{ name: d.name, status: d.status, x: 0, y: 0 }], links, w, h, br: Math.hypot(w, h) / 2 + 8 };
}
const FOLD = {}; // the folded DAG bodies of the current level, by key
// several DAGs folded into one body: it runs while any of them runs, else shows the status of the one that finished last
function foldOf(ns) { const ds = ns.map((n) => dagBy[n]), fin = ds.map((d) => d.finishedAt).filter(Boolean).sort().at(-1);
  return { name: `${ns.length} DAGs`, fold: ns, steps: [], status: ds.some((d) => d.status === "running") ? "running" : ds.find((d) => d.finishedAt === fin)?.status || "not_started", finishedAt: fin }; }
const star = (name, x, y) => { const d = FOLD[name] || dagBy[name] || { name, status: "not_started", steps: [] }, g = glyph(d); return { ...d, x, y, glyph: g, br: g.br, group: dagGroup[name] || "", runnable: RUNNABLE.has(name) }; };
// lay DAG glyphs side by side, centred on cx, so wide step graphs never overlap their neighbours
function row(names, cx, y, gap = 26) {
  const gl = names.map((n) => glyph(dagBy[n] || { name: n, status: "not_started", steps: [] })), total = gl.reduce((a, g) => a + g.w, 0) + gap * (names.length - 1);
  let x = cx - total / 2;
  return names.map((n, i) => { const s = star(n, x + gl[i].w / 2, y); x += gl[i].w + gap; scene.stars[n] = s; return s; });
}

// ---- drill-down levels: Board -> a state's lifecycle system -> one machine's graph ----
// The build slice derives SUBS and CHILD from lifecycle_machines.board_links (SUBFLOW) and the machine registry.
const SKILLS = ["authoring-skills", "auditing-infrastructure", "auditing-docs", "realigning-stale-docs", "running-skill-evals", ...STRESS_FLOWS].filter((n) => S.flows[n]);
const SUBS = { in_progress: ["in-progress", ...SKILLS] };
// A cue: a DAG that runs on the same trigger as a Board event's writer but writes no lane itself. A merge to main submits main-follow, which
// writes MERGED (Review -> Done), and beside it apply-on-merge and graph-refresh. Declared here for the mockup; the build declares it in board_links.
const CUES = [{ dag: "apply-on-merge", event: "MERGED", state: "done", on: "each merge to main" },
  { dag: "graph-refresh", event: "MERGED", state: "done", on: "each merge to main" }].filter((c) => dagBy[c.dag]);
const cueLine = (n) => CUES.filter((c) => c.dag === n).map((c) => `runs on ${esc(c.on)}, beside ${esc(c.event)} (Review → Done)`).join("; ");
const CHILD = { "in-progress": { pr_opened: { flow: "triaging-cr-reviews", when: "while a PR is open" } } };
// ?stress: skill machines with sub-states of their own (authoring-skills while its evals run; every third stress machine while it reads, the
// first while it reads and while its reader is tested), so a review sees sub-states on many machines and on more than one page
if (STRESS) { CHILD["authoring-skills"] = { skill_drafted: { flow: "running-skill-evals", when: "while its evals run" } };
  STRESS_FLOWS.forEach((n, i) => { if (i % 3 === 0) CHILD[n] = { reading: { flow: "running-skill-evals", when: "while it reads" },
    ...(i ? {} : { reader_tested: { flow: "running-skill-evals", when: "while its reader is tested" } }) }; }); }
const board = S.flows.board;

    dot(s.x, s.y, 4.2, "rgba(6,10,20,0.9)"); circle(s.x, s.y, 4.2, rgba(col, hot ? 1 : 0.8), hot ? 1.5 : 1); dot(s.x, s.y, 1.6, rgba(col, 0.9));

}
function drawStars() {
  for (const grp of scene.groups) {
    if (grp.head !== false) label(grp.name.toUpperCase(), grp.lx, grp.ly, false, null, 10.5);
    for (const s of grp.stars) {
      const col = DAG_COLOR[s.status] || "#94a3b8", hot = isHot("dag", s), g = s.glyph, r = hot ? 4.4 : 3.4;
      if (hot || scene.fold) for (const a of s.tethers || []) { if (a.none) continue; // one tether to the middle of the path most of its criteria are on, drawn only while the DAG is hovered (always on a fold's level)
        const heat = 0, tx = a.g ? a.g.x + ((s.x - a.g.x) / Math.hypot(s.x - a.g.x, s.y - a.g.y)) * a.g.R : a.x, ty = a.g ? a.g.y + ((s.y - a.g.y) / Math.hypot(s.x - a.g.x, s.y - a.g.y)) * a.g.R : a.y;
        const lo = a.cue ? 0.5 : 1; // a cue is a looser tie than a write or a launch: half as bright, sparser dots
        cx.strokeStyle = rgba("#fbbf24", (hot ? 0.85 : 0.45 + heat * 0.45) * lo); cx.lineWidth = (hot ? 1.3 : 1) / K ** 0.5; cx.setLineDash(a.cue ? [1.5 / K, 8 / K] : [2 / K, 5 / K]); cx.lineDashOffset = -clock * 8 / K;
        cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(tx, ty); cx.stroke(); cx.setLineDash([]); if (!a.g) dot(tx, ty, 2.2 / K ** 0.5, rgba("#fbbf24", hot ? 0.8 : 0.3 + heat * 0.5)); }
      if (hot || s.status === "running") { // no resting glow: only a hovered or currently running DAG gets a faint halo
        const glow = cx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.br * 1.3); glow.addColorStop(0, rgba(col, 0.09)); glow.addColorStop(1, rgba(col, 0));

      label(s.name, s.x, s.y + g.h / 2 + 16 / K, hot, null, 11);

      const nr = (g.nodes.length === 1 ? 5.5 : 4) * (hot ? 1.15 : 1);
      for (const [p, q] of g.links) { const a = { x: s.x + p.x, y: s.y + p.y, color: DAG_COLOR[p.status] || "#94a3b8" }, b = { x: s.x + q.x, y: s.y + q.y, color: DAG_COLOR[q.status] || "#94a3b8" };
        const live = p.status === "running" || q.status === "running", dx = (b.x - a.x) / 2;
        flow(a, b, hot || live ? 0.8 : 0.42, live ? 0.6 : 0, [1.5, 3.5]);
        cx.beginPath(); cx.moveTo(a.x + nr, a.y); cx.bezierCurveTo(a.x + dx, a.y, b.x - dx, b.y, b.x - nr, b.y); cx.stroke(); cx.setLineDash([]); }
      for (const n of g.nodes) { const c = DAG_COLOR[n.status] || col, idle = n.status === "not_started", x = s.x + n.x, y = s.y + n.y;
        dot(x, y, nr, "rgba(6,10,20,0.9)"); circle(x, y, nr, rgba(c, hot ? 1 : idle ? 0.45 : 0.85), hot ? 1.4 : 1); dot(x, y, nr * 0.34, rgba(c, idle ? 0.45 : 0.9)); }
      if (s.runnable) circle(s.x, s.y, s.br, rgba("#dbe4f3", 0.35), 1, [2, 3]);

      if (fin && fin <= T && T - fin < PULSE) pulse(s.x, s.y, s.br, (T - fin) / PULSE, ACT, 38, [0]); // a run ending rings once
    }
  }
}
// fold level: the path between its two states, streaming toward the state it writes, with each event its DAGs write marked on it
function drawFold() {
  const f = scene.fold; if (!f?.a) return;
  const heat = Math.max(hotEdge.has(`board:${f.a.id}>${f.b.id}`) ? 1 : 0, ...f.dags.map(dagHeat)), lit = hover?.kind === "dag";
  flow({ ...f.p0, color: f.a.color }, { ...f.p1, color: f.b.color }, (lit ? 0.75 : 0.4) + heat * 0.4, heat + (lit ? 0.5 : 0));
  cx.beginPath(); cx.moveTo(f.p0.x, f.p0.y); cx.lineTo(f.p1.x, f.p1.y); cx.stroke(); cx.setLineDash([]); arrow(f.p0, f.p1, rgba(f.b.color, 0.6));
  for (const s of [f.a, f.b]) { disc(s.x, s.y, s.r, s.color, false, s.final); label(s.name, s.x, s.y + s.r + 24 / K, false, null, 13); }
  for (const e of f.events) { const hot = lit && hover.o.tethers?.some((t) => t.ev === e.name), r = 4 / K ** 0.5;
    dot(e.x, e.y, r, "rgba(6,10,20,0.95)"); circle(e.x, e.y, r, rgba("#fbbf24", hot ? 1 : 0.6), 1.2 / K ** 0.5); label(e.name, e.x, e.y + 22 / K, hot, null, 11); }

function drawScene(k, x, y) {
  const dpr = devicePixelRatio || 1; cx.setTransform(k * dpr, 0, 0, k * dpr, x * dpr, y * dpr);
  K = k; ZS = Math.max(1, k / fitScene().k);
  if (scene.graph) { drawGraph(); return; }
  drawFold(); drawGalaxies(); drawMoons(); drawSats(); drawHangar(); drawBoardEdges(); drawStateLinks(); drawSun(); drawPlanets(); drawOwned(); drawTasks();
  drawMachineEdges(scene.mEdges); drawStates(scene.mStates, true); drawOccupants(); drawStars(); drawTrace(k, x, y);
}
function frame(now) {
  clock = now / 1000; T = replayT(now); if (anim) anim(now); update(now);
  if (mouse) setHover(hit((mouse.ox - view.x) / view.k, (mouse.oy - view.y) / view.k), mouse.cx, mouse.cy);
  const dpr = devicePixelRatio || 1; cx.globalAlpha = 1; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // the current board's night sky: a radial wash and 160 slow-twinkling stars with a slight parallax against the view
  const g = cx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.75); g.addColorStop(0, "#0e1628"); g.addColorStop(1, "#04060b"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const s of STARS) { cx.fillStyle = `rgba(200,215,240,${0.08 + 0.12 * (0.5 + 0.5 * Math.sin(now * 0.0006 + s.p))})`; cx.beginPath(); cx.arc(s.x * W, (((s.y * H + view.y * 0.06 * s.r) % H) + H) % H, s.r, 0, TAU); cx.fill(); }
  if (!trans) drawScene(view.k, view.x, view.y);
  else { // in: the old level blows up through the clicked point and fades; the new one grows out of it. out: the reverse
    const q = Math.min(1, (now - trans.t0) / 520), e = ease(q), f = trans.f;
    const sNew = trans.inward ? 0.3 + 0.7 * e : 2.6 - 1.6 * e, sOld = trans.inward ? 1 + 2.5 * e : 1 - 0.7 * e;
    cx.globalAlpha = e; drawScene(view.k * sNew, f.x + sNew * (view.x - f.x), f.y + sNew * (view.y - f.y));
    cx.globalAlpha = 1 - e; cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.drawImage(trans.snap, f.x * (1 - sOld), f.y * (1 - sOld), W * sOld, H * sOld);
    cx.globalAlpha = 1; if (q >= 1) trans = null;
  }
  document.getElementById("clock").textContent = `▶ replaying ${hhmm(T)} MST · last hour at ${REPLAY.speed}×`;
  requestAnimationFrame(frame);
}

// ---- left: layer navigator + constellations; top: breadcrumbs; right: actors, feed, legend ----
const samePath = (a, b) => a.length === b.length && a.every((l, i) => l.kind === b[i].kind && levelName(l) === levelName(b[i]));
const onPath = (p) => p.length <= stack.length && p.every((l, i) => l.kind === stack[i].kind && levelName(l) === levelName(stack[i]));
const openStates = new Set(), showAll = new Set(); let query = "";
const CAP = 5; // machines listed per state before "+ N more"; the machine on the current path is always listed
function node(path, label, count, size, flow, toggle) {
  const b = document.createElement("button"); b.className = "node" + (onPath(path) ? " on" : "") + (samePath(path, stack) ? " here" : "");
  if (flow) b.dataset.flow = flow;
  b.innerHTML = `<i class="g" style="width:${size}px;height:${size}px"></i><span class="t">${esc(label)}</span><span class="n">${toggle ? `<span class="chev">${openStates.has(toggle) || onPath(path) ? "▾" : "▸"}</span>` : ""}${esc(count)}</span>`;
  b.onclick = (e) => { if (toggle && e.target.classList.contains("chev")) { openStates.has(toggle) ? openStates.delete(toggle) : openStates.add(toggle); return renderNav(); }
    samePath(path, stack) ? flyTo(fitScene()) : go(path); };
  return b;
}
const liveFirst = (a, b) => moving(b).length - moving(a).length || S.flows[b].agents.length - S.flows[a].agents.length;
function group(parent, label) { const d = document.createElement("div"); d.className = "kids"; if (label) d.insertAdjacentHTML("beforeend", `<div class="lvl">${label}</div>`); parent.append(d); return d; }
function renderNav() {
  const el = document.getElementById("layers"); el.innerHTML = "";
  const cur = stack[1]?.ic || "adinb", root = [GRAPH_ROOT, { kind: "board", ic: cur }], q = query.trim().toLowerCase(), cnt = (id) => board.agents.filter((a) => a.state === id).length;
  const statePath = (id) => [...root, { kind: "state", id }];
  el.append(node([GRAPH_ROOT], "Flow graph", TRAJ.filter((t) => t.open).length, 15));
  const icg = group(el); let icKids = null;
  for (const ic of SOURCES.filter((x) => x.shared)) { icg.append(node([GRAPH_ROOT, { kind: "board", ic: ic.id }], `Board · ${ic.name}`, TRAJ.filter((t) => t.ic === ic && t.open).length, 13)); if (stack.length > 1 && ic.id === cur) icKids = group(icg); }
  if (stack.length < 2 && !q) return renderCrumbs();
  if (q) { // filtering: a flat list of every layer whose name matches, however deep
    const hits = group(el, "Matches"); let n = 0;
    for (const st of board.machine.states) if (st.name.toLowerCase().includes(q)) { hits.append(node(statePath(st.id), st.name, cnt(st.id), 10)); n++; }
    for (const [sid, subs] of Object.entries(SUBS)) for (const m of subs) if (m.includes(q)) { hits.append(node([...statePath(sid), { kind: "machine", flow: m }], m, S.flows[m].agents.length, 8, m)); n++; }
    for (const c of Object.values(CHILD)) for (const ch of Object.values(c)) if (ch.flow.includes(q)) { hits.append(node([...statePath("in_progress"), { kind: "machine", flow: "in-progress" }, { kind: "machine", flow: ch.flow }], ch.flow, S.flows[ch.flow].agents.length, 6, ch.flow)); n++; }
    if (!n) hits.insertAdjacentHTML("beforeend", '<div class="lvl">no layer matches</div>');
  } else {
    const kids = icKids || group(el);
    for (const st of board.machine.states) {
      const sp = statePath(st.id), subs = (SUBS[st.id] || []).slice().sort(liveFirst), open = subs.length && (openStates.has(st.id) || onPath(sp));
      kids.append(node(sp, st.name, cnt(st.id), subs.length ? 11 : 9, null, subs.length ? st.id : null));
      if (!open) continue;
      const mk = group(kids), pathM = stack[3]?.flow, shown = showAll.has(st.id) ? subs : subs.filter((m, i) => i < CAP || m === pathM);
      for (const m of shown) {
        const mp = [...sp, { kind: "machine", flow: m }]; mk.append(node(mp, m, S.flows[m].agents.length, 8, m));
        const ck = onPath(mp) ? Object.values(CHILD[m] || {}) : []; if (!ck.length) continue;
        const cd = group(mk); for (const c of ck) cd.append(node([...mp, { kind: "machine", flow: c.flow }], c.flow, S.flows[c.flow].agents.length, 6, c.flow));
      }

    }

}
function renderCrumbs() {
  document.getElementById("actors").style.display = stack.length < 2 ? "none" : "";
  document.getElementById("clock").style.display = stack.length < 2 ? "none" : ""; // the Board's replay clock; the graph draws its own
  document.querySelectorAll(".graphonly").forEach((e) => (e.style.display = stack.length < 2 ? "" : "none")); document.querySelectorAll(".boardonly").forEach((e) => (e.style.display = stack.length < 2 ? "none" : (e.id === "legend" ? "" : "flex"))); document.getElementById("graphhead").style.display = stack.length < 2 ? "" : "none";
  const crumbs = document.getElementById("crumbs"); crumbs.innerHTML = "";
  stack.forEach((l, i) => { if (i) crumbs.insertAdjacentHTML("beforeend", "<span>›</span>");
    if (i === stack.length - 1) { crumbs.insertAdjacentHTML("beforeend", `<b>${esc(levelName(l))}</b>`); return; }
    const b = document.createElement("button"); b.textContent = levelName(l); b.onclick = () => go(stack.slice(0, i + 1)); crumbs.append(b); });
}
// a lifecycle node in the navigator glows while its machine is moving
setInterval(() => document.querySelectorAll(".node[data-flow]").forEach((b) => b.classList.toggle("live", moving(b.dataset.flow).length > 0)), 200);
document.getElementById("q").addEventListener("input", (e) => { query = e.target.value; renderNav(); });

    b.onclick = () => { const box = () => { const s = scene.groups.find((g) => g.name === grp.name).stars, xs = s.map((q) => q.x), ys = s.map((q) => q.y); return fitBox(Math.min(...xs) - 60, Math.min(...ys) - 80, Math.max(...xs) + 60, Math.max(...ys) + 80, 0.9); };
      if (stack.at(-1).kind !== "dags") go([GRAPH_ROOT, { kind: "board", ic: stack[1]?.ic || "adinb" }, { kind: "dags" }], W / 2, H / 2, box); else flyTo(box()); }; cons.append(b); }

    b.onclick = () => { hiddenKinds.has(k) ? hiddenKinds.delete(k) : hiddenKinds.add(k); localStorage.setItem("fv.hidden", JSON.stringify([...hiddenKinds])); renderRail(); }; kinds.append(b); }

    <span><i style="background:#6b7a93"></i>interactive</span><span><i style="border:1.5px solid #6b7a93;box-sizing:border-box"></i>unattended</span><span><i style="background:#6b7a93;border-radius:0"></i>ci</span><br>
    <span><i style="background:#34d399"></i>ok</span><span><i style="background:#fb7185"></i>failed</span><span><i style="border:1px solid #dbe4f3;background:none;box-sizing:border-box"></i>runnable</span><br>
    <span><i style="background:#c084fc;box-shadow:0 0 0 2px #0a0e1a,0 0 0 3px #c084fc"></i>lifecycle machine</span><span><i style="background:${ACT};box-shadow:0 0 6px ${ACT}"></i>activity now</span>`;
}
// the feed shows what the replay has reached, newest first
let fedTo = -2;
setInterval(() => { const i = EVENTS.findLastIndex((e) => e.at <= T), dn = S.dags.filter((d) => d.finishedAt && Date.parse(d.finishedAt) / 1000 <= T).length;
  if (i * 100 + dn === fedTo) return; fedTo = i * 100 + dn;
  const ev = EVENTS.slice(0, i + 1).map((e) => ({ at: e.at, html: `<b>${esc(e.task || e.sid.slice(0, 8))}</b> ${esc(e.event.toLowerCase())} <em>${esc(e.flow)}</em>` }));
  S.dags.forEach((d) => { const f = d.finishedAt && Date.parse(d.finishedAt) / 1000; if (f && f <= T) ev.push({ at: f, html: `<b>${esc(d.name)}</b> <em>${esc(d.status)}</em>` }); });
  ev.sort((a, b) => b.at - a.at); document.getElementById("feed").innerHTML = ev.slice(0, 40).map((e) => `<div><em>${hhmm(e.at)}</em> ${e.html}</div>`).join(""); }, 250);

document.getElementById("stamp").textContent = `snapshot ${new Date(S.now * 1000).toLocaleString("en-US", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" })} MST`;

addEventListener("resize", resize);
