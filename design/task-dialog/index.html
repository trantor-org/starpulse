  if (t.plan) out.push(sec("Implementation plan", `<div class="md2">${md(t.plan)}</div>`, { pen: "plan" }));
  else if (editing.size) out.push(`<button class="addplan" data-addplan>＋ Add implementation plan</button>`);
  // N2: notes are prose only; the assignee moved to Session
  if (t.notes) out.push(sec("Notes", `<div class="md2">${md(t.notes)}</div>`, { pen: "notes" }));
  else if (editing.size) out.push(`<button class="addplan" data-addnotes>＋ Add notes</button>`);
  // N8/N15: activity is the read-only record (events, checkpoints); N18: comments are their own section, and a comment never checkpoints
  const ev = (e) => `<div class="ev" id="${e.id}" data-kind="${e.kind}"><span class="dot"></span><div class="hd"><span class="who">${esc(e.who)}</span><span>${esc(e.at)}</span>${e.ac ? `<a class="tag" href="#ac${e.ac}" data-jump="ac${e.ac}">AC #${e.ac}</a>` : ""}${e.kind === "system" ? "<span>event</span>" : ""}</div><div class="bd md2">${inline(e.body)}</div></div>`;
  const acts = t.activity.filter((e) => e.kind !== "comment"), cms = [...t.activity.filter((e) => e.kind === "comment"), ...extra];
  out.push(sec("Activity", acts.length ? `<div class="acts2">${acts.map(ev).join("")}</div>` : `<span class="none">No activity yet</span>`, { id: "activity", n: acts.length || null }));
  out.push(sec("Comments", (cms.length ? `<div class="acts2">${cms.map(ev).join("")}</div>` : "") + `<div class="compose"><textarea aria-label="Add a comment" placeholder="Add a comment"></textarea><button data-post disabled>Comment</button></div>`, { id: "comments", n: cms.length || null }));
  return out.join("");
}

function rail(t) {
  const out = [];
  out.push(sec("Status", `<div class="row">${pill(t.lane[0], t.lane[1], true)}<span class="k">for ${t.forAge}</span></div>`, { rail: true }));
  // N11 + N16: rating shows only on a deviated sample, a run whose randomized profile is a tier off the matrix's
  if (t.sample) {
    const r = t.sample;
    out.push(sec("Rating", `<div class="why">Deviated sample: this run drew a <b>${r.tier}</b> tier than the matrix assigns, to test whether ${r.cell} can run there.</div>
      <dl class="who2 dev"><dt>Matrix</dt><dd>${esc(r.matrix)}</dd><dt>Drew</dt><dd>${esc(r.drew)} <span class="tier">${r.tier === "lower" ? "↓" : "↑"} ${r.tier}</span></dd></dl>
      <div class="why">Did the work hold up?</div>
      <div class="rate"><button type="button" class="ratebtn" data-verdict="pass" aria-pressed="${verdict === "pass"}">Pass</button><button type="button" class="ratebtn" data-verdict="fail" aria-pressed="${verdict === "fail"}">Fail</button></div>
      ${reasonOpen ? `<div class="reason"><input maxlength="140" placeholder="Why, in one line (optional)" aria-label="Fail reason"><button class="btn2" data-reason>Save</button></div>` : ""}`, { rail: true }));
  }
  if (t.session) {
    const s = t.session;
    out.push(sec("Session", `<div class="session"><a href="${s.url}" target="_blank" rel="noopener" class="big"><span class="p"></span>Open the claiming session ↗</a>
      <dl class="who2"><dt>Assignee</dt><dd>${esc(s.profile)}</dd><dt>Session</dt><dd><code>${s.id.slice(0, 8)}</code><button class="mini" data-copy="claude --resume ${s.id}" title="Copy the resume command">⧉ resume</button></dd></dl>
      <div class="k">${esc(s.line)}</div></div>`, { rail: true }));
  }
  if (t.prs.length) out.push(sec("Pull requests", `<div class="prs">${t.prs.map((p) => `<div class="pull"><a href="${p.url}" target="_blank" rel="noopener">${p.ref} ↗</a><span class="chk ${p.read === "unread" ? "unread" : p.read === "failed" ? "pass" : "pass"}"><i></i>${p.checks}</span><span class="rd${p.read === "failed" ? " err" : ""}">${p.at}</span></div>`).join("")}</div>`, { rail: true, n: t.prs.length }));
  if (t.deps.length || t.blocks.length) {
    const row = (id) => `<a class="dep" href="?s=empty&task=${id}" data-task="${id}"><span class="id">${id}</span><span class="tt">${esc(titles[id] || "")}</span>${pill(laneName[lanes[id]], lanes[id], true)}</a>`;
    const open = t.deps.filter((d) => lanes[d] !== "done").length;
    out.push(sec("Dependencies", `<div class="deps">${t.deps.length ? `<div class="lb">Depends on · ${open} open of ${t.deps.length}</div><div class="box" data-box>${t.deps.map(row).join("")}</div>` : ""}${t.blocks.length ? `<div class="lb">Blocks</div><div class="box" data-box>${t.blocks.map(row).join("")}</div>` : ""}</div>`, { rail: true, n: t.deps.length + t.blocks.length }));
  }
  // N5: linked spec and docs
  if (t.docs.length) out.push(sec("Docs", `<div class="docs">${t.docs.map(([k, id, title, href], i) => `<a class="doc" href="${href}" data-doc="${i}"${reading === i ? " aria-current" : ""}><span class="kd">${k}</span><span class="tt" title="${esc(title)}">${id ? `<b>${id}</b>` : ""}${esc(title)}</span></a>`).join("")}</div>`, { rail: true, n: t.docs.length, pen: "docs" }));
  if (t.machines.length) out.push(sec("Machines", `<div class="machs box" data-box>${t.machines.map(([m, s, ago, trail]) => `<details class="m"><summary><span class="p"></span><b>${m}</b><span class="s">${s}</span><span class="k">${ago}</span></summary><ol>${trail.map(([e, st, at]) => `<li><code>${e}</code> → ${st}<span class="k"> Oct 25, ${at}</span></li>`).join("")}</ol></details>`).join("")}</div>`, { rail: true, n: t.machines.length }));
  // N3, N12, N13, N19, N20: first-class fields, then short free-form labels, then provenance meta, in the live props table
  const f = t.fields, ed = editing.has("details");
  if (ed && !draft) draft = [...t.tags];
  const row = (k, v, cls) => `<tr${cls ? ` class="${cls}"` : ""}><td>${k}</td><td>${v}</td></tr>`;
  const opt = (name, vals, cur) => `<select class="fv live" data-f="${name}" aria-label="${name}">${vals.map((v) => `<option${String(v) === String(cur) ? " selected" : ""}>${v}</option>`).join("")}</select>`;
  const chips = (gs, x) => gs.map((g) => `<span class="chip">${esc(g)}${x ? `<button class="x" data-unlabel="${esc(g)}" aria-label="Remove ${esc(g)}">×</button>` : ""}</span>`).join("");
  const flds = ed ? `<table class="props"><tbody>
      ${row("kind", opt("kind", ["execute", "decide", "investigate", "verify"], f.kind))}${row("size", opt("size", [1, 2, 3, 5, 8], f.size))}
      ${row("area", opt("area", ["delivery", "starpulse", "observability", "docs", "infra"], f.area))}${row("mode", opt("mode", ["", "attended", "unattended"], f.mode))}
      ${row("priority", opt("priority", ["High", "Medium", "Low"], f.priority))}
      ${row("labels", `<div class="fv live chips${labelErr ? " bad" : ""}">${chips(draft, true)}<input class="chipinput" data-chipin placeholder="add label" aria-label="Add label" value="${esc(pending)}"></div><div class="rule${labelErr ? " err" : ""}" role="status">${esc(labelErr || RULE)}</div>`)}
      ${row("milestone", opt("milestone", ["m-321", "m-318", "—"], t.docs.find((d) => d[0] === "Milestone")?.[1] || "—"))}
    </tbody></table>${edbar("details")}`
    : `<table class="props"><tbody>
      ${row("kind", f.kind)}${row("size", `<span class="sz">${f.size}</span>`)}${row("area", f.area)}${f.mode ? row("mode", f.mode) : ""}
      ${row("priority", f.priority)}${row("profile", f.profile)}${row("type", f.type)}
      ${row("labels", t.tags.length ? `<span class="chips">${chips(t.tags)}</span>` : `<span class="k">—</span>`, "sep")}
      ${t.meta.map(([k, v]) => row(k, `<span class="meta">${esc(v)}</span>`)).join("")}
      ${row("created", `<span class="k">${t.created}</span>`)}</tbody></table>`;
  out.push(sec("Details", flds, { rail: true, pen: ed ? null : "details", on: ed }));
  return out.join("");
}

let T;
function render(keepScroll) {
  const m = document.getElementById("kbm");
  const ls = m.querySelector(".tvleft")?.scrollTop, rs = m.querySelector(".tvrail")?.scrollTop;
  m.innerHTML = `<div class="modal tv" role="dialog" aria-label="${T.id} ${esc(T.title)}"><div class="tvhead"><div class="tvmeta"><span class="tid">${T.id}</span>
    <button class="copybtn" data-copy="${T.id} ${esc(T.title)}" aria-label="Copy id and title"><span class="g">⧉</span>Copy</button>${pill(T.lane[0], T.lane[1])}<a href="#">Open in Star Map ↗</a>
    <div class="acts"><div class="mv"><button class="mvbtn" aria-haspopup="menu" aria-expanded="false">Move to</button></div><button class="hidebtn">Hide task</button><button class="archbtn">Archive…</button><button class="tvx" aria-label="Close" data-close>✕</button></div></div>
    <div class="titlerow"><textarea data-field="title" class="fv title" rows="1" aria-label="Title" readonly tabindex="-1">${esc(T.title)}</textarea><button class="pen" title="Edit title" aria-label="Edit title">✎ Edit</button></div></div>
    <div class="tvbody"><div class="tvcol tvleft">${left(T)}</div><div class="tvcol tvrail">${rail(T)}</div></div></div>`;
  sizeTitle();
  m.querySelectorAll("[data-box]").forEach(fade);
  if (keepScroll) { m.querySelector(".tvleft").scrollTop = ls || 0; m.querySelector(".tvrail").scrollTop = rs || 0; }
}
const fade = (b) => b.classList.toggle("end", b.scrollTop + b.clientHeight >= b.scrollHeight - 2);
const flash = (el) => { if (!el) return; el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); };

function go(s, task) {
  state = s; reset(s);
  const p = new URLSearchParams(location.search); p.set("s", s); task ? p.set("task", task) : p.delete("task");
  history.replaceState(null, "", "?" + p.toString());
  if (task) qs.set("task", task); else qs.delete("task");
  T = taskFor(s); render(); bar();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a, label");
  if (!el) return;
  const d = el.dataset;
  if (d.task) { e.preventDefault(); return go("empty", d.task); }
  if (d.jump) { e.preventDefault(); return flash(document.getElementById(d.jump)); }
  if (d.edit) { editing.add(d.edit); return render(true); }
  if (d.cancel) { editing.delete(d.cancel); if (d.cancel === "details") { draft = null; pending = ""; labelErr = ""; } return render(true); }
  if (d.save === "description") { T.description = document.querySelector("[data-desc]").value; editing.delete("description"); return render(true); }
  if (d.unlabel) { draft = draft.filter((g) => g !== d.unlabel); return render(true); }
  if (d.save === "details") {
    // N12/N20: the server validates every field on write; a label outside the convention is refused, not stored
    if (pending.trim() && !addLabel()) return;
    const v = Object.fromEntries([...document.querySelectorAll("[data-f]")].map((x) => [x.dataset.f, x.value]));
    Object.assign(T.fields, { kind: v.kind, size: +v.size, area: v.area, mode: v.mode, priority: v.priority });
    T.tags = draft; draft = null; editing.delete("details"); return render(true);
  }
  if (d.doc) { e.preventDefault(); reading = +d.doc; render(true); document.querySelector(".tvleft").scrollTop = 0; return; }
  if ("back" in d) { reading = null; return render(true); }
  if ("addplan" in d) { T.plan = "1. "; editing.add("plan"); return render(true); }
  if (d.verdict) { verdict = verdict === d.verdict ? null : d.verdict; reasonOpen = verdict === "fail"; return render(true); }
  if ("reason" in d) { reasonOpen = false; return render(true); }
  if ("post" in d) {
    const box = document.querySelector(".compose textarea"); const v = box.value.trim(); if (!v) return;
    const id = "x" + (extra.length + 1);
    extra.push({ id, kind: "comment", who: "Adin", at: "11:10", body: v });
    render(true); return flash(document.getElementById(id));
  }
  if (d.copy) { navigator.clipboard?.writeText(d.copy).catch(() => {}); const o = el.innerHTML; el.textContent = "Copied"; setTimeout(() => (el.innerHTML = o), 900); return; }
  if (el.matches("label.ritem")) { const i = el.querySelector("input"); setTimeout(() => el.classList.toggle("done", i.checked)); }
});
function addLabel() {
  const g = pending.trim(); labelErr = checkLabel(g) || (draft.includes(g) ? `"${g}" is already on this task.` : "");
  if (!labelErr) { draft.push(g); pending = ""; }
  render(true); const i = document.querySelector("[data-chipin]"); i?.focus(); i?.setSelectionRange(i.value.length, i.value.length);
  return !labelErr;
}
document.addEventListener("input", (e) => {
  if (e.target.matches(".compose textarea")) document.querySelector("[data-post]").disabled = !e.target.value.trim();
  if (e.target.matches("[data-chipin]")) { pending = e.target.value; if (labelErr) { labelErr = ""; e.target.parentElement.classList.remove("bad"); const r = document.querySelector(".rule"); r.classList.remove("err"); r.textContent = RULE; } }
});
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey, on = e.target.closest?.(".sec.on");
  if (e.key === "Enter" && mod && e.target.matches(".compose textarea")) return document.querySelector("[data-post]").click();
  if (on && e.key === "Enter" && mod) { e.preventDefault(); return on.querySelector("[data-save]").click(); }
  if (on && e.key === "Escape") { e.preventDefault(); return on.querySelector("[data-cancel]").click(); }
  if (e.key === "Enter" && e.target.matches("[data-chipin]") && pending.trim()) { e.preventDefault(); return addLabel(); }
  if (e.key === "Escape" && reading != null) { reading = null; render(true); }
});
document.addEventListener("scroll", (e) => { if (e.target.matches?.("[data-box]")) fade(e.target); }, true);

function bar() {
  const rv = document.getElementById("rv");
  if (qs.has("bare")) { rv?.remove(); return; }
  rv.innerHTML = `<b>State</b>${STATES.map((s) => `<a href="?s=${s}"${s === state ? " aria-current" : ""}>${s}</a>`).join("")}<b>Text</b>${["100", "125", "150"].map((v) => `<a href="#" data-fs="${v}">${v}%</a>`).join("")}`;
  rv.querySelectorAll("[data-fs]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); setFs(a.dataset.fs); render(true); }));
  rv.querySelectorAll("a[href^='?s=']").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); go(a.getAttribute("href").slice(3)); }));
}
T = taskFor(state); render(); bar();
if (state === "label-refused") document.querySelector(".tvrail .sec.on")?.scrollIntoView({ block: "end" });
})();
</script>
</body>
</html>
