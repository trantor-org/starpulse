[project]
name = "starpulse"
version = "0.5.0"
description = "StarPulse visualizes the workflows runs adapters read, lifecycle machines and the agents moving through them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.1.1",
    "pydantic>=2",
    "python-statemachine>=3.2.1,<4",
    "pyyaml>=6.0.3",
    "jsonschema>=4.25.1",
    "numpy>=2.5.4",
    "alembic>=1.16",
    "hypercorn[h3]>=0.18.0",
    "starlette>=1.9.0",
    "connect-python==0.9.0",
    "protobuf>=7.36.2",
    "prometheus-client>=0.26.0",
]

[project.scripts]
starpulse = "starpulse.__main__:main"

[project.optional-dependencies]
temporal = [
    "temporalio>=1.34",
]

[dependency-groups]
bench = [
    "locust>=2.46.7",
    "playwright>=1.63.0",
]
dev = [
    "commitizen>=4.19.2",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.8",
    "import-linter>=2.15",
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "pytest-memray>=1.11.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "temporalio>=1.34",
]

# deptry reads `starpulse` imports as the project's own.
[tool.deptry]
known_first_party = ["starpulse"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["starpulse*"]

# The built page and the machine schema are read from beside the module through `__file__`.
[tool.setuptools.package-data]
starpulse = ["static/**/*", "schemas/*.json", "machines/*.yaml", "skills/**/*", "event_log/migrations/*.py", "event_log/migrations/versions/*.py"]

# A consumer installs this package from its directory, non-editable, at one version. uv rebuilds such an install only
# when a cache key changes and defaults to pyproject.toml alone, so a bump to a newer source left an installed copy
# without the fields the new source adds (a stale `CreateRequest` rejected `duplicateSearch`). The keys mirror what
# the wheel ships.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "starpulse/**/*.py" },
    { file = "starpulse/static/**/*" },
    { file = "starpulse/schemas/*.json" },
    { file = "starpulse/machines/*.yaml" },
    { file = "starpulse/skills/**/*" },
]

# The tiers the package is organized in (docs: StarPulse Is Layered Around Its Event Log): a module imports from its own
# tier or one below, never above.
[tool.importlinter]
root_package = "starpulse"

[[tool.importlinter.contracts]]
id = "layers"
name = "entrypoints, producers, derived features and the core are layered, and siblings in a tier are independent"
type = "layers"
# Four tiers, each importing only the tiers below it and `contracts`. Features on one `|` line are independent; a line
# of its own marks a named edge (the ADR "StarPulse Is Layered Around Its Event Log"): the `runtime` composition root
# builds every context and starts its `bin` workers, `views` draws the contexts for people, `pulls` reads GitHub Actions runs from `runs`,
# `scheduler` samples the board feed and the harness machine, the Board (model, adapters and feed) sits under the
# features that read it, and the
# history store in `flow_metrics` reads `machine_engine`.
layers = [
    # entrypoints
    "starpulse.runtime",
    "starpulse.views",
    "starpulse.cli",
    # producers
    "starpulse.pulls | starpulse.scheduler | starpulse.sessions",
    "starpulse.runs | starpulse.harness_telemetry",
    # derived
    "starpulse.flow_metrics",
    "starpulse.board",
    # core
    "starpulse.event_log",
    "starpulse.machine_engine | starpulse.github",
    "starpulse.contracts",
]
# The two composition roots share one root config loader, which sits in `runtime` (spec doc-966, D6).
ignore_imports = ["starpulse.cli.** -> starpulse.runtime.config"]

[[tool.importlinter.contracts]]
id = "composition-roots"
name = "No context imports the runtime or the cli"
type = "forbidden"
# `runtime` and `cli` are the only composition roots (spec doc-966, D6): they build every context and hand each
# the collaborators it runs on; a context never reaches back, and each worker's entry lives in its context's `bin`.
allow_indirect_imports = true
source_modules = [
    "starpulse.board", "starpulse.scheduler", "starpulse.flow_metrics",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.pulls", "starpulse.runs", "starpulse.views",
    "starpulse.machine_engine", "starpulse.event_log",
]
forbidden_modules = ["starpulse.runtime", "starpulse.cli"]

[[tool.importlinter.contracts]]
id = "page-contract"
name = "Only views and the runtime import the page contract"
type = "forbidden"
# The wire DTOs in `contracts.api` are the inbound adapter's published language: views maps features onto them and
# encodes them, and the runtime drives them. Every other tier reads `contracts.adapters` and the rest of `contracts`.
source_modules = [
    "starpulse.cli",
    "starpulse.pulls", "starpulse.scheduler",
    "starpulse.board", "starpulse.runs", "starpulse.harness_telemetry",
    "starpulse.flow_metrics",
    "starpulse.event_log",
    "starpulse.machine_engine", "starpulse.github",
]
forbidden_modules = ["starpulse.contracts.api"]

[[tool.importlinter.contracts]]
id = "store-table-private"
name = "Only the store package imports the event store's tables"
type = "forbidden"
# A stream is appended through `EventStore` alone: its compare-and-swap, outbox row and envelope are what make the
# stream trustworthy, so a module that imports the table could write around them.
# The wildcards list every sibling of the store, tests included; a root source would contain the table
# and be skipped, and the store package itself contains it, so it may import it.
source_modules = ["starpulse.*", "starpulse.event_log.*"]
forbidden_modules = ["starpulse.event_log.store.tables"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "readmodel-table-private"
name = "Only the read model package imports its tables"
type = "forbidden"
# A Task row is written by the projector alone and read through `ReadModel`: a module that imports the tables could
# write a row no History folds into, or filter in Python what an index serves. The wildcards work as for the store.
source_modules = ["starpulse.*", "starpulse.event_log.*"]
forbidden_modules = ["starpulse.event_log.readmodel.tables"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "kernel-imports-no-context"
name = "The event_log shared kernel imports no StarPulse context"
type = "forbidden"
# Any context may import the kernel and the kernel imports none (spec doc-966, D5): a table or fold only one context
# reads belongs to that context, not here.
allow_indirect_imports = true
source_modules = ["starpulse.event_log"]
forbidden_modules = [
    "starpulse.board",
    "starpulse.scheduler",
    "starpulse.flow_metrics",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.pulls",
    "starpulse.runs",
]

# Bounded contexts: one per StarPulse context, id `context-<glossary slug>`.
# forbidden_modules is every other context's packages except the map's upstreams (direct imports; transitive stay
# allowed). The shared kernel (`event_log`, `github`, `contracts`, with the `Signal` and analytics config both Flow Metrics and Harness Telemetry read) and the entrypoints
# belong to no context.

[[tool.importlinter.contracts]]
id = "context-board"
name = "Board imports no other StarPulse context"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.board"]
forbidden_modules = [
    "starpulse.scheduler",
    "starpulse.flow_metrics",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.pulls",
    "starpulse.runs",
]

[[tool.importlinter.contracts]]
id = "board-layers"
name = "Board's model imports no adapter"
type = "layers"
layers = ["starpulse.board.adapters", "starpulse.board.model"]

[[tool.importlinter.contracts]]
id = "views-layers"
name = "Views' model and ports import no application or adapter"
type = "layers"
containers = []
layers = ["starpulse.views.adapters", "starpulse.views.application.commands | starpulse.views.application.queries", "starpulse.views.ports", "starpulse.views.model"]

[[tool.importlinter.contracts]]
id = "harness_telemetry-layers"
name = "Harness telemetry's model imports no adapter"
type = "layers"
containers = []
layers = ["starpulse.harness_telemetry.adapters", "starpulse.harness_telemetry.model"]

[[tool.importlinter.contracts]]
id = "pulls-layers"
name = "Pulls' model imports no command or adapter"
type = "layers"
containers = []
layers = ["starpulse.pulls.adapters", "starpulse.pulls.application.commands", "starpulse.pulls.model"]

[[tool.importlinter.contracts]]
id = "flow_metrics-layers"
name = "Flow metrics' model imports no adapter"
type = "layers"
containers = []
layers = ["starpulse.flow_metrics.adapters", "starpulse.flow_metrics.model"]

[[tool.importlinter.contracts]]
id = "context-machine-engine"
name = "Machine engine imports no other StarPulse context"
type = "forbidden"
# The event log's folds replay machines, so the kernel imports this context; the context imports nothing back.
allow_indirect_imports = true
source_modules = ["starpulse.machine_engine"]
forbidden_modules = [
    "starpulse.board",
    "starpulse.scheduler",
    "starpulse.flow_metrics",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.pulls",
    "starpulse.runs",
]

[[tool.importlinter.contracts]]
id = "machine-engine-layers"
name = "Machine engine's model imports no adapter"
type = "layers"
layers = ["starpulse.machine_engine.adapters", "starpulse.machine_engine.model"]

[[tool.importlinter.contracts]]
id = "scheduler-layers"
name = "Scheduler's model imports no adapter"
type = "layers"
layers = ["starpulse.scheduler.adapters", "starpulse.scheduler.model"]

[[tool.importlinter.contracts]]
id = "context-scheduler"
name = "Scheduler imports only Board, Harness Telemetry and Flow Metrics among StarPulse contexts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.scheduler"]
forbidden_modules = [
    "starpulse.sessions",
    "starpulse.pulls",
    "starpulse.runs",
]

[[tool.importlinter.contracts]]
id = "context-flow-metrics"
name = "Flow Metrics imports only Board and Runs among StarPulse contexts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.flow_metrics"]
forbidden_modules = [
    "starpulse.scheduler",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.pulls",
]

[[tool.importlinter.contracts]]
id = "context-harness-telemetry"
name = "Harness Telemetry imports no other StarPulse context"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.harness_telemetry"]
forbidden_modules = [
    "starpulse.board",
    "starpulse.scheduler",
    "starpulse.flow_metrics",
    "starpulse.sessions",
    "starpulse.pulls",
    "starpulse.runs",
]

[[tool.importlinter.contracts]]
id = "context-pulls"
name = "Pulls imports only Board among StarPulse contexts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.pulls"]
forbidden_modules = [
    "starpulse.scheduler",
    "starpulse.flow_metrics",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.runs",
]

[[tool.importlinter.contracts]]
id = "context-runs"
name = "Runs imports only Board among StarPulse contexts"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.runs"]
forbidden_modules = [
    "starpulse.scheduler",
    "starpulse.flow_metrics",
    "starpulse.harness_telemetry", "starpulse.sessions",
    "starpulse.pulls",
]

[[tool.importlinter.contracts]]
id = "context-sessions"
name = "Sessions imports no other StarPulse context but Flow Metrics and Harness Telemetry"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["starpulse.sessions"]
forbidden_modules = [
    "starpulse.board",
    "starpulse.scheduler",
    "starpulse.pulls",
    "starpulse.runs",
]

[tool.pytest.ini_options]
# `tests/e2e/` runs only when asked for, `uv run pytest -m e2e`, and nightly tests only in the nightly suite,
# `-m "not e2e"`: a later `-m` replaces this one.
addopts = ["--import-mode=importlib", "-m", "not e2e and not nightly"]
markers = [
    "e2e: an operator's entry point end to end; deselected unless `-m e2e` asks for it",
    "nightly: a budget test (leak, latency, soak) too slow for the gate's 5 s ceiling; only the nightly suite runs it",
    "slow: a gate test excused from the 5 s ceiling (ci/slow_tests.py)",
    "unmigrated: a test of a store `starpulse migrate` never ran; the suite's shim that migrates each store on open stays off for it",
]
# A test that never returns fails after this many seconds instead of holding the job: one spinning worker grows
# by about 6.5 MB/s through log capture.
timeout = 120
testpaths = ["tests", "ci"]
# The UI preview script under `ci/` is imported by its module name.
pythonpath = ["ci", "."]

# The nightly's per-test coverage map (ci/coverage_map.py) records which source files each test runs: line coverage only,
# test files included so a test that runs no package code still leaves its own file under its context, and relative
# paths so the data combines across runners. The default core stays: `core = "sysmon"` is cheaper but records no
# per-test contexts.
[tool.coverage.run]
source = ["starpulse", "ci"]
relative_files = true

# `cz bump` names the beta that release.yml publishes for a merge to main (see its build job); a stable release is still
# a version bump merged by hand and a matching tag.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
# A breaking change is a minor bump before 1.0 (the releases ADR), so cz never proposes 1.0.0.
major_version_zero = true
