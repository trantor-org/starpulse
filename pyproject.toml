[project]
name = "starpulse"
version = "0.2.0"
description = "StarPulse visualizes the workflows runs adapters read, lifecycle machines and the agents moving through them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.1.1",
    "pydantic>=2",
    "python-statemachine==3.2.1",
    "pyyaml>=6.0.3",
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
# History on a Postgres server (`database_url = "postgresql+psycopg://..."`); SQLite needs nothing extra.
postgres = ["psycopg[binary]>=3.2"]
# `starpulse serve --hub`: the Postgres driver and Alembic, which versions the hub's history schema.
hub = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
starpulse = "starpulse.__main__:main"

# Postgres-backed integration cases use a throwaway container when a container runtime is available.
[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9",
    "pytest-xdist>=3.8.0",
]
hub = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "testcontainers[postgres]>=4.15.0",
]

# A plain `uv sync` installs both groups; CI's IC job passes `--no-group hub` to run without the hub extras.
[tool.uv]
default-groups = ["dev", "hub"]

# deptry reads `starpulse` imports as the project's own.
[tool.deptry]
known_first_party = ["starpulse"]

# SQLAlchemy loads psycopg from a `postgresql+psycopg://` URL; no module imports it.
[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["starpulse*"]
exclude = ["starpulse.tests", "starpulse.tests.*"]

# The built page and the machine schema are read from beside the module through `__file__`.
[tool.setuptools.package-data]
starpulse = ["static/**/*", "schemas/*.json", "machine.schema.json", "machines/*.yaml", "skills/*/SKILL.md", "store/migrations/*.py", "store/migrations/versions/*.py"]

# The layers the package is organized in (docs: StarPulse Is Layered Around Its Event Log): a module imports from its own
# layer or one below, never above. `settings` may be read by every layer above `domain` and imports only `domain`.
[tool.importlinter]
root_package = "starpulse"

[[tool.importlinter.contracts]]
name = "store, settings, domain and contracts are layered"
type = "layers"
layers = ["starpulse.store", "starpulse.settings", "starpulse.domain | starpulse.contracts"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["starpulse/tests", "ci"]
# The UI preview script under `ci/` is imported by its module name.
pythonpath = ["ci"]
