[project]
name = "starpulse"
version = "0.1.0"
description = "StarPulse visualizes the workflows runs adapters read, lifecycle machines and the agents moving through them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "pydantic>=2",
    "python-statemachine==3.2.1",
    "pyyaml>=6.0.3",
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
# History on a Postgres server (`database_url = "postgresql+psycopg://..."`); SQLite needs nothing extra.
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
starpulse = "starpulse.__main__:main"

# The standalone suite: integration tests start Redis and Postgres in throwaway containers (Docker must run).
[dependency-groups]
dev = [
    "pytest>=9",
    "testcontainers[postgres,redis]>=4.15.0",
    "psycopg[binary]>=3.2",
]

# deptry reads `starpulse` imports as the project's own.
[tool.deptry]
known_first_party = ["starpulse"]

# SQLAlchemy loads psycopg from a `postgresql+psycopg://` URL; no module imports it.
[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["starpulse*"]
exclude = ["starpulse.tests", "starpulse.tests.*"]

# The built page and the machine schema are read from beside the module through `__file__`.
[tool.setuptools.package-data]
starpulse = ["static/**/*", "schemas/*.json", "machine.schema.json", "machines/*.yaml"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["starpulse/tests"]
