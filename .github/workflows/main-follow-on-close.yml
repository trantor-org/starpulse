name: Follow main on pull request close

# Enqueues trantor's `main-follow` Dagu DAG on ai-vm-1 when a pull request in this
# repository closes, merged or not, so a task whose PR closed moves to Done in seconds
# instead of waiting for the thirty-minute schedule. trantor, unraid and skills call trantor's
# reusable main-follow-submit.yml instead; this repository is public, and a public repository
# cannot call a private repository's workflow, so it keeps the full file. Rationale: trantor's
# docs/adr/local-main-follows-the-merge-event.md
#
# `pull_request_target`, not `pull_request`: the workflow file is read from the base
# branch, so a fork's pull request cannot rewrite this job or its condition and then run
# on the self-hosted runner. The job checks out nothing and passes the event's numbers
# and SHAs through env, never into the script text.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

# No concurrency group: the run ID is unique per close, a rerun of one close names the
# same Dagu run, and Dagu's own max_active_runs serializes the runs. The submit returns
# once the run exists, so it holds the runner for seconds.
jobs:
  follow:
    name: Submit main-follow to Dagu
    # A fork's pull request never reaches the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # The merge-event lane, shared only with trantor's push submit: the jobs a merge creates
    # sit on the general pool and can never hold it.
    runs-on: [self-hosted, merge-event]
    timeout-minutes: 5
    steps:
      - name: Submit
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          # The close's own time, not the workflow run: the webhook receiver keys the same run to it, so a delivery and
          # this fallback for one close name one Dagu run.
          EVENT_AT: ${{ github.event.pull_request.closed_at }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          TRANTOR_NOTIFY: "1"
        run: |
          DELIVERY="$(date -d "$EVENT_AT" +%s)"
          set -a
          # shellcheck disable=SC1091
          . /home/adinb/trantor/events/lib/dagu_events/dagu_events.env
          set +a
          /home/adinb/trantor/.venv/bin/python /home/adinb/trantor/bin/dagu_event.py submit \
            --dag main-follow --action closed --merged "$MERGED" --repository "$REPOSITORY" --before "$BEFORE" --after "$AFTER" \
            --delivery "$DELIVERY" --run-attempt "$RUN_ATTEMPT" \
            --pull-request "$PULL_REQUEST" --no-observe
