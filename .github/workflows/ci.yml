name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's candidate: every required check reports on it, or the queue fails the entry.
  merge_group:
    types: [checks_requested]
  # The full suite runs nightly, not per change: a pull request or a push runs only the tests its files can reach.
  schedule:
    - cron: "17 9 * * *" # 02:17 MST, after trantor's 01:17 whole-repo gate
  workflow_dispatch:

permissions:
  contents: read

# Validation runs on the organization's self-hosted validate lane, free and independent of GitHub's hosted
# pool. That runner group serves private repositories only: making this repository public strands these jobs.
jobs:
  # The suite is split by test file across SHARD_COUNT jobs (ci/shard.py), each on its own validate slot. The count here and
  # the matrix below move together.
  python-shard:
    runs-on: [self-hosted, validate]
    timeout-minutes: 30
    strategy:
      # A red shard does not cancel the others: one run reports every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_COUNT: 6
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the pull request's merge commit and its base parent, for ci/select_tests.py
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # The package layers (pyproject's [tool.importlinter]) hold on every pull request, not only for the tests it selects.
      - run: uv run --no-sync lint-imports
      # pytest-xdist workers sized to the runner's memory: ci/xdist_workers.py.
      - run: echo "PYTEST_ADDOPTS=-n $(uv run --no-sync python ci/xdist_workers.py) --dist loadgroup" >> "$GITHUB_ENV"
      # A pull request, a merge-queue candidate or a push to main runs only the tests its changed files can reach (ci/select_tests.py); the
      # nightly schedule and a manual dispatch run all.
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
        run: git diff --name-only HEAD^1 HEAD | uv run --no-sync python ci/select_tests.py >> "$GITHUB_ENV"
      # Postgres-backed integration cases use the runner's Docker; SQLite cases need no container runtime. A selected run
      # can leave a shard no test file: pytest exits 5 for it, which is a pass only while targets were selected.
      - if: env.PYTEST_SKIP != 'true'
        run: |
          status=0
          uv run pytest $PYTEST_TARGETS || status=$?
          [ "$status" -eq 0 ] || { [ "$status" -eq 5 ] && [ -n "$PYTEST_TARGETS" ]; }

  # The ruleset's required context is `python`: it passes when every shard did, and fails when any failed, was cancelled or
  # never ran. `always()` keeps it from being skipped behind a red shard, which the merge queue would read as missing.
  python:
    needs: python-shard
    if: always()
    runs-on: [self-hosted, validate]
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.python-shard.result }}
        run: test "$SHARDS" = success

  # An IC instance runs without the hub extras: import every module it can load (ci/ic_imports.py) on an
  # environment that holds neither the Postgres driver, Alembic nor the container tooling, so a hub-only import in IC
  # mode fails here.
  ic:
    runs-on: [self-hosted, validate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --no-group hub
      - run: uv run --no-sync python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('alembic', 'psycopg', 'jwt', 'testcontainers')))"
      - run: uv run --no-sync python ci/ic_imports.py

  web:
    runs-on: [self-hosted, validate]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: starpulse/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The page's API types are generated from the pydantic models in starpulse/contracts/api.py. Regenerate both outputs
  # and fail when either differs from what is committed: a model change ships with its schema and types.
  api-types:
    runs-on: [self-hosted, validate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: uv sync --locked
      - run: pnpm --dir starpulse/web install --frozen-lockfile
      - run: uv run --no-sync python -m starpulse.contracts.api
      - run: pnpm --dir starpulse/web run gen:types
      - name: Fail when a generated file is stale
        run: git diff --exit-code -- starpulse/api.schema.json starpulse/web/src/api/types.gen.ts

  # This repository is public: no tracked file outside the workflows and tests may name the operator's private hosts
  # (ci/public_names.py). Needs no dependencies, so it runs without the project environment.
  public-names:
    runs-on: [self-hosted, validate]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --no-project --python 3.14 python ci/public_names.py

  # trantor's check-config test-tier policy over this tree (ci/trantor_tier_policy.py). A commit that fails it would
  # fail every trantor bump pinning it, so it must not go green here. Runs on the ai-vm-1 fleet beside dispatch.
  tier-policy:
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          token: ${{ steps.app-token.outputs.token }}
          path: .trantor
          sparse-checkout: lib
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - env:
          PYTHONPATH: .trantor/lib
          # git_cli.list_timeout reads this; unset is the fail-sentinel 0 and times out ls-files immediately
          GIT_CLI_LIST_TIMEOUT: "60"
        run: >-
          uv run --no-project --python 3.14 --with pyyaml
          python ci/trantor_tier_policy.py .trantor/lib/linting/check_config_checks/tier_policy.py

  # trantor main's (newest green commit) tests of this package, run against this tree in place of trantor's starpulse submodule: the same
  # `make test-changed FILES=starpulse` trantor's Validate runs on a bump PR. A commit that fails them would fail every
  # trantor bump pinning it, so it must not go green here. A change trantor must adopt (a new table needs an Alembic
  # adoption; a test that pins a feed key this package owns) lands in trantor first, then here.
  trantor-contract:
    runs-on: [self-hosted, validate]
    timeout-minutes: 30
    steps:
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      # Trantor's tip can be red for a reason this package did not cause, and a red tip ejected a merge-queue entry three
      # times. Test the newest main commit whose CI passed (ci/trantor_green_sha.py logs it; none in the last 30 runs fails).
      # A full checkout, never sparse: a sparse root checkout persists core.sparseCheckout in the runner's shared
      # workspace, and every later job on that runner checks out an empty tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Pick trantor's newest green main SHA
        id: trantor-sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/trantor-org/trantor/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30" \
            | uv run --no-project --python 3.14 python ci/trantor_green_sha.py > sha.txt
          echo "sha=$(cat sha.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          ref: ${{ steps.trantor-sha.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: .trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trantor/starpulse
      # `uv lock` as trantor's bump does: this tree's dependencies may differ from the ones trantor's lock pins.
      - working-directory: .trantor
        run: |
          uv lock
          make sync
          echo "PYTEST_WORKERS=$(uv run --no-project --python 3.14 bin/ci_pytest_workers.py)" >> "$GITHUB_ENV"
      - working-directory: .trantor
        run: make test-changed FILES=starpulse CI=1

  # Tells trantor which starpulse commit just passed so its starpulse-bump workflow opens one pull request pinned to
  # exactly that SHA. It runs on the generic ai-vm-1 fleet, not the validate lane, so validate-lane queue time is
  # unchanged, and it sends nothing for a pull request or a red run.
  dispatch:
    name: dispatch
    needs: [python, web, api-types, tier-policy, trantor-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      # The workspace App token, not GITHUB_TOKEN: a dispatch sent with GITHUB_TOKEN reaches only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - name: Dispatch the green SHA to trantor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREEN_SHA: ${{ github.sha }}
        run: |
          gh api repos/trantor-org/trantor/dispatches \
            -f event_type=starpulse-green \
            -f "client_payload[sha]=$GREEN_SHA"
