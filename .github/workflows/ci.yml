name: CI

# This workflow defines StarPulse's CI: a pull request and a merge-queue candidate run `python`, `web` and `static-checks`
# on the changed files (ci/select_tests.py, ci/reach.py), with `build` beside them; the nightly
# suite and a manual dispatch run every job in full. A push to main runs none: the merge queue tested its candidate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 9 * * *" # 02:17 MST
  workflow_dispatch:

permissions:
  contents: read

# The nightly suite runs on the organization's self-hosted ai-vm-1 fleet, free and independent of GitHub's hosted
# pool. That runner group serves private repositories only: making this repository public strands these jobs.
jobs:
  # Chooses the tests once for the shards: the nightly schedule and a manual dispatch select the whole suite
  # (ci/select_tests.py --full); a pull request and a merge candidate select by the files changed since the base. Its output sizes the
  # shard matrix. It also runs the import layers (pyproject's [tool.importlinter]).
  select:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 10
    outputs:
      PYTEST_TARGETS: ${{ steps.select.outputs.PYTEST_TARGETS }}
      PYTEST_SHARDS: ${{ steps.select.outputs.PYTEST_SHARDS }}
      # Whether the change reaches each job below (ci/reach.py); true on the nightly schedule and a dispatch.
      web: ${{ steps.select.outputs.web }}
      static: ${{ steps.select.outputs.static }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
          # The diff starts at the pull request's or the candidate's base, which a one-commit checkout lacks.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run --no-sync lint-imports
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ]; then
            uv run --no-sync python ci/select_tests.py --full >> "$GITHUB_OUTPUT"
            printf 'web=true\nstatic=true\n' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
            uv run --no-sync python ci/select_tests.py --base "$BASE" < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
            uv run --no-sync python ci/reach.py < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
          fi

  # The suite is split by test file across the shards `select` launches (ci/shard.py), each on its own runner: one to six. The matrix is its PYTEST_SHARDS output, and SHARD_COUNT the matrix's size.
  python-shard:
    needs: select
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved. An empty
    # matrix is an error, so no shard is this job skipped, which the `python` job reads.
    if: github.event_name != 'push' && needs.select.outputs.PYTEST_SHARDS != '[]'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 30
    strategy:
      # A red shard does not cancel the others: one run reports every failure.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.PYTEST_SHARDS) }}
    env:
      SHARD_COUNT: ${{ strategy.job-total }}
      SHARD_INDEX: ${{ matrix.shard }}
      # The tests `select` chose; empty is the whole suite.
      PYTEST_TARGETS: ${{ needs.select.outputs.PYTEST_TARGETS }}
      # The slow/costly-test screen (ci/slow_tests.py) runs only in the nightly suite and a manual dispatch.
      TEST_COST_REPORT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
      # The shard's per-test coverage data, combined by `coverage-map`; read only when the run is instrumented below.
      COVERAGE_FILE: coverage-${{ matrix.shard }}.data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # pytest-xdist workers sized to the runner's memory: ci/xdist_workers.py.
      # The nightly and a manual dispatch (TEST_COST_REPORT set) add `-m "not e2e"`: the nightly-marked budget tests the gate
      # deselects (pyproject addopts).
      - run: echo "PYTEST_ADDOPTS=-n $(uv run --no-sync python ci/xdist_workers.py) --dist worksteal ${TEST_COST_REPORT:+-m 'not e2e'}" >> "$GITHUB_ENV"
      # The nightly suite records which source files each test runs (pyproject's [tool.coverage.run]); ci/coverage_map.py
      # turns the shards' data into the map the select step reads.
      - if: ${{ env.TEST_COST_REPORT == '1' }}
        run: echo "PYTEST_ADDOPTS=$PYTEST_ADDOPTS --cov --cov-context=test --cov-report=" >> "$GITHUB_ENV"
      # A selected run can leave a shard no test file: pytest exits 5 for it, which is a pass only while targets were selected.
      # The full log is kept: an xdist worker crash (INTERNALERROR) prints its traceback only into this output.
      - run: |
          set -o pipefail  # the default step shell has none: without it tee's 0 hides a red pytest
          status=0
          uv run pytest $PYTEST_TARGETS 2>&1 | tee pytest-shard.log || status=$?
          [ "$status" -eq 0 ] || { [ "$status" -eq 5 ] && [ -n "$PYTEST_TARGETS" ]; }
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: pytest-shard.log
          if-no-files-found: error
      # The tests the screen flagged (test-cost.json) rerun alone under memray, even after a red suite; one that leaves no
      # stats is named in the run (ci/memray_flagged.py).
      - if: ${{ !cancelled() && env.TEST_COST_REPORT == '1' }}
        run: uv run --no-sync python ci/memray_flagged.py test-cost.json memray
      - if: ${{ !cancelled() && env.TEST_COST_REPORT == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-cost-${{ matrix.shard }}
          path: |
            test-cost.json
            memray/
          if-no-files-found: error
      - if: ${{ !cancelled() && env.TEST_COST_REPORT == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.data
          if-no-files-found: error

  # Combines the shards' coverage data into the per-test coverage map (ci/coverage_map.py) and publishes it on ai-vm-1, where
  # the CI select step reads `latest.json`. Only a fully green nightly publishes: a red shard's data
  # would leave tests out of the map.
  coverage-map:
    needs: [select, python-shard]
    # Only the whole suite maps every test; a pull request's selection would publish a partial map.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.python-shard.result == 'success'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: |
          uv run --no-sync coverage combine coverage-*.data
          uv run --no-sync pytest --collect-only -q | grep '::' > collected.txt
          uv run --no-sync python ci/coverage_map.py build .coverage --sha "$GITHUB_SHA" --collected collected.txt

  # The same selected tests on the free-threaded build (3.14t). The live server runs on 3.14t, so a change that
  # breaks that build shows in the nightly suite. One job, not a shard matrix. It is not a required check and `python`
  # does not wait for it.
  python-ft:
    needs: select
    # A nightly and dispatch check only: the pull request's `python` does not wait for it and the whole suite is its cost.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.select.outputs.PYTEST_SHARDS != '[]'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 45
    env:
      PYTEST_TARGETS: ${{ needs.select.outputs.PYTEST_TARGETS }}
      # The build is slower than the 5 s ceiling was set on: name slow tests here (ci/slow_tests.py), never fail them.
      TEST_COST_REPORT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Outside the checkout: a runner's workspace outlives the job, and a 3.14t .venv there would satisfy the next job's
      # `requires-python >=3.14` and silently move it onto the free-threaded build. The runner context is not available to
      # a job-level env, so the path is exported from a step.
      # The runner image points UV_PYTHON_INSTALL_DIR at /opt/uv-python, which the job cannot write, and 3.14t is not in it.
      - run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/ft-venv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
      # aioquic and pylsqpack have no 3.14t wheels and their sources do not build there; only the HTTP/3 tests need them
      # (see the importorskip in tests/integration/server/test_http3.py).
      # grpcio has no 3.14t wheel, so this compiles it, one job per host core (36) by default: 14 cores and 17 GB, enough
      # for systemd-oomd to kill the build before uv caches the wheel, so every run rebuilt it. Each job uses about two
      # cores (six jobs peaked at 11 cores), so three finish within 6 cores and uv's cache then keeps the wheel.
      # temporalio has no 3.14t wheel either; its Rust source build needs protoc, and nothing in the repo imports it.
      - run: uv sync --locked --python 3.14t --no-install-package aioquic --no-install-package pylsqpack --no-install-package temporalio
        env:
          GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS: "3"
      # A dependency that re-enables the GIL on import leaves every test green on the build this job exists to test.
      - run: uv run --no-sync python -c "import sys, starpulse.runtime.server; sys.exit(sys._is_gil_enabled())"
      - run: echo "PYTEST_ADDOPTS=-n $(uv run --no-sync python ci/xdist_workers.py) --dist worksteal" >> "$GITHUB_ENV"
      # The selected files may leave nothing for pytest to run (exit 5), which is a pass only while targets were selected.
      - run: |
          status=0
          uv run --no-sync pytest $PYTEST_TARGETS || status=$?
          [ "$status" -eq 0 ] || { [ "$status" -eq 5 ] && [ -n "$PYTEST_TARGETS" ]; }

  # The nightly's counterpart of the required context `python` (the App's `ci-sp-python` check run): it passes when `select` did and every shard it launched did, or when it
  # launched none because no test was selected, and fails when any shard failed, was cancelled or never ran. `always()`
  # keeps it from being skipped behind a red job, which the merge queue would read as missing. A `select` that failed or
  # was cancelled skips the shards and leaves its outputs empty, so the shards' skip alone proves nothing.
  python:
    needs: [select, python-shard]
    if: always() && github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          SHARDS: ${{ needs.python-shard.result }}
          LAUNCHED: ${{ needs.select.outputs.PYTEST_SHARDS }}
        run: |
          test "$SELECT" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$LAUNCHED" = '[]'; }

  # The release build without publishing (release.yml's `build`): the page, then the wheel that must ship it. A pull
  # request that breaks either fails here instead of at the merge to main.
  build:
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: The wheel carries the page
        run: unzip -l dist/*.whl | grep -q 'starpulse/static/index.html'

  web:
    needs: select
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved. A pull
    # request the change does not reach skips the job, which a required check counts as passed.
    if: github.event_name != 'push' && needs.select.outputs.web == 'true'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: starpulse/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The short static checks in one job (ci/static_checks.sh runs them at once): public-names, api-types and wire-pb2.
  static-checks:
    needs: select
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved. A pull
    # request the change does not reach skips the job, which a required check counts as passed.
    if: github.event_name != 'push' && needs.select.outputs.static == 'true'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: bash ci/static_checks.sh

  # The out-of-the-box install on Linux, the ai-vm-1 fleet's own platform: the wheel goes into an empty virtualenv and
  # `starpulse serve` starts from an empty directory with no config, then ci/fresh_serve.py fails unless the page answers
  # and every worker child, the Page API child with its handed socket included, stays alive. macos-fresh-serve is the
  # macOS counterpart.
  fresh-serve:
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The wheel carries the built page (starpulse/static is not tracked).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/fresh" && uv pip install --python "$RUNNER_TEMP/fresh/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - run: python3 -I ci/fresh_serve.py "$RUNNER_TEMP/fresh/bin/python"
  # The out-of-the-box install on macOS: the wheel goes into an empty virtualenv and `starpulse serve` starts from an empty
  # directory with no config, then ci/fresh_serve.py fails unless the page answers and every worker child, the Page API
  # child with its handed socket included, stays alive. The ai-vm-1 fleet is Linux, so this job runs on a GitHub-hosted
  # runner (free: this repository is public); `fresh-serve` is the Linux counterpart. Not a
  # required check: a pull request is proven by dispatching this workflow on its branch.
  macos-fresh-serve:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      # The wheel carries the built page (starpulse/static is not tracked).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/fresh" && uv pip install --python "$RUNNER_TEMP/fresh/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - run: python3 -I ci/fresh_serve.py "$RUNNER_TEMP/fresh/bin/python"

  # The CloudEvents ingest on a machine with no Redis: ci/clean_machine.py first fails if a Redis port answers, then serves
  # the installed wheel from an empty directory that declares one machine and one producer, posts the machine's events over
  # HTTP, reads them back from the event log and the SSE stream, and fails unless an undeclared event is refused 4xx. A
  # GitHub-hosted runner has no Redis service, which is the point: nothing the proof reads can have come through one. Not a
  # required check: a pull request is proven by dispatching this workflow on its branch.
  clean-machine-ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      # The wheel carries the built page (starpulse/static is not tracked).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/clean" && uv pip install --python "$RUNNER_TEMP/clean/bin/python" "$RUNNER_TEMP"/dist/*.whl
      # Fails if a Redis port answers: the runner has none, so a pass shows the ingest needs no Redis.
      - run: python3 -I ci/clean_machine.py "$RUNNER_TEMP/clean/bin/python"
