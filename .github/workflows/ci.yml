name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's candidate: every required check reports on it, or the queue fails the entry.
  merge_group:
    types: [checks_requested]
  # The full suite runs nightly, not per change: a pull request or a merge-queue candidate runs only the tests its files
  # can reach, and a push to main runs none.
  schedule:
    - cron: "17 9 * * *" # 02:17 MST, after trantor's 01:17 whole-repo gate
  workflow_dispatch:

permissions:
  contents: read

# Validation runs on the organization's self-hosted validate lane, free and independent of GitHub's hosted
# pool. That runner group serves private repositories only: making this repository public strands these jobs.
# A merge-queue run takes the merge-queue lane instead: runners reserved for it (trantor's runner-fleet document), so it
# never waits behind pull-request or trantor CI. The lane holds ten slots for the ten jobs a run has at once (six shards,
# web, static-checks, trantor-contract and release.yml's build; `select` ends before the shards it sizes start and
# `python` waits for them), so keep this count within it. A run that selects fewer shards takes fewer slots.
jobs:
  # Chooses the tests once for the shards: a pull request or a merge-queue candidate selects only the tests its changed
  # files can reach (ci/select_tests.py); the nightly schedule and a manual dispatch select the whole suite. Its output
  # sizes the shard matrix, so a change that reaches no test launches no shard and holds no slot for one. It also runs
  # the import layers (pyproject's [tool.importlinter]), which hold on every pull request, not only for the tests it selects.
  select:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted", "merge-queue"]') || fromJSON('["self-hosted", "validate"]') }}
    timeout-minutes: 10
    outputs:
      PYTEST_TARGETS: ${{ steps.select.outputs.PYTEST_TARGETS }}
      PYTEST_SHARDS: ${{ steps.select.outputs.PYTEST_SHARDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the pull request's merge commit and its base parent, for ci/select_tests.py
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run --no-sync lint-imports
      # A merge-queue candidate is one squash commit over the entry ahead of it, so HEAD^1..HEAD is its own change.
      - id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            git diff --name-only HEAD^1 HEAD | uv run --no-sync python ci/select_tests.py
          else
            uv run --no-sync python ci/select_tests.py --full
          fi >> "$GITHUB_OUTPUT"

  # The suite is split by test file across the shards `select` launches (ci/shard.py), each on its own runner: one to six,
  # none when it selected no test. The matrix is its PYTEST_SHARDS output, and SHARD_COUNT the matrix's size.
  python-shard:
    needs: select
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved. An empty
    # matrix is an error, so no shard is this job skipped, which the `python` job reads.
    if: github.event_name != 'push' && needs.select.outputs.PYTEST_SHARDS != '[]'
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted", "merge-queue"]') || fromJSON('["self-hosted", "validate"]') }}
    timeout-minutes: 30
    strategy:
      # A red shard does not cancel the others: one run reports every failure.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.PYTEST_SHARDS) }}
    env:
      SHARD_COUNT: ${{ strategy.job-total }}
      SHARD_INDEX: ${{ matrix.shard }}
      # The tests `select` chose; empty is the whole suite.
      PYTEST_TARGETS: ${{ needs.select.outputs.PYTEST_TARGETS }}
      # The slow/costly-test screen (ci/slow_tests.py) runs only in the nightly suite and a manual dispatch.
      TEST_COST_REPORT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # pytest-xdist workers sized to the runner's memory: ci/xdist_workers.py.
      - run: echo "PYTEST_ADDOPTS=-n $(uv run --no-sync python ci/xdist_workers.py) --dist loadgroup" >> "$GITHUB_ENV"
      # Postgres-backed integration cases use the runner's Docker; SQLite cases need no container runtime. A selected run
      # can leave a shard no test file: pytest exits 5 for it, which is a pass only while targets were selected.
      - run: |
          status=0
          uv run pytest $PYTEST_TARGETS || status=$?
          [ "$status" -eq 0 ] || { [ "$status" -eq 5 ] && [ -n "$PYTEST_TARGETS" ]; }
      # The tests the screen flagged (test-cost.json) rerun alone under memray, even after a red suite; one that leaves no
      # stats is named in the run (ci/memray_flagged.py).
      - if: ${{ !cancelled() && env.TEST_COST_REPORT == '1' }}
        run: uv run --no-sync python ci/memray_flagged.py test-cost.json memray
      - if: ${{ !cancelled() && env.TEST_COST_REPORT == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-cost-${{ matrix.shard }}
          path: |
            test-cost.json
            memray/
          if-no-files-found: error

  # The ruleset's required context is `python`: it passes when `select` did and every shard it launched did, or when it
  # launched none because no test was selected, and fails when any shard failed, was cancelled or never ran. `always()`
  # keeps it from being skipped behind a red job, which the merge queue would read as missing. A `select` that failed or
  # was cancelled skips the shards and leaves its outputs empty, so the shards' skip alone proves nothing.
  python:
    needs: [select, python-shard]
    if: always() && github.event_name != 'push'
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted", "merge-queue"]') || fromJSON('["self-hosted", "validate"]') }}
    timeout-minutes: 5
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          SHARDS: ${{ needs.python-shard.result }}
          LAUNCHED: ${{ needs.select.outputs.PYTEST_SHARDS }}
        run: |
          test "$SELECT" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$LAUNCHED" = '[]'; }

  web:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted", "merge-queue"]') || fromJSON('["self-hosted", "validate"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: starpulse/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The short static checks in one job (ci/static_checks.sh runs them at once): ic, public-names, api-types and
  # tier-policy. A merge-queue run takes one job of its reserved lane for them, and its wall time is api-types' alone.
  static-checks:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted", "merge-queue"]') || fromJSON('["self-hosted", "validate"]') }}
    timeout-minutes: 15
    steps:
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          token: ${{ steps.app-token.outputs.token }}
          path: .trantor
          sparse-checkout: lib
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: bash ci/static_checks.sh

  # trantor main's (newest green commit) tests of this package, run against this tree in place of trantor's starpulse submodule: the same
  # `make test-changed FILES=starpulse` trantor's Validate runs on a bump PR. A commit that fails them would fail every
  # trantor bump pinning it, so it must not go green here. A change trantor must adopt (a new table needs an Alembic
  # adoption; a test that pins a feed key this package owns) lands in trantor first, then here.
  trantor-contract:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('["self-hosted", "merge-queue"]') || fromJSON('["self-hosted", "validate"]') }}
    timeout-minutes: 30
    steps:
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      # Trantor's tip can be red for a reason this package did not cause, and a red tip ejected a merge-queue entry three
      # times. Test the newest main commit whose CI passed (ci/trantor_green_sha.py logs it; none in the last 30 runs fails).
      # A full checkout, never sparse: a sparse root checkout persists core.sparseCheckout in the runner's shared
      # workspace, and every later job on that runner checks out an empty tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Pick trantor's newest green main SHA
        id: trantor-sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/trantor-org/trantor/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30" \
            | uv run --no-project --python 3.14 python ci/trantor_green_sha.py > sha.txt
          echo "sha=$(cat sha.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          ref: ${{ steps.trantor-sha.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: .trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trantor/starpulse
      # `uv lock` as trantor's bump does, but only when this tree's dependencies differ from the ones trantor's lock pins:
      # `--locked` refuses a stale lock, so a dependency change here still reaches the re-lock, and an unchanged one
      # resolves once (the lock is not the cost: the sync builds trantor's workspace members).
      - working-directory: .trantor
        run: |
          uv sync --all-packages --locked || { uv lock && make sync; }
          echo "PYTEST_WORKERS=$(uv run --no-project --python 3.14 bin/ci_pytest_workers.py)" >> "$GITHUB_ENV"
      - working-directory: .trantor
        run: make test-changed FILES=starpulse CI=1

  # Pins the commit main just moved to on trantor, a fallback for dispatch-merged.yml's pin at merge time. Every main
  # commit is a merge-queue candidate whose required checks passed, so it waits on no test job here; trantor's pin script
  # re-checks that a green merge_group run tested the SHA before pinning it. It runs on the generic ai-vm-1 fleet, not the
  # validate lane, and pins nothing for a pull request or a merge-queue candidate.
  dispatch:
    name: dispatch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      - name: Pin the starpulse SHA
        env:
          APP_CLIENT_ID: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_SHA: ${{ github.sha }}
          PIN_DEPLOY_KEY: ${{ secrets.TRANTOR_PIN_DEPLOY_KEY }}
        run: |
          "$HOME/trantor/bin/starpulse_ops/starpulse_pin.sh"
