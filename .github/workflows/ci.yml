name: CI

# A pull request and a merge-queue candidate are not here: their required checks (`python`, `web`, `static-checks`,
# `trantor-contract`) are the workspace App's check runs, posted by trantor's `ci-sp-*` Dagu DAGs, which trantor's webhook receiver
# submits (trantor's ci.md). What runs here is the nightly suite and a manual dispatch; a push to main runs none.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *" # 02:17 MST, after trantor's 01:17 whole-repo gate
  workflow_dispatch:

permissions:
  contents: read

# The nightly suite runs on the organization's self-hosted ai-vm-1 fleet, free and independent of GitHub's hosted
# pool. That runner group serves private repositories only: making this repository public strands these jobs.
jobs:
  # The whole suite under pytest-xdist, as the `ci-sp-python` check run runs it for a pull request (trantor's ci.md), plus the
  # import layers (pyproject's [tool.importlinter]).
  python:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 30
    env:
      # The slow/costly-test screen (ci/slow_tests.py) runs only in the nightly suite and a manual dispatch.
      TEST_COST_REPORT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run --no-sync lint-imports
      # The nightly and a manual dispatch (TEST_COST_REPORT set) add `-m "not e2e"`: the nightly-marked budget tests the gate
      # deselects (pyproject addopts).
      - run: echo "PYTEST_ADDOPTS=-n auto --dist worksteal ${TEST_COST_REPORT:+-m 'not e2e'}" >> "$GITHUB_ENV"
      # Postgres-backed integration cases use the runner's Docker; SQLite cases need no container runtime.
      - run: uv run --no-sync pytest
      - if: ${{ !cancelled() && env.TEST_COST_REPORT == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-cost
          path: test-cost.json
          if-no-files-found: error

  # The same tests on the free-threaded build (3.14t), without the hub group: psycopg-binary has no 3.14t wheel, so
  # hub mode stays on 3.14 and an IC instance is what runs here. trantor's live server runs on 3.14t, so a change that
  # breaks that build shows in the nightly suite. It is not a required check and `python` does not wait for it.
  python-ft:
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 45
    env:
      # The build is slower than the 5 s ceiling was set on: name slow tests here (ci/slow_tests.py), never fail them.
      TEST_COST_REPORT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Outside the checkout: a runner's workspace outlives the job, and a 3.14t .venv there would satisfy the next job's
      # `requires-python >=3.14` and silently move it onto the free-threaded build. The runner context is not available to
      # a job-level env, so the path is exported from a step.
      # The runner image points UV_PYTHON_INSTALL_DIR at /opt/uv-python, which the job cannot write, and 3.14t is not in it.
      - run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/ft-venv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
      - run: uv sync --locked --no-group hub --python 3.14t
      # A dependency that re-enables the GIL on import leaves every test green on the build this job exists to test.
      - run: uv run --no-sync python -c "import sys, starpulse._internal.server.server; sys.exit(sys._is_gil_enabled())"
      - run: echo "PYTEST_ADDOPTS=-n auto --dist worksteal" >> "$GITHUB_ENV"
      - run: uv run --no-sync pytest

  web:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: starpulse/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The short static checks in one job (ci/static_checks.sh runs them at once): ic, public-names, api-types,
  # tier-policy, avoid-list and busy-modules.
  static-checks:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    steps:
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor,trantor-docs
      # Depth 2: avoid-list diffs against HEAD^1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          token: ${{ steps.app-token.outputs.token }}
          path: .trantor
          sparse-checkout: lib
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor-docs
          token: ${{ steps.app-token.outputs.token }}
          path: .trantor-docs
          sparse-checkout: governance/architecture
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: bash ci/static_checks.sh

  # trantor main's (newest green commit) tests of this package, run against this tree in place of trantor's starpulse submodule: the same
  # `make test-changed FILES=starpulse` trantor's Validate runs on a bump PR. A commit that fails them would fail every
  # trantor bump pinning it, so it must not go green here. A change trantor must adopt (a new table needs an Alembic
  # adoption; a test that pins a feed key this package owns) lands in trantor first, then here.
  trantor-contract:
    # A push to main runs no test: the merge queue tested the pushed commit, its candidate, before main moved.
    if: github.event_name != 'push'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 30
    steps:
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      # Trantor's tip can be red for a reason this package did not cause, and a red tip ejected a merge-queue entry three
      # times. Test the newest main commit whose `Validate` passed (ci/trantor_green_sha.py logs it; none in the newest 15
      # commits fails).
      # A full checkout, never sparse: a sparse root checkout persists core.sparseCheckout in the runner's shared
      # workspace, and every later job on that runner checks out an empty tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Pick trantor's newest green main SHA
        id: trantor-sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The App's `Validate` check run on trantor main's newest 15 commits, reshaped to the workflow-runs shape the
          # selector reads. Kept in step with trantor's bin/ci/ci_starpulse.py (VALIDATE_QUERY, validate_runs).
          QUERY: >-
            query { repository(owner: "trantor-org", name: "trantor") { ref(qualifiedName: "refs/heads/main") {
            target { ... on Commit { history(first: 15) { nodes { oid checkSuites(first: 8) { nodes { app { slug }
            checkRuns(first: 5, filterBy: {checkName: "Validate"}) { nodes { conclusion completedAt } } } } } } } } } } }
          RUNS: >-
            {workflow_runs: [.data.repository.ref.target.history.nodes[] | . as $commit
            | .checkSuites.nodes[] | select(.app.slug == "trantor-agent") | .checkRuns.nodes[]
            | {head_sha: $commit.oid, conclusion: ((.conclusion // "") | ascii_downcase), created_at: .completedAt}]}
        run: |
          gh api graphql -f query="$QUERY" --jq "$RUNS" \
            | uv run --no-project --python 3.14 python ci/trantor_green_sha.py > sha.txt
          echo "sha=$(cat sha.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          ref: ${{ steps.trantor-sha.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: .trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trantor/starpulse
      # `uv lock` as trantor's bump does, but only when this tree's dependencies differ from the ones trantor's lock pins:
      # `--locked` refuses a stale lock, so a dependency change here still reaches the re-lock, and an unchanged one
      # resolves once (the lock is not the cost: the sync builds trantor's workspace members).
      - working-directory: .trantor
        run: |
          uv sync --all-packages --locked || { uv lock && make sync; }
          echo "PYTEST_WORKERS=$(uv run --no-project --python 3.14 bin/ci_pytest_workers.py)" >> "$GITHUB_ENV"
      - working-directory: .trantor
        run: make test-changed FILES=starpulse CI=1

  # The out-of-the-box install on macOS: the wheel goes into an empty virtualenv and `starpulse serve` starts from an empty
  # directory with no config, then ci/fresh_serve.py fails unless the page answers and every worker child, the Page API
  # child with its handed socket included, stays alive. The ai-vm-1 fleet is Linux, so this job runs on a GitHub-hosted
  # runner (free: this repository is public); trantor's `starpulse-fresh-serve` DAG is the Linux counterpart. Not a
  # required check: a pull request is proven by dispatching this workflow on its branch.
  macos-fresh-serve:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      # The wheel carries the built page (starpulse/static is not tracked).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/fresh" && uv pip install --python "$RUNNER_TEMP/fresh/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - run: python3 -I ci/fresh_serve.py "$RUNNER_TEMP/fresh/bin/python"

  # The CloudEvents ingest on a machine with no Redis: ci/clean_machine.py first fails if a Redis port answers, then serves
  # the installed wheel from an empty directory that declares one machine and one producer, posts the machine's events over
  # HTTP, reads them back from the event log and the SSE stream, and fails unless an undeclared event is refused 4xx. A
  # GitHub-hosted runner has no Redis service, which is the point: nothing the proof reads can have come through one. Not a
  # required check: a pull request is proven by dispatching this workflow on its branch.
  clean-machine-ingest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      # The wheel carries the built page (starpulse/static is not tracked).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/clean" && uv pip install --python "$RUNNER_TEMP/clean/bin/python" "$RUNNER_TEMP"/dist/*.whl
      # Fails if a Redis port answers: the runner has none, so a pass shows the ingest needs no Redis.
      - run: python3 -I ci/clean_machine.py "$RUNNER_TEMP/clean/bin/python"
