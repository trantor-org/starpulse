name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Validation runs on the organization's self-hosted validate lane, free and independent of GitHub's hosted
# pool. That runner group serves private repositories only: making this repository public strands these jobs.
jobs:
  python:
    runs-on: [self-hosted, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the pull request's merge commit and its base parent, for ci/select_tests.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # The package layers (pyproject's [tool.importlinter]) hold on every pull request, not only for the tests it selects.
      - run: uv run --no-sync lint-imports
      # pytest-xdist workers sized to the runner's memory: ci/xdist_workers.py.
      - run: echo "PYTEST_ADDOPTS=-n $(uv run --no-sync python ci/xdist_workers.py) --dist loadgroup" >> "$GITHUB_ENV"
      # A pull request runs only the tests its changed files can reach (ci/select_tests.py); a push to main runs all.
      - if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD | uv run --no-sync python ci/select_tests.py >> "$GITHUB_ENV"
      # Postgres-backed integration cases use the runner's Docker; SQLite cases need no container runtime.
      - if: env.PYTEST_SKIP != 'true'
        run: uv run pytest $PYTEST_TARGETS

  # An IC instance runs without the hub extras: the same suite on an environment that holds neither the Postgres
  # driver, Alembic nor the container tooling, so a hub-only import in IC mode fails here.
  ic:
    runs-on: [self-hosted, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the pull request's merge commit and its base parent, for ci/select_tests.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --no-group hub
      - run: uv run --no-sync python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('alembic', 'psycopg', 'jwt', 'testcontainers')))"
      - run: echo "PYTEST_ADDOPTS=-n $(uv run --no-sync python ci/xdist_workers.py) --dist loadgroup" >> "$GITHUB_ENV"
      - if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD | uv run --no-sync python ci/select_tests.py >> "$GITHUB_ENV"
      - if: env.PYTEST_SKIP != 'true'
        run: uv run --no-sync pytest $PYTEST_TARGETS

  web:
    runs-on: [self-hosted, validate]
    defaults:
      run:
        working-directory: starpulse/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The page's API types are generated from the pydantic models in starpulse/contracts/api.py. Regenerate both outputs
  # and fail when either differs from what is committed: a model change ships with its schema and types.
  api-types:
    runs-on: [self-hosted, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: uv sync --locked
      - run: pnpm --dir starpulse/web install --frozen-lockfile
      - run: uv run --no-sync python -m starpulse.contracts.api
      - run: pnpm --dir starpulse/web run gen:types
      - name: Fail when a generated file is stale
        run: git diff --exit-code -- starpulse/api.schema.json starpulse/web/src/api/types.gen.ts

  # The latency budget (trantor ADR "StarPulse Holds a Latency Budget on Every Request and Frame"): every request,
  # interaction and stream delivery within 50 ms at p95, every frame within 16.7 ms. The harness times the built page and
  # the API of ci/seeded_server.py three times and judges each surface on the median run's p95, because the validate lane
  # is shared and noisy. A pull request that puts a surface over budget, or makes a request no row times, fails here. The
  # nightly soak (bench/soak.py) covers what a seeded board smaller than the live one cannot.
  latency:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, validate]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --group bench
      - name: Build the page
        run: pnpm --dir starpulse/web install --frozen-lockfile && pnpm --dir starpulse/web run build
      # A free port: the validate runners of one host run jobs side by side.
      - name: Start the seeded server
        run: |
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          echo "GATE_PORT=$port" >> "$GITHUB_ENV"
          uv run --no-sync python -m ci.seeded_server --port "$port" --dir "$RUNNER_TEMP/gate" > "$RUNNER_TEMP/gate.log" 2>&1 &
          echo "GATE_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 150); do
            curl -sf -o /dev/null "http://127.0.0.1:$port/api/snapshot" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/gate.log"
          exit 1
      - name: Time every surface against the budget
        run: |
          status=0
          uv run --no-sync python bench/page_latency.py "http://127.0.0.1:$GATE_PORT" --repeat 3 --what-if in_progress review > "$RUNNER_TEMP/latency.txt" || status=$?
          cat "$RUNNER_TEMP/latency.txt"
          { echo '```'; cat "$RUNNER_TEMP/latency.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Stop the seeded server
        if: ${{ always() }}
        run: kill "$GATE_PID" || true

  # trantor's check-config test-tier policy over this tree (ci/trantor_tier_policy.py). A commit that fails it would
  # fail every trantor bump pinning it, so it must not go green here. Runs on the ai-vm-1 fleet beside dispatch.
  tier-policy:
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          token: ${{ steps.app-token.outputs.token }}
          path: .trantor
          sparse-checkout: lib
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - env:
          PYTHONPATH: .trantor/lib
        run: >-
          uv run --no-project --python 3.14 --with pyyaml
          python ci/trantor_tier_policy.py .trantor/lib/linting/check_config_checks/tier_policy.py

  # trantor main's tests of this package, run against this tree in place of trantor's starpulse submodule: the same
  # `make test-changed FILES=starpulse` trantor's Validate runs on a bump PR. A commit that fails them would fail every
  # trantor bump pinning it, so it must not go green here. A change trantor must adopt (a new table needs an Alembic
  # adoption; a test that pins a feed key this package owns) lands in trantor first, then here.
  trantor-contract:
    runs-on: [self-hosted, validate]
    timeout-minutes: 30
    steps:
      # The workspace App token, not GITHUB_TOKEN: GITHUB_TOKEN reads only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trantor-org/trantor
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: .trantor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .trantor/starpulse
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # `uv lock` as trantor's bump does: this tree's dependencies may differ from the ones trantor's lock pins.
      - working-directory: .trantor
        run: |
          uv lock
          make sync
          echo "PYTEST_WORKERS=$(uv run --no-project --python 3.14 bin/ci_pytest_workers.py)" >> "$GITHUB_ENV"
      - working-directory: .trantor
        run: make test-changed FILES=starpulse CI=1

  # Tells trantor which starpulse commit just passed so its starpulse-bump workflow opens one pull request pinned to
  # exactly that SHA. It runs on the generic ai-vm-1 fleet, not the validate lane, so validate-lane queue time is
  # unchanged, and it sends nothing for a pull request or a red run.
  dispatch:
    name: dispatch
    needs: [python, web, api-types, tier-policy, trantor-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      # The workspace App token, not GITHUB_TOKEN: a dispatch sent with GITHUB_TOKEN reaches only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - name: Dispatch the green SHA to trantor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREEN_SHA: ${{ github.sha }}
        run: |
          gh api repos/trantor-org/trantor/dispatches \
            -f event_type=starpulse-green \
            -f "client_payload[sha]=$GREEN_SHA"
