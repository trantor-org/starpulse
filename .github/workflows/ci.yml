name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Validation runs on the organization's self-hosted ai-vm-1 lane, free and independent of GitHub's hosted
# pool. That runner group serves private repositories only: making this repository public strands these jobs.
jobs:
  python:
    runs-on: [self-hosted, ai-vm-1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # Integration tests start Redis and Postgres containers on the runner's Docker.
      - run: uv run pytest

  web:
    runs-on: [self-hosted, ai-vm-1]
    defaults:
      run:
        working-directory: starpulse/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
