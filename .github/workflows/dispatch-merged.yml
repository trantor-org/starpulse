name: Dispatch merged pull request

# Sends the downstream consumer a merged commit's SHA at merge time when this repository's own CI
# already tested the tree the commit holds, instead of waiting for the push run on main to re-test
# it (ci.yml's `dispatch` job). That holds when the pull request's base is the merge commit's
# parent: the green pull-request run then tested head merged over exactly that parent. It also
# holds for a merge-queue merge: main fast-forwards to the queue's candidate, so a green
# merge_group run on the merge commit tested that very commit. Any other merge sends nothing
# here; the push run still dispatches it. The consumer
# re-checks the same condition and treats a duplicate dispatch for one SHA as one pull request.
#
# `pull_request_target`, not `pull_request`: the workflow file is read from the base branch, so a
# fork's pull request cannot rewrite this job or its condition. The job checks out nothing and
# passes the event's values through env, never into the script text.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    name: dispatch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    # The merge-event lane: a job that runs seconds after a merge and holds nothing else.
    runs-on: [self-hosted, merge-event]
    timeout-minutes: 5
    steps:
      - name: Check the pull request tested the merged tree
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          parent=$(gh api "repos/$REPOSITORY/commits/$MERGE_SHA" \
            --jq 'if (.parents | length) == 1 then .parents[0].sha else "" end')
          if [ -n "$parent" ] && [ "$parent" = "$BASE_SHA" ]; then
            tested_by="event=pull_request&head_sha=$HEAD_SHA"
          else
            # A queue merge's base is stale; its merge_group run tested the merge commit itself.
            tested_by="event=merge_group&head_sha=$MERGE_SHA"
          fi
          green=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?$tested_by&status=success&per_page=1" \
            --jq .total_count)
          if [ "$green" -gt 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No green run tested the merged tree: the push run dispatches."
          fi
      # The workspace App token, not GITHUB_TOKEN: a dispatch sent with GITHUB_TOKEN reaches only this repository.
      - name: Mint App token
        if: steps.tested.outputs.tested == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
      - name: Dispatch the merged SHA
        if: steps.tested.outputs.tested == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREEN_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh api repos/trantor-org/trantor/dispatches \
            -f event_type=starpulse-green \
            -f "client_payload[sha]=$GREEN_SHA"
