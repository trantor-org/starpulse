name: Dispatch merged pull request

# Pins a merged commit on trantor at merge time when this repository's own CI already tested the tree
# the commit holds, instead of waiting for the push run on main to re-test it (ci.yml's `dispatch` job).
# That holds when the pull request's base is the merge commit's parent: the workspace App's passing check runs on the
# head then tested head merged over exactly that parent. It also holds for a merge-queue merge: main fast-forwards to
# the queue's candidate, so the App's passing check runs on the merge commit tested that very commit (the checks are
# trantor's `ci-sp-*` Dagu DAGs, submitted by ci-event.yml). Any other merge sends nothing
# here; the push run still pins it. The pin script re-checks the same condition under one lock, so the
# second pin of a SHA finds it already on trantor's main and does nothing.
#
# `pull_request_target`, not `pull_request`: the workflow file is read from the base branch, so a
# fork's pull request cannot rewrite this job or its condition. The job checks out nothing and
# passes the event's values through env, never into the script text.
# Titled with the SHA it pins: bin/ci/merge_latency.py in trantor finds the run by it.
run-name: Pin ${{ github.event.pull_request.merge_commit_sha }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  dispatch:
    name: dispatch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    # Not the merge-event lane: that runner is the close submit's alone, and a second job per merge holds
    # its other relay slot, so the next merge's close waits for a slot to re-register.
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    steps:
      # trantor's script, run from the shared checkout on this runner: it mints the workspace App token by hand (the action
      # costs a runner download), pins under the warm clone's lock, restarts StarPulse on a direct pin, and falls back
      # to a bump pull request without a green App check. bin/ci/merge_latency.py dates the pin from this step's start.
      - name: Pin the starpulse SHA
        env:
          APP_CLIENT_ID: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PIN_DEPLOY_KEY: ${{ secrets.TRANTOR_PIN_DEPLOY_KEY }}
        run: |
          "$HOME/trantor/bin/starpulse_ops/starpulse_pin.sh"
