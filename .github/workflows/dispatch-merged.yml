name: Dispatch merged pull request

# Pins a merged commit on trantor at merge time when this repository's own CI already tested the tree
# the commit holds, instead of waiting for the push run on main to re-test it (ci.yml's `dispatch` job).
# That holds when the pull request's base is the merge commit's parent: the green pull-request run then tested head merged over exactly that parent. It also
# holds for a merge-queue merge: main fast-forwards to the queue's candidate, so a green
# merge_group run on the merge commit tested that very commit. Any other merge sends nothing
# here; the push run still pins it. The pin script re-checks the same condition under one lock, so the
# second pin of a SHA finds it already on trantor's main and does nothing.
#
# `pull_request_target`, not `pull_request`: the workflow file is read from the base branch, so a
# fork's pull request cannot rewrite this job or its condition. The job checks out nothing and
# passes the event's values through env, never into the script text.
# Titled with the SHA it pins: bin/ci/merge_latency.py in trantor finds the run by it.
run-name: Pin ${{ github.event.pull_request.merge_commit_sha }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    name: dispatch
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    # Not the merge-event lane: that runner is the close submit's alone, and a second job per merge holds
    # its other relay slot, so the next merge's close waits for a slot to re-register.
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      - name: Check the pull request tested the merged tree
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          parent=$(gh api "repos/$REPOSITORY/commits/$MERGE_SHA" \
            --jq 'if (.parents | length) == 1 then .parents[0].sha else "" end')
          if [ -n "$parent" ] && [ "$parent" = "$BASE_SHA" ]; then
            tested_by="event=pull_request&head_sha=$HEAD_SHA"
          else
            # A queue merge's base is stale; its merge_group run tested the merge commit itself.
            tested_by="event=merge_group&head_sha=$MERGE_SHA"
          fi
          green=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?$tested_by&status=success&per_page=1" \
            --jq .total_count)
          if [ "$green" -gt 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No green run tested the merged tree: the push run pins it."
          fi
      # trantor's script, run from the shared checkout on this runner: it mints the workspace App token by hand (the action
      # costs a runner download), pins under the warm clone's lock, and falls back to a bump pull request without the key.
      # bin/ci/merge_latency.py dates the pin from this step's start.
      - name: Pin the starpulse SHA
        if: steps.tested.outputs.tested == 'true'
        env:
          APP_CLIENT_ID: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PIN_DEPLOY_KEY: ${{ secrets.TRANTOR_PIN_DEPLOY_KEY }}
        run: |
          "$HOME/trantor/bin/starpulse_ops/starpulse_pin.sh"
