name: Fresh serve

# The out-of-the-box install is the production install: the branch's wheel goes into an empty virtualenv and
# `starpulse serve` starts from an empty directory with no config, then ci/fresh_serve.py asserts the page answers
# HTTP 200 and every worker context has a live child. It is a pull-request signal, not a required check.
on:
  pull_request:
    paths:
      - starpulse/**
      - pyproject.toml
      - uv.lock
      - ci/fresh_serve.py
      - .github/workflows/fresh-serve.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-serve:
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /*
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      # The wheel carries the built page (starpulse/static is not tracked).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/fresh" && uv pip install --python "$RUNNER_TEMP/fresh/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - run: '"$RUNNER_TEMP/fresh/bin/python" -I ci/fresh_serve.py "$RUNNER_TEMP/fresh/bin/python"'
