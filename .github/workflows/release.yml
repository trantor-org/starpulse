name: Release

# A `v<version>` tag publishes that version: a GitHub Release with generated notes and the built files,
# then PyPI through trusted publishing. A pull request runs the build alone, so a broken package shows
# before anything is tagged.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # A pull request builds on the self-hosted validate lane, as CI does; a tag builds on a clean hosted runner,
    # since what it builds is published.
    runs-on: ${{ startsWith(github.ref, 'refs/tags/v') && 'ubuntu-latest' || fromJSON('["self-hosted", "validate"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      # The server refuses to start without the page, so it is built before the package that carries it.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag names the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - name: The wheel carries the page
        run: unzip -l dist/*.whl | grep -q 'starpulse/static/index.html'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/starpulse/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv publish --trusted-publishing always dist/*
