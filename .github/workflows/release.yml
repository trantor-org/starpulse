name: Release

# A `v<version>` tag publishes that version: a GitHub Release with generated notes and the built files,
# then PyPI through trusted publishing, once a soak of the page has held. A pull request runs the build alone, so a
# broken package shows before anything is tagged. A manual dispatch builds and soaks any ref and publishes nothing,
# whatever ref it names.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long the soak holds the page, in seconds or with an s, m or h suffix; the release soak is 4h"
        type: string
        default: 4h

permissions:
  contents: read

jobs:
  build:
    # A pull request builds on the self-hosted validate lane, as CI does; a tag builds on a clean hosted runner,
    # since what it builds is published.
    runs-on: ${{ startsWith(github.ref, 'refs/tags/v') && 'ubuntu-latest' || fromJSON('["self-hosted", "validate"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      # The server refuses to start without the page, so it is built before the package that carries it.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag names the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - name: The wheel carries the page
        run: unzip -l dist/*.whl | grep -q 'starpulse/static/index.html'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # The latency budget's endurance half (bench/soak.py): one Chrome tab held open on a disposable seeded server that
  # the soak starts and feeds a replayed event stream, sampled and probed until the hold ends. It runs on the Tower
  # farm slots, the hardware the budget is judged on (ai-vm-1's Xeon cannot hold it). The soak's exit status is the
  # job's, so a page over budget or leaking publishes nothing: both publishing jobs need it.
  soak:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, validate, tower]
    # The 4 h hold, plus the page's build and the seeded server's start.
    timeout-minutes: 300
    # A soak holds one of Tower's three farm slots for hours: the next one for the same ref waits rather than
    # cancelling it. A tag's soak and a dispatch on that tag share no group, so a dispatch never displaces a release.
    concurrency:
      group: release-soak-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The seeded server serves the built page and refuses to start without it.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: starpulse/web
      - run: uv sync --locked --group bench
      - name: Hold the page open on a seeded server
        # A tag push has no inputs: the release holds 4 h.
        env:
          DURATION: ${{ inputs.duration || '4h' }}
        run: uv run --no-sync python bench/soak.py --duration "$DURATION" --report "$RUNNER_TEMP/soak.json"
      # The report is most worth reading when the soak failed or was cut off by the timeout.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: soak-report
          path: ${{ runner.temp }}/soak.json
          if-no-files-found: warn

  github-release:
    # A push here is a tag: only `v*` tags trigger it. A dispatch names a ref, which may be a tag, and publishes nothing.
    if: github.event_name == 'push'
    needs: [build, soak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    if: github.event_name == 'push'
    needs: [github-release, soak]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/starpulse/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv publish --trusted-publishing always dist/*
