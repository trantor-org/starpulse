name: TASK-3504 latency evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  latency:
    if: github.head_ref == 'claude/task-3504-reveal-starpulse'
    runs-on: [self-hosted, validate, tower]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build seeded preview
        run: |
          uv sync --locked --group bench
          pnpm --dir starpulse/web install --frozen-lockfile
          pnpm --dir starpulse/web run build
          port="$(uv run python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          echo "PORT=$port" >> "$GITHUB_ENV"
          uv run python -m ci.seeded_server --port "$port" --dir "$RUNNER_TEMP/task-3504-seeded" > "$RUNNER_TEMP/task-3504-server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null "http://127.0.0.1:$port/api/snapshot" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/task-3504-server.log"
          exit 1
      - name: Run two 4x measurements
        env:
          STARPULSE_BENCH_VIEWER: "1"
        run: |
          set +e
          uv run --group bench python bench/page_latency.py "http://127.0.0.1:$PORT" --viewer --cpu-throttle 4 --samples 30 --json "$RUNNER_TEMP/task-3504-run-1.json" | tee "$RUNNER_TEMP/task-3504-run-1.txt"
          uv run --group bench python bench/page_latency.py "http://127.0.0.1:$PORT" --viewer --cpu-throttle 4 --samples 30 --json "$RUNNER_TEMP/task-3504-run-2.json" | tee "$RUNNER_TEMP/task-3504-run-2.txt"
          set -e
          uv run python - "$RUNNER_TEMP/task-3504-run-1.json" "$RUNNER_TEMP/task-3504-run-2.json" <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              rows = [row for row in json.load(open(path))["rows"] if row["name"].startswith("switch to")]
              print(path)
              for row in rows:
                  print(f'{row["name"]}: {row["p95"]:.1f} ms')
              assert rows and all(row["p95"] <= 50 for row in rows)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-3504-latency
          path: |
            ${{ runner.temp }}/task-3504-run-*.json
            ${{ runner.temp }}/task-3504-run-*.txt
            ${{ runner.temp }}/task-3504-server.log
      - if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
