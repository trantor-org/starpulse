name: UI preview

# The paths filter is `UI_GLOBS` in ci/ui_preview.py; its test holds the two equal.
#
# Every open UI pull request publishes its scrubbed demos to the public trantor-org/starpulse-demo Pages repository,
# under starpulse-pr-<N>/, and links them in its description; closing the pull request unpublishes them, which is
# why that event starts a run too.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - starpulse/web/**
      - ci/**
      - .github/workflows/ui-preview.yml
      - design/**

permissions:
  contents: read

jobs:
  render:
    name: Render UI paths
    # A newer push supersedes a render still in flight for the same pull request.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # Review context, never a gate: a failed render must not impede the pull request it describes.
    continue-on-error: true
    # The server starts its own Valkey container, so the job needs the runner's Docker, as the test suite does.
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          # The self-hosted runners share one home, so the default ~/setup-pnpm collides between concurrent jobs.
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      - name: Build the page
        if: github.event.action != 'closed'
        working-directory: starpulse/web
        run: pnpm install --frozen-lockfile && pnpm run build

      # Writes to the public demo repository only.
      - name: Mint demo repository token
        id: demo-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: starpulse-demo
          permission-contents: write

      - name: Render and post the screenshots
        env:
          # `gh pr comment --attach` is the only way to upload a screenshot into a comment, and it refuses an App or
          # Actions token ("unsupported authentication type"), so the comment is posted as RENOVATE_TOKEN's user, the
          # PAT the trantor workspace's own UI preview posts with.
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          DEMO_TOKEN: ${{ steps.demo-token.outputs.token }}
          ACTION: ${{ github.event.action }}
        run: >-
          uv run python ci/ui_preview.py
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --sha "${{ github.event.pull_request.head.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --action "$ACTION"

      # The copy of the scrubbed demos the leak scan reads; the render published the same files.
      - name: Upload the demos
        if: ${{ !cancelled() && github.event.action != 'closed' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-demo
          path: .tmp/ui-preview/demo/
          if-no-files-found: ignore

  # The render job never gates the pull request, so a leak found there would not turn the check red; the publish
  # refuses a leaking demo, and this job scans the copy the render uploaded, failing when one still names a real
  # identifier.
  leak-scan:
    name: Scan the demos for leaks
    needs: render
    if: ${{ !cancelled() && needs.render.result == 'success' && github.event.action != 'closed' }}
    runs-on: [self-hosted, ai-vm-1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pattern, so a pull request that built no demo downloads nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-demo
          merge-multiple: true
          path: .tmp/ui-demo

      - run: python3 ci/ui_preview.py --scan .tmp/ui-demo
