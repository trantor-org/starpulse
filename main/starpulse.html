// The public demo's whole server: `window.__REPLAY__` maps a read's path and query (a task's `/graphql` read by `?task=` and `&select=`, the fields it asked for) to `[status, body]`, recorded from a seeded
// StarPulse. Reads answer from it, writes refuse, and the event stream sends the recorded snapshot once and then nothing.
(function () {
  var recording = window.__REPLAY__ || {};
  var realFetch = window.fetch.bind(window);
  var json = function (status, body) {
    return new Response(JSON.stringify(body), { status: status, headers: { "content-type": "application/json" } });
  };
  window.fetch = function (input, init) {
    var url = new URL(typeof input === "string" ? input : input.url || String(input), location.href);
    if (url.pathname.indexOf("/api/") !== 0 && url.pathname !== "/graphql") return realFetch(input, init);
    var method = ((init && init.method) || (typeof input !== "string" && input.method) || "GET").toUpperCase();
    var key = url.pathname + url.search;
    if (method === "POST" && url.pathname === "/graphql") {
      // A task's read is recorded per task and per selection: the moves and the spend of one task are two reads with two bodies.
      var sent = JSON.parse((init && init.body) || "{}");
      var id = (sent.variables || {}).id;
      var picked = /task\(id: \$id\)\s*\{([\s\S]*)\}\s*\}\s*$/.exec(sent.query || "");
      key = id === undefined ? url.pathname + "?tasks" : url.pathname + "?task=" + id + "&select=" + (picked ? picked[1].split(/\s+/).filter(Boolean).join(" ") : "");
    } else if (method === "POST" && url.pathname === "/api/docs") {
      // The page lists docs with a POST of their ids; the recording keys that read by the ids it named.
      var ids = JSON.parse((init && init.body) || "{}").ids || [];
      key = url.pathname + "?ids=" + ids.join(",");
    } else if (method !== "GET") return Promise.resolve(json(405, { error: "the public demo is read-only" }));
    var hit = recording[key];
    return Promise.resolve(hit ? json(hit[0], hit[1]) : json(404, { error: "not in the demo's recording" }));
  };

  class Replay extends EventTarget {
    constructor(url) {
      super();
      this.url = url;
      this.readyState = 1;
      this.onopen = this.onerror = null;
      var snapshot = recording["/api/snapshot"];

    }

// The snapshot comes as `ref <path>` and its body is fetched at once, so the browser reads it off its main thread.
(function () {

      early.events.push({ type: type, data: e.data });
