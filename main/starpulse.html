// The public demo's whole server: `window.__REPLAY__` maps a read's path and query (a task's `/graphql` read by `?task=`) to `[status, body]`, recorded from a seeded
// StarPulse. Reads answer from it, writes refuse, and the event stream sends the recorded snapshot once and then nothing.
(function () {
  var recording = window.__REPLAY__ || {};
  var realFetch = window.fetch.bind(window);
  var json = function (status, body) {
    return new Response(JSON.stringify(body), { status: status, headers: { "content-type": "application/json" } });
  };
  window.fetch = function (input, init) {
    var url = new URL(typeof input === "string" ? input : input.url || String(input), location.href);
    if (url.pathname.indexOf("/api/") !== 0 && url.pathname !== "/graphql") return realFetch(input, init);
    var method = ((init && init.method) || (typeof input !== "string" && input.method) || "GET").toUpperCase();
    var key = url.pathname + url.search;
    if (method === "POST" && url.pathname === "/graphql") {
      // The task detail's moves are one recorded read per task; any other query of the task answers with the same body.
      key = url.pathname + "?task=" + (JSON.parse((init && init.body) || "{}").variables || {}).id;
    } else if (method === "POST" && url.pathname === "/api/docs") {
      // The page lists docs with a POST of their ids; the recording keys that read by the ids it named.
      var ids = JSON.parse((init && init.body) || "{}").ids || [];
      key = url.pathname + "?ids=" + ids.join(",");
    } else if (method !== "GET") return Promise.resolve(json(405, { error: "the public demo is read-only" }));
    var hit = recording[key];
    return Promise.resolve(hit ? json(hit[0], hit[1]) : json(404, { error: "not in the demo's recording" }));
  };

  class Replay extends EventTarget {
    constructor(url) {
      super();
      this.url = url;
      this.readyState = 1;
      this.onopen = this.onerror = null;
      var snapshot = recording["/api/snapshot"];
      if (url.indexOf("/api/events") !== 0 || !snapshot) return;
      setTimeout(() => {
        if (this.readyState === 2) return;
        if (this.onopen) this.onopen(new Event("open"));
        this.dispatchEvent(new MessageEvent("snapshot", { data: JSON.stringify(snapshot[1]) }));
      }, 0);
    }
    close() {
      this.readyState = 2;
    }
  }
  window.EventSource = Replay;
})();

// Ask for the snapshot now: the server answers while the bundle loads. src/api/stream.ts takes this connection over and replays what it held.
// The snapshot comes as `ref <path>` and its body is fetched at once, so the browser reads it off its main thread.
(function () {
  var early = (window.__earlyStream = { src: new EventSource("/api/events?snapshot=ref"), events: [], bodies: {} });
  ["snapshot", "build", "restarting", "stale", "task", "move", "dags", "pulls", "ledgers", "claim", "scheduler", "level"].forEach(function (type) {
    early.src.addEventListener(type, function (e) {
      if (early.adopted) return;
      early.events.push({ type: type, data: e.data });
      if (type === "snapshot" && e.data.slice(0, 4) === "ref ") early.bodies[e.data.slice(4)] = fetch(e.data.slice(4), { headers: { "X-StarPulse-Client": "web" } });
    });
  });
  // A task the address names: its record is asked for now as well, so its modal does not wait for the bundle, the snapshot or the page's other
  // fetches. src/boot.ts takes the answer over.
  var query = new URLSearchParams(window.location.search), task = query.get("task");
  if (task) window.__earlyRecord = { id: task, read: fetch("/api/task/" + encodeURIComponent(task), { headers: { "X-StarPulse-Client": "web" } }) };
})();
</script>
