<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Design mockup of the single-page StarPulse view, under operator review; not served by
  starpulse. data.js is a saved Board snapshot, and the page replays its last hour at 60x.
  View it with: uv run python -m http.server 8781 --directory design
-->
<title>StarPulse — single-page mockup</title>
<style>
:root { --bg0: #05070d; --ink: #dbe4f3; --muted: #6b7a93; --rail: 250px; --nav: 52px; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; }
canvas.drag { cursor: grabbing; }
aside { position: fixed; z-index: 2; top: 0; bottom: 0; box-sizing: border-box; padding: 20px 18px; overflow: hidden; background: rgba(8,12,22,.78);
  backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 18px; font-size: 11px; color: var(--muted); }
aside h3 { margin: 0 0 8px; font-size: 10px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
#rail { right: 0; width: var(--rail); border-left: 1px solid rgba(148,163,184,.10); }
/* the navigator is a hair-thin hover zone; hovering fades a wispy panel in over the canvas, no hard edge, no layout shift */
#nav { left: 0; width: var(--nav); padding: 0; overflow: visible; z-index: 5; background: none; backdrop-filter: none; gap: 0; }
/* nothing sits behind the navigator: a faint hairline is the only cue, and the panel fades in place (no slide, no growth) */
#nav::after { content: ""; position: absolute; left: 0; top: 25%; bottom: 25%; width: 1px; background: linear-gradient(transparent, rgba(148,163,184,.22), transparent); transition: opacity .4s ease; pointer-events: none; }
#nav:hover::after, #nav:focus-within::after { opacity: 0; }
body:has(#nav:hover) #crumbs, body:has(#nav:focus-within) #crumbs { opacity: 0; }
#crumbs { transition: opacity .4s ease; }
#full { position: absolute; left: 0; top: 0; bottom: 0; width: 310px; box-sizing: border-box; padding: 20px 52px 20px 18px; display: flex; flex-direction: column; gap: 16px;
  isolation: isolate; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
#full::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(4,7,14,.9), rgba(4,7,14,.6) 60%, rgba(4,7,14,0));
  -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent); mask-image: linear-gradient(90deg, #000 45%, transparent); backdrop-filter: blur(7px); }
#nav:hover #full, #nav:focus-within #full { opacity: 1; pointer-events: auto; }
#full .t { font-weight: 300; letter-spacing: .02em; }
#mini .mg { display: block; border-radius: 50%; border: 1.5px solid #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,.5); }
#mini .mg.here { background: rgba(167,139,250,.4); }
#mini .lv { width: 1px; height: 14px; background: rgba(148,163,184,.25); margin: -8px 0; }
#mini .pulse { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
#mini .cnt { font: 10px "JetBrains Mono", ui-monospace, monospace; color: #fbbf24; }
#q { all: unset; box-sizing: border-box; width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid rgba(148,163,184,.2); background: rgba(148,163,184,.06); font-size: 12px; color: var(--ink); }
#q:focus { border-color: #a78bfa; }
.node .chev { color: #475569; font-size: 10px; padding: 2px 4px; cursor: pointer; }
.node .chev:hover { color: var(--ink); }
.more { all: unset; cursor: pointer; display: block; padding: 3px 0 3px 30px; font-size: 11px; color: #64748b; }
.more:hover { color: var(--ink); }
#nav h1 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--ink); opacity: .85; }
#nav .sub { margin-top: 6px; font-size: 11px; line-height: 1.6; }
#nav .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 8px #34d399; }
#clock { color: #fbbf24; font: 10.5px "JetBrains Mono", ui-monospace, monospace; }
/* layer navigator: one node per level, a dashed spine joins a level to its children, the current path is lit */
.node { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px;
  width: 100%; padding: 5px 8px 5px 0; border-radius: 6px; color: #94a3b8; }
.node:hover { background: rgba(148,163,184,.08); color: var(--ink); }
.node.on { background: linear-gradient(90deg, rgba(167,139,250,.18), rgba(167,139,250,0)); color: var(--ink); }
.node.here { box-shadow: inset 2px 0 0 #a78bfa; }
.node .g { justify-self: center; border-radius: 50%; border: 1.5px solid currentColor; transition: box-shadow .2s, border-color .2s; }
.node .n { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.node.live .g { box-shadow: 0 0 0 3px rgba(251,191,36,.25), 0 0 10px #fbbf24; border-color: #fbbf24; }
.kids { margin-left: 10px; padding-left: 8px; border-left: 1px dashed rgba(148,163,184,.18); }
.lvl { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: #3f4c66; margin: 6px 0 2px 30px; }
#rail .row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
#rail button, #cons button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); letter-spacing: .04em; }
#rail button:hover, #cons button:hover { color: var(--ink); }
#cons button i { width: 5px; height: 5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399; }
#rail button.off { opacity: .35; text-decoration: line-through; }
#feed { font: 10.5px/1.75 "JetBrains Mono", ui-monospace, monospace; flex: 1; min-height: 0; overflow: hidden; }
#feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed b { font-weight: 400; color: var(--ink); } #feed em { font-style: normal; opacity: .6; }
#legend { line-height: 1.9; }
#legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 5px 0 0; vertical-align: 0; }
#legend span { margin-right: 10px; white-space: nowrap; }
.hud { position: fixed; z-index: 2; left: calc(var(--nav) + 24px); pointer-events: none; font-size: 12px; color: var(--muted); }
#crumbs { display: none; }
#crumbs button { all: unset; cursor: pointer; color: var(--muted); } #crumbs button:hover { color: var(--ink); }
#crumbs b { font-weight: 500; color: var(--ink); } #crumbs span { color: #3b4760; }
#tip { position: fixed; z-index: 4; pointer-events: none; padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.5;
  background: rgba(12,19,34,.92); border: 1px solid rgba(148,163,184,.18); backdrop-filter: blur(6px); max-width: 380px; opacity: 0; transition: opacity .12s; }
#tip .k { color: var(--muted); font-size: 11px; } #tip .n { font-weight: 500; }
#panel { position: fixed; z-index: 3; top: 20px; right: calc(var(--rail) + 20px); width: 380px; max-height: calc(100% - 40px); overflow: auto; box-sizing: border-box;
  padding: 16px 18px; border-radius: 10px; font-size: 12px; line-height: 1.6; background: rgba(12,19,34,.95); border: 1px solid rgba(148,163,184,.2); display: none; }
#panel.open { display: block; }
#panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
#panel .k { color: var(--muted); font-size: 11px; }
#panel .x { position: absolute; top: 10px; right: 14px; cursor: pointer; color: var(--muted); }
#panel .desc { margin-top: 10px; white-space: pre-wrap; color: #b8c4d8; }
#panel table { border-collapse: collapse; margin-top: 8px; width: 100%; }
#tip .stats { display: flex; gap: 12px; margin: 6px 0 2px; } #tip .stats b { color: #fbbf24; font-weight: 600; }
#tip .fc { margin-top: 4px; color: #8b95a8; font-size: 11px; border-top: 1px dashed rgba(148,163,184,.25); padding-top: 4px; }
#panel table.trace td:first-child { color: #fbbf24; width: 22px; } #panel table.trace td:last-child { text-align: right; color: var(--muted); }
#panel td { padding: 2px 8px 2px 0; vertical-align: top; } #panel td:first-child { color: var(--muted); white-space: nowrap; }
#panel .run { margin-top: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #34d399; background: rgba(52,211,153,.12); color: #34d399; cursor: pointer; font: inherit; }
#panel .run[disabled] { border-color: #475569; color: #64748b; background: none; cursor: not-allowed; }
#panel .note { margin-top: 6px; color: var(--muted); font-size: 11px; }
.chip { display: inline-block; padding: 0 6px; margin: 2px 4px 0 0; border-radius: 4px; background: rgba(148,163,184,.12); font-size: 11px; }
/* fan-out: a DAG's queue bar and one row per run in flight */
#panel .qbar { position: relative; height: 6px; border-radius: 3px; background: rgba(148,163,184,.14); margin: 6px 0 2px; overflow: hidden; }
#panel .qbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #fbbf24; transition: width .5s; } #panel .qbar i.full { background: #fb7185; }
#panel .fan { margin-top: 12px; border-top: 1px solid rgba(148,163,184,.12); padding-top: 10px; }
#panel .fan .hd { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
#panel .fr { display: grid; grid-template-columns: 78px 1fr 46px; gap: 2px 8px; align-items: center; padding: 5px 6px; border-radius: 6px; }
#panel .fr:hover { background: rgba(148,163,184,.07); } #panel .fr.adv { animation: flash 1.2s; } #panel .fr.queued { opacity: .55; }
#panel .fr a { color: #a78bfa; text-decoration: none; font: 11.5px ui-monospace, monospace; } #panel .fr a:hover { text-decoration: underline; }
#panel .fr .el { text-align: right; color: var(--muted); font: 11px ui-monospace, monospace; }
#panel .fr .st { grid-column: 2 / 3; color: var(--muted); font-size: 10.5px; } #panel .fr .st b { color: #fbbf24; font-weight: 500; }
#panel .fan .empty { color: var(--muted); font-size: 11px; }
.strip { display: flex; gap: 2px; align-items: center; } .strip i { flex: 1; height: 6px; border-radius: 2px; background: #334155; transition: background .4s; }
.strip i.succeeded { background: #34d399; } .strip i.running { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,.6); } .strip i.failed { background: #fb7185; }
#queues .q { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); }
#queues .q span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#queues .m { height: 3px; border-radius: 2px; background: rgba(148,163,184,.15); margin: 2px 0 6px; overflow: hidden; } #queues .m i { display: block; height: 100%; transition: width .5s; }
#feed div.new { animation: flash 1.2s; } @keyframes flash { from { background: rgba(251,191,36,.18); } to { background: none; } }
/* design review only: the fan-out scenario switcher, shown when the address names one with ?s= */
#fanctl { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: 14px; display: flex; gap: 6px; align-items: center; font-size: 11px; }
#fanctl button { all: unset; white-space: nowrap; cursor: pointer; padding: 3px 9px; border-radius: 5px; border: 1px solid rgba(148,163,184,.25); color: var(--muted); background: rgba(6,10,20,.8); }
#fanctl button.on { color: #fbbf24; border-color: #fbbf24; } #fanctl .note { color: var(--muted); max-width: 420px; }
</style>
</head>

<canvas id="c"></canvas>
<aside id="nav">
  <div id="full">
    <section><h1>StarPulse</h1><div class="sub"><span class="dot"></span><span id="stamp"></span></div></section>

    <section><h3>Constellations</h3><div id="cons"></div></section>
    <section><h3>Queues</h3><div id="queues"></div></section>
  </div>
</aside>
<div id="clock" class="hud" style="top:18px;left:auto;right:calc(var(--rail) + 24px)"></div>
<div id="crumbs" class="hud"></div>
<aside id="rail">
  <section><h3>Actors</h3><div class="row" id="kinds"></div></section>
  <section style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>Recent</h3><div id="feed"></div></section>
  <section id="legend"><h3>Legend</h3></section>
</aside>
<div id="tip"></div>
<div id="panel"></div>
<div id="fanctl" hidden></div>

<script>// Design mockup of the Kanban's Waiting stacks, drawn when the address carries ?view=kanban.
// The board, columns, buckets and cards copy the page's Kanban (starpulse/web/src/features/kanban/Kanban.tsx and style.css) over board.js, a saved
// live Board. New here: a Waiting card whose dependency is Waiting in the same milestone stacks under it, the blocker on top with a
// count badge; hovering a stack unstacks it downward, shifting the cards below; a dependency on a Waiting task in another milestone
// shows as a link badge that opens the blocker's modal. Moves are simulated in the page against each task's saved move verdicts.
// Done stacks the same way along its chains, the chain's end on top and what it depended on under it.
(() => {

  const B = window.BOARD, NOW = B.now;
  const COLUMNS = ["ready", "waiting", "in_progress", "review", "needs_attention", "done"];
  const SCENES = {
    board: "The whole board, stacks folded",
    unstack: "m-107 stack unstacked: a four-deep chain",
    multi: "m-100: a dependent with several Waiting blockers sits under the first",
    cross: "A Waiting dependency in another milestone: link badge",
    done: "Done chains stacked: the chain's end on top, what it depended on under it",
    before: "Today's Kanban, no stacks, for comparison",
  };
  const scene = SCENES[params.get("s")] ? params.get("s") : "board";
  const SIZES = { 1: "100%", 1.25: "125%", 1.5: "150%" };

  const num = (id) => +(/(\d+)$/.exec(id)?.[1] ?? 0);

  let query = "", hovered = null, open = null, pinned = null, refusal = null;
  const folded = new Set(), hidden = new Set();

  // ---- the model: kanban.ts's layout and hold counts, plus the stacks this design adds
  const isOpen = (id) => byId.get(id) && byId.get(id).lane !== "done";
  const openDeps = (t) => t.dependencies.filter(isOpen);
  const matches = (t) => query.toLowerCase().split(/\s+/).filter(Boolean).every((w) => [t.id, t.title, ...t.labels].some((f) => f.toLowerCase().includes(w)));
  function edges() {
    const heldBy = new Map(), waitsOn = new Map();
    for (const t of tasks) {
      const deps = openDeps(t);
      if (t.lane === "done" || !deps.length) continue;
      waitsOn.set(t.id, deps);
      if (t.lane === "waiting") for (const d of deps) heldBy.set(d, [...(heldBy.get(d) ?? []), t.id]);
    }
    return { heldBy, waitsOn };
  }
  function reach(id, next) {
    const seen = new Set(), todo = [id];
    for (let at = todo.pop(); at !== undefined; at = todo.pop()) for (const n of next.get(at) ?? []) if (n !== id && !seen.has(n)) { seen.add(n); todo.push(n); }
    return seen;
  }

    return tasks.filter((t) => (holds.get(t.id) ?? 0) > 0 && !(t.lane === "waiting" && openDeps(t).length > 0))
      .map((task) => ({ task, holds: holds.get(task.id) }))
      .sort((a, b) => b.holds - a.holds || num(a.task.id) - num(b.task.id));

  /** A bucket's cards as stacks along their dependency chains. In Waiting the top is the blocker that unblocks first: a task
   *  with no Waiting dependency in the bucket, the rest under the stack of their first blocker (lowest chain depth, then id).
   *  In Done it runs the other way: the top is the chain's end, the task nothing else Done in the bucket depends on, with
   *  what it depended on under it, so the newest outcome reads first. */
  const STACKED = new Set(["waiting", "done"]);

    const here = new Map(list.map((t) => [t.id, t]));
    const after = new Map();
    if (lane === "done") for (const t of list) for (const d of t.dependencies) if (here.has(d) && d !== t.id) after.set(d, [...(after.get(d) ?? []), t.id]);

    const depth = new Map(), root = new Map();

      if (depth.has(t.id)) return depth.get(t.id);

    const labs = t.labels.map((l) => `<span title="${esc(l)}" class="lab${/^size-/.test(l) ? " sz" : ""}">${esc(/^size-/.test(l) ? `${l.slice(5)}pt` : l)}</span>`).join("");
    const cross = stacking ? crossOf(t).map((d) => `<button class="xm" data-open="${esc(d.id)}" title="Waits on ${esc(d.id)} in ${esc(d.milestone || "No milestone")} (Waiting): open it">↗ ${nw(d.milestone || "no milestone")} · ${nw(d.id)}</button>`).join("") : "";
    const sk = stackCount ? `<span class="sk${lane === "done" ? " dn" : ""}" title="${stackCount} ${lane === "done" ? "Done task" : "Waiting task"}${stackCount === 1 ? "" : "s"} ${lane === "done" ? "this one's chain finished first" : "stacked under this one"}; hover to unstack">${STACK_ICON}${stackCount}</span>` : "";
    const od = openDeps(t).length;
    const uw = under && blockers?.length ? (lane === "done" ? `<div class="uw dn">✓ unblocked ${blockers.map(nw).join(", ")}</div>` : `<div class="uw">⧗ waits on ${blockers.map(nw).join(", ")}</div>`) : "";
    const note = refusal?.id === t.id ? `<div class="refusal">Move to ${esc(B.names[refusal.to] ?? refusal.to)} refused · stayed in ${esc(B.names[t.lane])}<br>${esc(refusal.why)}<button class="dismiss" data-dismiss>dismiss</button></div>` : "";
    return `<div class="${cls}" role="button" tabindex="0" data-id="${esc(t.id)}">
      <div class="top"><span class="id">${esc(t.id)}</span>${pr}</div>${uw}
      <div class="t">${esc(t.title)}</div>${mach}
      <div class="foot">${labs}${sk}${holds ? `<span class="holds" title="holds ${holds} Waiting task${holds === 1 ? "" : "s"}">⛓${holds}</span>` : ""}${od ? `<span class="dep" title="open dependencies">⧗${od}</span>` : ""}${cross}
        ${t.assignee ? `<span class="who"><i style="background:${hue(t.assignee)}"></i>${esc(short(t.assignee))}</span>` : '<span class="who">unassigned</span>'}</div>${note}
    </div>`;
  }

  let holdsMap = new Map(), chainFn = null;
  function computeChain() {
    const e = edges();
    holdsMap = new Map([...e.heldBy.keys()].map((id) => [id, reach(id, e.heldBy).size]));
    chainFn = null;
    if (!hovered) return;
    const holds = reach(hovered, e.heldBy), waits = reach(hovered, e.waitsOn);
    if (!holds.size && !waits.size) return;
    chainFn = (id) => (id === hovered ? "self" : holds.has(id) ? "holds" : waits.has(id) ? "waits" : undefined);
  }

  function render() {
    const prevRects = rects();
    computeChain();
    const cols = layout();
    const shown = cols.reduce((n, c) => n + c.count, 0), done = cols.find((c) => c.id === "done").count;
    const total = tasks.filter((t) => COLUMNS.includes(t.lane)).length;
    const held = holders(holdsMap);
    const opts = { holds: 0 };
    const colHtml = cols.map((col) => {
      const inChain = chainFn ? col.buckets.flatMap((b) => b.tasks).filter((t) => ["holds", "waits"].includes(chainFn(t.id))).length : 0;
      const strip = col.id === "waiting" ? `<div class="heldby"><span class="k" title="The tasks every Waiting chain ends at">Held by</span>${held.slice(0, 3).map(({ task, holds }) => `<button class="hb${task.lane === "needs_attention" ? " nh" : ""}" data-open="${esc(task.id)}" data-hover="${esc(task.id)}" title="${esc(task.title)} · holds ${holds}">${esc(task.id)}<b>⛓${holds}</b></button>`).join("")}${held.length > 3 ? `<span class="more">+${held.length - 3} more</span>` : ""}</div>` : "";
      const body = col.buckets.length ? col.buckets.map((b) => {
        let inner;
        if (STACKED.has(col.id) && stacking) inner = stacksOf(b.tasks, col.id).map((s) => stackHtml(s, col.id)).join("");
        else inner = b.tasks.map((t) => cardHtml(t, { ...opts, holds: holdsMap.get(t.id), chain: chainFn?.(t.id) })).join("");
        return `<div class="bucket${b.folded ? " folded" : ""}" data-m="${esc(b.milestone)}"><div class="bh" data-fold="${esc(b.milestone)}" title="${esc(b.milestone || "No milestone")}"><span class="tw">▾</span><span class="bn">${esc(b.milestone || "No milestone")}</span><span class="c">${b.tasks.length}</span><button class="hide" data-hidem="${esc(b.milestone)}">hide</button></div>${inner}</div>`;
      }).join("") : '<div class="empty">no tasks</div>';
      return `<section class="col" data-lane="${col.id}"><h2><span class="g"></span><span class="nm" title="${esc(col.name)}">${esc(col.name)}</span><span class="c">${col.count}</span>${inChain ? `<span class="cc">⛓${inChain}</span>` : ""}</h2>${strip}<div class="body">${body}</div></section>`;
    }).join("");
    const scroll = [...kb.querySelectorAll(".col .body")].map((b) => b.scrollTop);
    const hadFocus = document.activeElement?.id === "kbq";
    kb.innerHTML = `<header><span class="title">Kanban</span><span class="count">${shown - done} open · ${done} done</span>
      <div id="kbrev" title="Design review controls, not part of the page"><span>scene</span>${Object.entries(SCENES).map(([k, v]) => `<button data-scene="${k}" class="${k === scene ? "on" : ""}" title="${esc(v)}">${k}</button>`).join("")}<span class="sep"></span><span>text</span>${Object.entries(SIZES).map(([k, v]) => `<button data-fs="${k}" class="${+k === fs ? "on" : ""}">${v}</button>`).join("")}</div></header>
      <div class="filters"><div class="fw"><input id="kbq" type="text" value="${esc(query)}" placeholder="filter by id, title or label…" autocomplete="off" spellcheck="false"></div>
        <span class="fchip">Assignee <b>any</b></span><span class="fchip">Milestone <b>any</b></span>${query ? '<button class="clear" data-clear>clear</button>' : ""}${hidden.size ? `<span class="fchip set" data-showall>${hidden.size} hidden · show</span>` : ""}
        <span class="shown">${shown} of ${total} tasks</span></div>
      <div id="cols">${colHtml}</div>`;
    kb.querySelectorAll(".col .body").forEach((b, i) => (b.scrollTop = scroll[i] ?? 0));
    if (hadFocus) { const q = kb.querySelector("#kbq"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    kb.querySelectorAll(".stack").forEach((s) => settle(s, s.dataset.top === pinned || s.dataset.top === openStack, false));
    flip(prevRects);
  }

  function stackHtml(s, lane = "waiting") {
    const n = s.members.length - 1;
    const cards = s.members.map((t, i) => cardHtml(t, { lane, holds: holdsMap.get(t.id), chain: chainFn?.(t.id), under: i > 0, stackCount: i === 0 ? n : 0, blockers: s.blockers(t) })).join("");
    if (!n) return cards;
    const edges = Array.from({ length: Math.min(2, n) }, (_, i) => `<div class="edge" style="left:${(i + 1) * 5}px;right:${(i + 1) * 5}px;z-index:${-1 - i}"></div>`).join("");
    return `<div class="stack" data-top="${esc(s.top.id)}" data-n="${n}">${edges}<div class="spine"></div>${cards}</div>`;
  }

  /** Lay a stack's cards out folded (layered under the top, edges peeking) or unstacked (in flow, the column below pushed down). */
  function settle(el, unstacked, animate = true) {
    const cards = [...el.querySelectorAll(":scope > .card")];
    if (!animate) el.style.transition = "none", cards.forEach((c) => (c.style.transition = "none"));
    el.classList.toggle("open", unstacked);
    const hs = cards.map((c) => c.offsetHeight), gap = 7, peek = Math.min(2, cards.length - 1) * 5;
    let y = 0;
    cards.forEach((c, i) => {
      c.style.zIndex = String(cards.length - i);
      if (unstacked) { c.style.transform = `translateY(${y}px)`; c.style.opacity = "1"; y += hs[i] + gap; }
      else { c.style.transform = i === 0 ? "none" : `translateY(${hs[0] - hs[i] + Math.min(i, 2) * 5}px) scale(${1 - Math.min(i, 2) * 0.03})`; c.style.opacity = i === 0 ? "1" : "0"; }
    });
    el.querySelectorAll(":scope > .edge").forEach((e, i) => (e.style.top = `${hs[0] - 6 + i * 5}px`));
    const spine = el.querySelector(".spine");
    el.style.height = `${unstacked ? y - gap : hs[0] + peek}px`;
    if (spine) spine.style.height = `${Math.max(0, y - gap - 30)}px`;
    if (!animate) { void el.offsetHeight; el.style.transition = ""; cards.forEach((c) => (c.style.transition = "")); }
  }

  // ---- FLIP: cards that move between renders (a move, a fold, a filter) glide to their new place
  function rects() { return new Map([...kb.querySelectorAll(".card")].map((c) => [c.dataset.id, c.getBoundingClientRect()])); }
  function flip(prev) {
    if (!prev.size) return;
    for (const c of kb.querySelectorAll(".card")) {
      const a = prev.get(c.dataset.id), b = c.getBoundingClientRect();
      if (!a || !b.width || (Math.abs(a.left - b.left) < 1 && Math.abs(a.top - b.top) < 1)) continue;
      if (c.parentElement.classList.contains("stack")) continue; // a stack lays its own cards out
      c.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px)` }, { transform: "none" }], { duration: 320, easing: "cubic-bezier(.3,.7,.2,1)" });
    }
  }

  // ---- hover: unstack after a short intent delay; fold back once the pointer leaves the unstacked cards
  let openStack = null, intent = null;
  kb.addEventListener("pointerover", (e) => {
    const card = e.target.closest(".card");
    const id = card?.dataset.id ?? e.target.closest("[data-hover]")?.dataset.hover ?? null;
    if (id !== hovered && !drag) { hovered = id; paintChain(); }
    const st = e.target.closest(".stack");
    if (st && st.dataset.top !== openStack && !drag) {
      clearTimeout(intent);
      intent = setTimeout(() => { if (openStack && openStack !== st.dataset.top) fold(openStack); openStack = st.dataset.top; settle(st, true); }, 140);
    }
  });
  kb.addEventListener("pointerout", (e) => {
    const st = e.target.closest(".stack");
    if (st && !st.contains(e.relatedTarget)) { clearTimeout(intent); if (openStack === st.dataset.top) { openStack = null; if (pinned !== st.dataset.top) settle(st, false); } }
    if (!kb.contains(e.relatedTarget) && hovered) { hovered = null; paintChain(); }
  });
  kb.addEventListener("focusin", (e) => { const st = e.target.closest(".stack"); if (st) settle(st, true); });
  kb.addEventListener("focusout", (e) => { const st = e.target.closest(".stack"); if (st && !st.contains(e.relatedTarget) && openStack !== st.dataset.top && pinned !== st.dataset.top) settle(st, false); });
  function fold(top) { const st = kb.querySelector(`.stack[data-top="${CSS.escape(top)}"]`); if (st && pinned !== top) settle(st, false); }
  function paintChain() {
    computeChain();
    for (const c of kb.querySelectorAll(".card")) { c.classList.remove("chain-self", "chain-holds", "chain-waits"); const k = chainFn?.(c.dataset.id); if (k) c.classList.add(`chain-${k}`); }
    for (const col of kb.querySelectorAll(".col")) {
      const n = chainFn ? [...col.querySelectorAll(".card")].filter((c) => ["holds", "waits"].includes(chainFn(c.dataset.id))).length : 0;
      let cc = col.querySelector("h2 .cc");
      if (!n) { cc?.remove(); continue; }
      if (!cc) { cc = document.createElement("span"); cc.className = "cc"; col.querySelector("h2").appendChild(cc); }
      cc.textContent = `⛓${n}`;
    }
  }

  // ---- clicks: open a card's modal, a link badge opens its blocker, fold and hide buckets, review controls
  kb.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-dismiss]")) { refusal = null; render(); return; }
    const o = t.closest("[data-open]"); if (o) { e.stopPropagation(); openModal(o.dataset.open); return; }
    const hm = t.closest("[data-hidem]"); if (hm) { e.stopPropagation(); for (const x of tasks) if (x.milestone === hm.dataset.hidem) hidden.add(x.id); render(); return; }
    const f = t.closest("[data-fold]"); if (f) { const m = f.dataset.fold; folded.has(m) ? folded.delete(m) : folded.add(m); render(); return; }
    if (t.closest("[data-clear]")) { query = ""; render(); return; }
    if (t.closest("[data-showall]")) { hidden.clear(); render(); return; }
    const sc = t.closest("[data-scene]"); if (sc) { params.set("s", sc.dataset.scene); location.search = params; return; }
    const z = t.closest("[data-fs]"); if (z) { fs = +z.dataset.fs; params.set("fs", z.dataset.fs); history.replaceState(null, "", `?${params}`); document.documentElement.style.setProperty("--fs", fs); render(); return; }
    const c = t.closest(".card"); if (c && !justDragged) openModal(c.dataset.id);
  });
  kb.addEventListener("keydown", (e) => {
    e.stopPropagation(); // the Star Map's own keys (Backspace, 0) stay out of the Kanban
    if (e.key === "Enter" && e.target.classList.contains("card")) openModal(e.target.dataset.id);
  });
  kb.addEventListener("input", (e) => { if (e.target.id === "kbq") { query = e.target.value; render(); } });

  function openModal(id) {
    const t = byId.get(id); if (!t) return;
    open = id;
    const deps = t.dependencies.map((d) => byId.get(d)).filter(Boolean);
    const stack = STACKED.has(t.lane) ? stacksOf(tasks.filter((x) => x.lane === t.lane && x.milestone === t.milestone && !hidden.has(x.id)), t.lane).find((s) => s.members.includes(t)) : null;
    const link = (x) => `<a data-open="${esc(x.id)}">${esc(x.id)}</a> <span class="k">${esc(B.names[x.lane] ?? x.lane)}${x.milestone !== t.milestone ? ` · ${esc(x.milestone || "no milestone")}` : ""}</span>`;
    modalHost.innerHTML = `<div id="kbm"><div class="modal" role="dialog" aria-label="${esc(t.id)}"><button class="x" data-close aria-label="Close">✕</button>
      <div class="k">${esc(t.id)} · ${esc(B.names[t.lane] ?? t.lane)}</div><h2>${esc(t.title)}</h2>
      <table><tr><td>Milestone</td><td>${esc(t.milestone || "none")}</td></tr><tr><td>Assignee</td><td>${esc(t.assignee || "unassigned")}</td></tr>
      <tr><td>Labels</td><td>${t.labels.map(esc).join(", ") || "none"}</td></tr>
      <tr><td>Dependencies</td><td>${deps.length ? deps.map(link).join("<br>") : "none"}</td></tr>
      ${stack && stack.members.length > 1 ? `<tr><td>${t.lane === "done" ? "Done chain" : "Waiting stack"}</td><td>${stack.members.map((x, i) => `${i ? "↳ " : "▣ "}${x === t ? `<b>${esc(x.id)}</b>` : `<a data-open="${esc(x.id)}">${esc(x.id)}</a>`}`).join("<br>")}</td></tr>` : ""}</table>
      <div class="note">Mockup: the full task view is unchanged by this design; see the task-modal design task.</div></div></div>`;
  }
  modalHost.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]"); if (o) { openModal(o.dataset.open); return; }
    if (e.target.closest("[data-close]") || e.target.id === "kbm") closeModal();
  });
  function closeModal() { open = null; modalHost.innerHTML = ""; }
  addEventListener("keydown", (e) => { if (e.key === "Escape" && open) { e.stopImmediatePropagation(); closeModal(); } }, true);

  // ---- drag a card to another column, checked against the task's saved move verdicts as the server would
  let drag = null, justDragged = false;
  kb.addEventListener("pointerdown", (e) => {
    const c = e.target.closest(".card");
    if (!c || e.button !== 0 || e.target.closest("button,a")) return;
    drag = { id: c.dataset.id, x: e.clientX, y: e.clientY, el: c, lift: null };
  });
  addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.lift && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    if (!drag.lift) {
      const r = drag.el.getBoundingClientRect();
      drag.lift = drag.el.cloneNode(true); drag.lift.classList.add("kb-lift"); drag.lift.style.width = `${r.width}px`; drag.lift.style.transform = "rotate(1.5deg)";
      drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top; document.body.appendChild(drag.lift); drag.el.classList.add("ghost");
    }
    drag.lift.style.left = `${e.clientX - drag.dx}px`; drag.lift.style.top = `${e.clientY - drag.dy}px`;
    const col = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.classList?.contains("col"));
    kb.querySelectorAll(".col").forEach((x) => x.classList.remove("drop-ok", "drop-no"));
    const t = byId.get(drag.id);
    if (col && col.dataset.lane !== t.lane) col.classList.add(t.moves[col.dataset.lane]?.allowed ? "drop-ok" : "drop-no");
  });
  addEventListener("pointerup", (e) => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.lift) return;
    justDragged = true; setTimeout(() => (justDragged = false), 0);
    d.lift.remove(); d.el.classList.remove("ghost");
    kb.querySelectorAll(".col").forEach((x) => x.classList.remove("drop-ok", "drop-no"));
    const col = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.classList?.contains("col"));
    const t = byId.get(d.id);
    if (!col || col.dataset.lane === t.lane) return;
    const to = col.dataset.lane, v = t.moves[to];
    if (v?.allowed) { refusal = null; t.lane = to; t.entered = NOW; render(); const n = kb.querySelector(`.card[data-id="${CSS.escape(t.id)}"]`); n?.classList.add("flash"); n?.scrollIntoView({ block: "nearest" }); }
    else { refusal = { id: t.id, to, why: v ? `guarded${v.skill ? ` · satisfied by ${v.skill}` : ""}` : `no transition from ${B.names[t.lane]} to ${B.names[to]}` }; render(); kb.querySelector(`.card[data-id="${CSS.escape(t.id)}"]`)?.animate([{ transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "none" }], { duration: 300, iterations: 2 }); }
  });

  // ---- the scene the address names
  render();
  const bucket = (m, lane = "waiting") => kb.querySelector(`.col[data-lane="${lane}"] .bucket[data-m="${CSS.escape(m)}"]`);
  const reveal = (el) => { if (!el) return; const body = el.closest(".body"); body.scrollTop += el.getBoundingClientRect().top - body.getBoundingClientRect().top - 40; };
  if (scene === "unstack") {
    const b = bucket("m-107"), st = b && [...b.querySelectorAll(".stack")].sort((x, y) => y.dataset.n - x.dataset.n)[0];
    if (st) { pinned = st.dataset.top; settle(st, true, false); reveal(b); }
  } else if (scene === "multi") {
    const b = bucket("m-100"); reveal(b);
    const st = b?.querySelector(".stack"); if (st) { pinned = st.dataset.top; settle(st, true, false); }
  } else if (scene === "done") {
    const sts = [...kb.querySelectorAll(".col[data-lane='done'] .stack")].sort((x, y) => y.dataset.n - x.dataset.n), st = sts[0];
    if (st) { reveal(st.closest(".bucket")); pinned = st.dataset.top; settle(st, true, false); }
  } else if (scene === "cross") {
    const x = kb.querySelector(".col[data-lane='waiting'] .xm"); const b = x?.closest(".bucket"); reveal(b);
    const st = x?.closest(".stack"); if (st) { pinned = st.dataset.top; settle(st, true, false); }
    x?.animate([{ boxShadow: "0 0 0 0 rgba(129,140,248,.8)" }, { boxShadow: "0 0 0 8px rgba(129,140,248,0)" }], { duration: 1200, iterations: 3 });
  }
  // a pinned scene stack folds again once the operator hovers and leaves it, like any other
  kb.addEventListener("pointerout", (e) => { const st = e.target.closest(".stack"); if (st && pinned === st.dataset.top && !st.contains(e.relatedTarget)) { pinned = null; settle(st, false); } });
})();
</script>
<script>// Design round (doc-111 D9): what happens between Review and Done. The fold on the Board's Review → Done path opens this level, redrawn
// here as three candidate views of one causal sequence: a PR merges to main, main-follow (on push) writes MERGED and the task moves to
// Done, and the merge cues apply-on-merge and graph-refresh. ?merged=a|b|c picks the view (Junction, Orrery, Ledger), ?ms=live|fail|cross
// the scenario and ?ts=125|150 the browser text size. The contract each draws from is the one doc-111 records: the machine YAML's writers: and
// cues: (each cue with resolves: forced|next) and the [[runs]] instance's commit keys; ?ms=infer is an install that declares none. Merges, runs and timings are simulated from the snapshot's tasks and DAG steps, with
// volume (about ten an hour in working hours) and run durations shaped like a day of live apply-on-merge, graph-refresh and main-follow runs.
"use strict";
{
const P = new URLSearchParams(location.search);
const VARS = { a: "Junction", b: "Orrery", c: "Ledger" };
const SCNS = {
  live: "A normal day: a merge every ~25 s. Three hours ago apply-on-merge failed seven times at apply_deploy; a forced rerun cleared it. A graph-refresh failure cleared on its next success.",
  fail: "apply-on-merge keeps failing at apply_deploy: resolves: forced, so each stays pinned until a forced rerun. The newest graph-refresh failure is resolves: next and clears on its own.",
  cross: "A skills merge: nothing applies here, the 5-minute main-follow pass writes MERGED, and its pin bump merge applies it later.",
  infer: "A new install whose [[runs]] instance declares no commit key: each run pairs with the newest merge before it started, drawn dashed; amber where a second merge landed first. Doctor names the key.",
};
const VAR = VARS[P.get("merged")] ? P.get("merged") : "c", SCN = SCNS[P.get("ms")] ? P.get("ms") : "live";
if (+P.get("ts")) document.documentElement.style.fontSize = `${+P.get("ts")}%`;
const rootFs = () => parseFloat(getComputedStyle(document.documentElement).fontSize) / 16;
let F = rootFs(); // browser text size: canvas type and the room it takes scale with it
const NM = { mf: "main-follow", aom: "apply-on-merge", gr: "graph-refresh" }, KS = ["mf", "aom", "gr"];
const mine = (l = level()) => l?.kind === "fold" && l.path?.[0] === "review" && l.path?.[1] === "done";
const SKIP = "#3b4760", RED = DAG_COLOR.failed, CROSS = "#c4b5fd", AMB = "#fbbf24", KEYED = SCN !== "infer";
// the declared contract: who writes MERGED, what it cues, how a cue's failure resolves, and the runs instance's commit keys
const RES = { mf: "next", aom: "forced", gr: "next" };
const RULE = { forced: "clears only on a forced rerun whose BEFORE..AFTER covers it (resolves: forced)", next: "clears on the next successful run (resolves: next)" };
const CONTRACT = {
  mf: "# board machine YAML\nwriters:\n  MERGED:\n    - actor: dagu/main-follow\n      trigger: bin/board_reconcile_merged.py",
  aom: "# board machine YAML\ncues:\n  - event: MERGED\n    dag: dagu/apply-on-merge\n    on: push to main\n    resolves: forced",
  gr: "# board machine YAML\ncues:\n  - event: MERGED\n    dag: dagu/graph-refresh\n    on: push to main\n    resolves: next",
};
const RUNS_TOML = KEYED ? '# flow-view.toml\n[[runs]]\nname = "dagu"\n[runs.commit]\nafter = "AFTER"\nbefore = "BEFORE"\nforce = "FORCE"'
  : '# flow-view.toml\n[[runs]]\nname = "dagu"\n# no [runs.commit]: runs pair by time';
const SCOL = (st) => (st === "skipped" ? SKIP : st === "waiting" ? CROSS : DAG_COLOR[st] || "#94a3b8");

// ---- simulated merges ----

      const showTop = scroll > 8; topEl.style.display = showTop ? "block" : "none"; if (showTop) { topEl.style.left = `${(L.x0 + L.x1) / 2}px`; topEl.style.top = `${L.laneTop + 8}px`; }
    }

    // ---- into and out of the ledger: the page's go() still moves between levels; this layer takes over the In Progress one
    const cPage = document.getElementById("c"), SKY = [{ kind: "board" }, { kind: "state", id: "in_progress" }];
    const isSky = (p) => p.length === 2 && p[1].kind === "state" && p[1].id === "in_progress";
    function setSky(on) {
      if (on && !sky) pageLegend = legendEl.innerHTML;
      sky = on; document.body.classList.toggle("mv", on); legendEl.innerHTML = on ? skyLegend : pageLegend;
      if (on) { selRow = null; goal = scroll = 0; resize(); } else { setHover(null); pinned = null; topM = IP; }
      const q = new URLSearchParams(location.search); on ? (q.set("level", "in_progress"), topM !== IP ? q.set("open", topM) : q.delete("open")) : (q.delete("level"), q.delete("focus"), q.delete("pick"), q.delete("open")); history.replaceState(null, "", `?${q}`);
    }
    go = function (next, fx, fy, then) {
      const to = isSky(next);
      if (sky && !to) { // out: the page shrinks whatever its canvas shows, so it is handed the ledger as it stands
        const pc = cPage.getContext("2d"); pc.setTransform(1, 0, 0, 1, 0, 0); pc.drawImage(cv, -NAVL * DPR, 0); setSky(false); return page.go(next, fx == null ? fx : fx - NAVL, fy, then); }
      if (!sky && to) {
        const snap = document.createElement("canvas"); snap.width = cPage.width; snap.height = cPage.height; snap.getContext("2d").drawImage(cPage, 0, 0);
        page.go(next, fx, fy, then); page.trans = null; page.mouse = null; document.getElementById("tip").style.opacity = 0; setSky(true); enter = { snap, f: { x: fx == null ? NAVL + (W - NAVL) / 2 : fx + NAVL, y: fy ?? H / 2 }, t0: performance.now() }; return; }
      return page.go(next, fx, fy, then);
    };
    const leave = (sx = NX + CW / 2, sy = H / 2) => go([{ kind: "board" }], sx, sy);
    // drill: a machine takes the top and the machines entered from it become the rows, zooming through the point it was opened
    // from; stepping out zooms back down onto the row it now sits in, which glows a moment
    function drill(m, f, dir = 1) {
      if (!M[m] || m === topM) return; const prev = topM, snap = document.createElement("canvas"); snap.width = cv.width; snap.height = cv.height; snap.getContext("2d").drawImage(cv, 0, 0);
      topM = m; selRow = null; closePanel(); setHover(null); goal = scroll = 0; loaded = PAGE; loadingAt = 0; layout();
      const r = dir < 0 && L.rows.get(rowAt(prev));
      if (r) { reveal(r); selRow = null; scroll = goal; for (const q of L.rows.values()) q.cy = null; place(performance.now()); r.flash = performance.now(); f = { x: L.metaX + L.metaW / 2, y: clamp(r.cy + r.h / 2, L.laneTop, L.stripT) }; }
      syncUrl(); if (f) enter = { snap, f, t0: performance.now(), off: 0, dir };
    }
    const outOne = (sx = NX + CW / 2, sy = H / 2) => drill(up[topM] ?? IP, { x: sx, y: sy }, -1);
    // a machine anywhere below the top: open the machine it is entered from, then bring its row on screen
    function focusMachine(m) { if (!M[m]) return; if (m === IP) { if (topM !== IP) drill(IP, null, -1); selRow = null; goal = 0; syncUrl(); return; }
      if (up[m] !== topM) drill(up[m], null, up[m] === IP || chain(topM).includes(up[m]) ? -1 : 1); reveal(L.rows.get(m)); }
    // step out the way the page does: close the panel, drop the selection, scroll back to the newest, up a machine, then zoom out to the Board
    const back = (sx, sy) => (panel.classList.contains("open") ? closePanel() : selRow ? ((selRow = null), syncUrl()) : goal > 0 ? (goal = 0) : topM !== IP ? outOne(sx, sy) : leave(sx, sy));

    // ---- input: hover names and traces, click pins a task or selects a row, the wheel scrolls the rows
    function hit(sx, sy) {
      if (!L) return null;
      for (const c of L.crumbs || []) if (sx >= c.x0 - 3 && sx <= c.x1 + 3 && sy >= c.y0 && sy <= c.y1) return { kind: "crumb", o: c };
      if (sy >= L.stripT) { if (sx < L.sx0 - 4 || sx > L.sx1 + 4) return null; let best = null;
        for (const t of L.ticks) { const d = Math.abs(t.x - sx); if (d < 4 && (!best || d < best.d)) best = { d, t }; } return best ? { kind: "tick", o: best.t } : null; }
      if (L.thumb && Math.abs(sx - L.thumb.x) < 8 && sy > L.thumb.y0 && sy < L.thumb.y1) return { kind: "thumb" };
      for (const [ag, p] of taskPos) if (Math.hypot(p.x - sx, p.y - sy) < 11) return { kind: "task", o: ag };
      const inReg = (n) => { const [a, b] = reg(n); return sy >= a && sy <= b && (!n.row || shown(n.row)); };
      for (const s of L.stars) if (inReg(s) && Math.hypot(s.x - sx, s.y - sy) < 15) return { kind: "star", o: s };
      for (const n of L.nodes.values()) if (inReg(n) && Math.hypot(n.x - sx, n.y - sy) < Math.max(n.r + 10, 20)) return { kind: "node", o: n };
      for (const l of labels) if (sx >= l.x && sx <= l.x + l.w && Math.abs(sy - l.y) < l.h / 2) return l.star ? { kind: "star", o: l.star } : { kind: "node", o: l.node };
      if (sy > L.laneTop && sx > L.metaX - 12 && sx < L.x1 + 8) { for (const r of L.list) { if (!shown(r)) continue; const [a, b] = regionOf(); if (sy >= Math.max(a, r.cy) && sy < Math.min(b, r.cy + r.h)) return { kind: "row", o: r }; }
        if (L.more && sy >= Math.max(L.laneTop, L.footY) && sy < L.footY + FOOT()) return { kind: "foot" }; }
      return null;
    }
    const tieText = (t) => (t.kind === "declared" ? `opens from <b>${esc(stName(t.pm, t.ps))}</b> <span class="k">declared${t.when ? `, while ${esc(t.when)}` : ""}</span>`
      : `entered from <b>${esc(stName(t.pm, t.ps))}</b> <span class="k">${t.pm !== topM ? `on ${esc(t.pm)} · ` : ""}observed ×${t.count}</span>`);
    function tipHtml(h) {
      if (h.kind === "task") { const ag = h.o, oth = (byTask[ag.task] || []).filter((b) => b !== ag);
        return `<b>${esc(ag.task || ag.title)}</b> <span class="k">${esc(boardTitle[ag.task] || "")}</span><br>${esc(stName(ag.m, ag.state))} <span class="k">on ${esc(ag.m)} · ${hhmm(ag.active)}</span>` +
          (oth.length ? `<br><span class="k">also on</span> ${oth.map((b) => `${esc(b.m)} › ${esc(stName(b.m, b.state))}`).join(", ")}` : "") + `<div class="k">its path is traced in order · click to pin it</div>`; }
      if (h.kind === "node") { const n = h.o, ks = kidsAt(n.m, n.s), sec = TIES.filter((t) => t.pm === n.m && t.ps === n.s && primary[t.child] !== t && t.kind === "observed"), loops = M[n.m].all.filter((t) => t.source === n.s && t.target === n.s).map((t) => t.event);
        return `<b>${esc(n.label)}</b> <span class="k">${esc(n.m)} · ${tasksAt(n.m, n.s).length} tasks${n.final ? " · final" : ""}</span>` +
          [...ks.map((c) => primary[c]), ...sec].map((t) => `<br>${t.kind === "declared" ? "opens" : "enters"} <b>${esc(t.child)}</b> <span class="k">${t.kind === "declared" ? "declared" : `observed ×${t.count}`}</span>`).join("") +
          (loops.length ? `<div class="k">stays here on ${esc(loops.join(", ").toLowerCase())}</div>` : "") + (!n.row && ks.length ? `<div class="k">click to scroll to the first</div>` : ""); }
      if (h.kind === "row") { const m = h.o.m, p = primary[m], o = others(m), d = dagTies(m), st = stuckOf(m);
        return `<b>${esc(m)}</b> <span class="k">${esc(subLine(m))}</span>` + (p ? `<br>${tieText(p)}` : "") + o.map((t) => `<br>${tieText(t)}`).join("") +
          (d.length ? `<br>launched by <b>${d.map((t) => esc(t.dag)).join(", ")}</b>` : "") + (!p && !d.length ? `<br><span class="k">no tie this hour</span>` : "") +
          (st.length ? `<br><span style="color:${OFF}">${st.length} task${st.length === 1 ? "" : "s"} stuck over 2 h</span>` : "") +
          (KIDS[m].length ? `<br>${KIDS[m].length} nested: ${KIDS[m].map(esc).join(", ")}${desc(m).length > KIDS[m].length ? ` <span class="k">+${desc(m).length - KIDS[m].length} deeper</span>` : ""}` : "") +
          `<div class="k">click to open it · Esc steps back out</div>`; }
      if (h.kind === "crumb") return `back up to <b>${esc(h.o.m)}</b>`;
      if (h.kind === "star") { const t = h.o.t; return `<b>${esc(t.dag)}</b> <span class="k">DAG</span><br>launches ${esc(t.child)}${t.child === topM ? "" : ` <span class="k">· ${t.count} session${t.count === 1 ? "" : "s"} with no task</span>`}`; }
      if (h.kind === "tick") { const { a, m } = h.o; return `<b>${esc(a.task || "unattended run")}</b> entered <b>${esc(a.m)}</b> <span class="k">${a.m !== m ? `in ${esc(m)} · ` : ""}${hhmm(start(a))}</span><div class="k">click to scroll to its row</div>`; }
      if (h.kind === "foot") return `<span class="k">loads the next ${PAGE}</span>`;
      return "";
    }
    function setHover(h, sx, sy) { hover = h; cv.classList.toggle("hot", !!h); const html = h ? tipHtml(h) : ""; if (!html) { tip.style.opacity = 0; return; } if (tip.innerHTML !== html) tip.innerHTML = html; tip.style.opacity = 1;
      const r = tip.getBoundingClientRect(); tip.style.left = `${Math.min(sx + 14, W - r.width - 8)}px`; tip.style.top = `${Math.min(sy + 14, H - r.height - 8)}px`; }
    function openTask(ag) { pinned = ag; const all = byTask[ag.task] || [ag], colOf = (m) => node(m, initOf(m))?.col || RAMP[2];
      panel.innerHTML = `<span class="x">✕</span><h2>${esc(ag.task || ag.title)}</h2><div class="k">${esc(boardTitle[ag.task] || ag.title || "")}</div>
        <table>${all.map((b) => `<tr class="mrow"><td><i style="background:${colOf(b.m)}"></i>${esc(b.m)}</td><td>${esc(stName(b.m, b.state))}</td><td style="text-align:right;color:#6b7a93">${hhmm(b.active)}</td></tr>`).join("")}</table>
        <div class="k" style="margin-top:10px">path · ${traceSegs(ag).length} steps, in order</div><table class="trace">${traceSegs(ag).map((s) => `<tr><td>${s.n}</td><td>${s.kind === "entry" ? `<b>${esc(s.b.m)}</b> <span class="k">entered from ${esc(stName(s.a.m, s.a.s))}</span>` : `${esc(stName(s.a.m, s.a.s))} → ${esc(stName(s.b.m, s.b.s))} <span class="k">${esc(s.b.m)}</span>`}</td><td>${hhmm(s.at)}</td></tr>`).join("")}</table>`;
      panel.classList.add("open"); panel.querySelector(".x").onclick = closePanel; }
    function closePanel() { panel.classList.remove("open"); pinned = null; }
    // a row with machines nested in it opens on a click anywhere on it; any other row is selected, keeping its tie drawn
    const select = (r, e) => drill(r.m, { x: e.clientX, y: e.clientY });
    let drag = null;
    cv.addEventListener("mousemove", (e) => { pointer = { x: e.clientX, y: e.clientY }; if (enter) return;
      if (drag) { const k = L.maxScroll / Math.max(1, L.thumb ? L.thumb.y1 - L.thumb.y0 - L.thumb.th : 1); goal = scroll = clamp(drag.g0 + (e.clientY - drag.y) * k, 0, L.maxScroll); return; }
      setHover(hit(e.clientX, e.clientY), e.clientX, e.clientY); });
    cv.addEventListener("mouseleave", () => { pointer = null; setHover(null); });
    cv.addEventListener("mousedown", (e) => { if (e.button === 0 && hover?.kind === "thumb") { drag = { thumb: true, y: e.clientY, g0: goal }; cv.classList.add("drag"); } });
    addEventListener("mouseup", () => { cv.classList.remove("drag"); setTimeout(() => (drag = null)); });
    cv.addEventListener("click", (e) => { if (drag || enter) return; const h = hit(e.clientX, e.clientY);
      if (!h) return closePanel();
      if (h.kind === "task") return openTask(h.o);
      if (h.kind === "row") return select(h.o, e);
      if (h.kind === "crumb") return drill(h.o.m, { x: e.clientX, y: e.clientY }, -1);
      if (h.kind === "node" && h.o.row) return select(h.o.row, e);
      if (h.kind === "node") { const k = kidsAt(topM, h.o.s).map((m) => L.rows.get(m)).sort((a, b) => order.indexOf(a.m) - order.indexOf(b.m)); return k.length && reveal(k[0]); }
      if (h.kind === "star" && h.o.row) return select(h.o.row, e);
      if (h.kind === "tick") return reveal(L.rows.get(h.o.m));
      if (h.kind === "foot") loaded += PAGE; });
    cv.addEventListener("contextmenu", (e) => { e.preventDefault(); if (!enter) back(e.clientX, e.clientY); });
    cv.addEventListener("wheel", (e) => { e.preventDefault(); if (enter) return; goal = clamp(goal + e.deltaY * (e.deltaMode === 1 ? 18 : 1), 0, L.maxScroll); setHover(hit(e.clientX, e.clientY), e.clientX, e.clientY); }, { passive: false });
    topEl.addEventListener("click", () => (goal = 0));
    addEventListener("keydown", (e) => { if (!sky || e.target.tagName === "INPUT") return; let used = true; const pg = (L.stripT - L.laneTop) * 0.9;
      if (e.key === "PageDown") goal += pg; else if (e.key === "PageUp") goal -= pg; else if (e.key === "Home" || e.key === "0") goal = 0; else if (e.key === "End") goal = 1e9;
      else if (e.key === "ArrowDown") goal += 60 * FS; else if (e.key === "ArrowUp") goal -= 60 * FS; else if (e.key === "Escape" || e.key === "Backspace") back(); else used = false;
      if (used) { goal = clamp(goal, 0, L.maxScroll); e.stopPropagation(); e.preventDefault(); } }, true);
    // navigator rows: a machine row scrolls the ledger to that machine's row (zooming in from the Board first); In progress goes back to the newest
    document.getElementById("layers").addEventListener("click", (e) => { const b = e.target.closest(".node"), t = b?.querySelector(".t")?.textContent?.trim(); if (!b || e.target.classList.contains("chev")) return;
      if (sky && b.classList.contains("here")) { e.stopPropagation(); focusMachine(IP); return; }
      if (!(t && M[t])) return;
      e.stopPropagation(); if (!sky) go(SKY); setTimeout(() => focusMachine(t), sky ? 0 : 540); }, true);

    // ---- the address that reproduces the view, and the review-only text size switch
    function syncUrl() { const q = new URLSearchParams(location.search); selRow ? q.set("focus", selRow.m) : q.delete("focus"); topM !== IP ? q.set("open", topM) : q.delete("open"); q.delete("pick"); history.replaceState(null, "", `?${q}`); }
    function setFS(p) { document.documentElement.style.fontSize = p === 100 ? "" : `${p}%`; const q = new URLSearchParams(location.search); p === 100 ? q.delete("fs") : q.set("fs", p); history.replaceState(null, "", `?${q}`); dispatchEvent(new Event("resize")); }
    function renderRev() { const fs = Math.round(FS * 100); revEl.innerHTML = `review · text ` + [100, 125, 150].map((p) => `<button data-fs="${p}" class="${p === fs ? "on" : ""}">${p}%</button>`).join("");
      revEl.querySelectorAll("[data-fs]").forEach((b) => (b.onclick = () => setFS(+b.dataset.fs))); }
    function resize() { DPR = devicePixelRatio || 1; NX = NAVW(); W = innerWidth - RAILW(); H = innerHeight; CW = W - NX; CH = H;
      for (const c of [cv, buf]) { c.width = W * DPR; c.height = H * DPR; } cv.style.width = `${W}px`; cv.style.height = `${H}px`;
      readFS(); wcache.clear(); renderRev(); if (!sky && L) return; const keep = selRow?.m; layout(); if (keep) selRow = L.rows.get(keep); }

    // ---- activity: replay what the snapshot holds, then simulate moves, sub-machine entries and DAG launches
    let simT = S.now, seq = 0;
    const lines = [];
    for (const m of Object.values(M)) for (const a of m.agents) for (const s of a.trail) lines.push({ at: s.at, html: `<b>${esc(a.task || a.id.slice(0, 8))}</b> ${esc(s.event.toLowerCase())} <em>${esc(m.name)}</em>` });
    lines.sort((a, b) => b.at - a.at); lines.length = Math.min(lines.length, 40);
    const renderClock = () => (clockEl.innerHTML = `<i></i>simulated · ${hhmm(simT)} MST`);
    const renderFeed = () => { feed.innerHTML = lines.map((l) => `<div${l.fresh ? ' class="new"' : ""}><em>${hhmm(l.at)}</em> ${l.html}</div>`).join(""); lines.forEach((l) => (l.fresh = false)); };
    const log = (html) => { lines.unshift({ at: simT, html, fresh: true }); lines.length = Math.min(lines.length, 40); renderFeed(); renderClock(); };
    const pick = (xs) => xs[Math.floor(Math.random() * xs.length)];
    function moveTo(ag, to, event, fromKey, star) { const from = fromKey || key(ag.m, ag.state); ag.move = { from, star, t0: performance.now() }; heat.set(`${from}>${key(ag.m, to)}`, performance.now());
      ag.state = to; ag.trail.push({ state: to, event, at: simT }); ag.trail = ag.trail.slice(-12); ag.active = simT; ag.steps = (ag.steps || 0) + 1;
      if (isFinal(ag.m, to) && ag.m !== IP) ag.doneAt = performance.now(); }
    const spare = (t) => M[t.pm].agents.filter((a) => a.state === t.ps && a.task && !a.move && !M[t.child].agents.some((b) => b.task === a.task));
    function simStep() {
      simT += 45; const r = Math.random();
      if (r < 0.22) { // a task's session enters a sub-machine from the state it sits on
        const ts = TIES.filter((t) => t.kind !== "dag" && spare(t).length), t = ts.length && pick(ts);
        if (t) { const p = pick(spare(t)), ag = { id: `sim-${++seq}`, title: p.title, model: p.model, kind: p.kind || "interactive", badges: [], task: p.task, m: t.child, state: initOf(t.child), steps: 0, trail: [], active: simT, sim: true };
          M[t.child].agents.push(ag); indexTasks(); moveTo(ag, initOf(t.child), "ENTERED", key(t.pm, t.ps)); if (t.kind === "observed") t.count++; t.flash = performance.now();
          log(`<b>${esc(p.task)}</b> entered <em>${esc(t.child)}</em> from ${esc(stName(t.pm, t.ps).toLowerCase())}`); return; } }
      if (r < 0.3) { const ss = L.stars.filter((s) => s.child !== IP), s = ss.length && pick(ss);
        if (s) { const ag = { id: `sim-${++seq}`, title: "unattended run", model: "standard", kind: "unattended", badges: [], task: null, m: s.child, state: initOf(s.child), steps: 0, trail: [], active: simT, sim: true };
          M[s.child].agents.push(ag); moveTo(ag, initOf(s.child), "LAUNCHED", null, s); s.t.count++; s.t.flash = performance.now(); log(`<b>${esc(s.dag)}</b> launched <em>${esc(s.child)}</em>`); return; } }
      const pool = Object.values(M).flatMap((m) => m.agents).filter((a) => !a.move && !isFinal(a.m, a.state) && M[a.m].trans.some((t) => t.source === a.state) && simT - a.active < STUCK);
      const weighted = pool.filter((a) => a.m !== IP || Math.random() < 0.35), ag = pick(weighted.length ? weighted : pool); if (!ag) return;
      const t = pick(M[ag.m].trans.filter((x) => x.source === ag.state)); moveTo(ag, t.target, t.event);
      log(`<b>${esc(ag.task || ag.id.slice(0, 8))}</b> ${esc(t.event.toLowerCase())} <em>${esc(ag.m)}</em>`);
    }
    function retire() { const now = performance.now(); for (const m of Object.values(M)) { const gone = m.agents.filter((a) => a.sim && a.doneAt && now - a.doneAt > 9000 && a !== pinned);
      if (gone.length) { if (primary[m.name]) primary[m.name].flash = now; m.agents = m.agents.filter((a) => !gone.includes(a)); indexTasks(); } } }
    // the order holds still while the pointer is over the rows, a row is selected or a trace is pinned, so nothing moves under the hand
    const frozen = () => (pointer && L && pointer.y > L.laneTop && pointer.y < L.stripT) || pinned || selRow || drag;
    let tick = 0; setInterval(() => { if (document.hidden || !sky) return; simStep(); retire(); if (++tick % 3 === 0 && !frozen()) order = rankRows(); }, 1700);

    // ---- start where the address says: the Board by default, the ledger for &level=in_progress, &focus= or &pick=
    const want = P.get("level") === "in_progress" || P.get("focus") || P.get("pick") || P.get("open");
    if (M[P.get("open")] && P.get("open") !== IP) topM = P.get("open");
    if (want && !isSky(page.stack)) { page.go(SKY); page.trans = null; }
    else if (!want && !P.get("level") && page.stack.length !== 1) { page.go([{ kind: "board" }]); page.trans = null; }
    resize(); renderFeed(); renderClock(); addEventListener("resize", resize); document.fonts?.ready.then(() => { wcache.clear(); resize(); });
    setSky(isSky(page.stack));
    const f0 = P.get("focus"); if (sky && f0 && M[f0] && f0 !== IP) focusMachine(f0);
    if (sky && P.get("pick") === "busy") { const t = Object.entries(byTask).filter(([, v]) => !v.every((a) => seeded.has(a.m) || a.m === IP)).sort((a, b) => b[1].length - a[1].length || (a[0] < b[0] ? -1 : 1))[0]; if (t) openTask(t[1].find((a) => a.m !== IP) || t[1][0]); }
    requestAnimationFrame(frame);
  }
})();
