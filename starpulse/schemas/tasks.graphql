type RequiredCheck {
  name: String!
  """`pass`, `failing`, `pending` or `missing`."""
  result: String!
}

type UnresolvedThread {
  id: String!
  """Null for a deleted account."""
  author: String
}

"""A pull request the PR store holds, as of `fetchedAt`."""
type PullRequest {
  repo: String!
  number: Int!
  """`OPEN`, `MERGED` or `CLOSED`."""
  state: String!
  isDraft: Boolean!
  mergeable: String!
  baseRefName: String!
  """Null for a record saved before the branch was kept."""
  headRefName: String
  headRefOid: String!
  body: String!
  """`pass`, `failing`, `pending` or `none`."""
  checks: String!
  requiredChecks: [RequiredCheck!]!
  """Open review threads."""
  threads: Int!
  """Each open thread's id and its first comment's author, among the first 100 threads; null for a record saved before they were kept."""
  unresolvedThreads: [UnresolvedThread!]
  mergedAt: String
  """The merge commit, null until merged."""
  mergeSha: String
  """GitHub's last update of it, an ISO time."""
  updatedAt: String
  """Seconds since the epoch the store last read it."""
  fetchedAt: Float!
  """The paths it changes, null for a record saved before they were kept."""
  files: [String!]
}

"""What a task's holder session is doing now."""
type SessionActivity {
  state: String!
  last_turn_at: String
}

"""One open task as a card draws it."""
type Task {
  id: ID!
  title: String!
  """The lane the task is in: its state, lower-cased, spaces as `_`."""
  lane: String!
  profile: String
  impact: String!
  urgency: String!
  tier: String!
  """Where the task came from: the `source` its creation recorded, empty for none."""
  source: String!
  assignee: String
  labels: [String!]!
  milestone: String!
  type: String!
  dependencies: [String!]!
  workable: Boolean!
  """Seconds since the epoch the task was made."""
  createdAt: Float!
  """Seconds since the epoch the task last moved."""
  movedAt: Float!
  description: String!
  """The pull requests the task cites, as the PR store holds them."""
  prs: [PullRequest!]!
  """The task's lane changes, oldest first; none for a task the history has never seen."""
  lanePath: [LaneStep!]!
  """The task's path on a machine the page draws, an error for any other."""
  machinePath(machine: String!): MachinePath!
  """How many times the task's plan was rewritten after work began."""
  planRevisions: Int!
  """The task's events on every machine since the epoch second `since`, oldest first."""
  events(since: Float!): [MachineEvent!]!
  """The verdict on each column the task may move to, judged by the board's guards now."""
  moves: [Move!]!
  """
  The task's tokens by phase over the last week, none for a task that spent nothing in it; null, with an error, when
  the telemetry cannot be read.
  """
  spend: [SpendPhase!]
  """An In Progress task's phase: the state of the submachine link it is held in, null for a task in no working lane or held by none."""
  phase: String
  """The state the task holds in the skill machine its phase opens, null when no skill holds it."""
  substate: String
  """The skill the task is in, null when none holds it."""
  skill: TaskSkill
  """How many of its dependencies are open: neither in a done lane nor archived; one with no row counts."""
  openDependencies: Int!
  """A person took the session over: the task shows as interactive."""
  interactive: Boolean!
  """What the holder's session is doing, for a held working task; null for any other."""
  sessionActivity: SessionActivity
  """The acceptance criteria, in order."""
  criteria: [Criterion!]!
  """Why the task waits on a person: the first line of its `## Needs attention` section; empty in any other lane."""
  pauseReason: String!
  """What the board's `readable` rules find broken in the description; empty when it reads well or the task is done."""
  readable: String!
  """The claim a TTL sweep or an idle holder's release ended; null when the task's claim was never released."""
  released: ClaimRelease
}

"""One acceptance criterion of a task."""
type Criterion {
  text: String!
  checked: Boolean!
}

"""The skill a held task is in: its machine's states in order, the state it holds and the edge its machine hands to next."""
type TaskSkill {
  """The skill machine's name."""
  name: String!
  """The machine's state ids, in the order it declares them."""
  states: [String!]!
  """The state the task holds, null when it holds none."""
  current: String
  """The edge a finished skill hands to; null when the machine declares none."""
  next: HeldNext
}

"""The claim a Board task's claim-TTL sweep, or its idle holder's release, ended. Field names match the REST `ClaimRelease`."""
type ClaimRelease {
  """When the release was recorded, epoch seconds."""
  at: Float!
  session: String!
  """The session's last renewal before the release, epoch seconds."""
  last_renewal: Float!
  """The claim TTL, in seconds, the session missed."""
  ttl: Float!
  """The task actor ended this claim because its holder sat idle, not the TTL sweep."""
  idle: Boolean!
}

"""One board rule a move breaks: what it needs and the skill that produces it."""
type RuleBreak {
  reason: String!
  skill: String!
}

"""What a guard says to one actor about a move."""
type ActorVerdict {
  actor: String!
  allowed: Boolean!
  reason: String!
  skill: String!
  warnings: [RuleBreak!]!
}

"""The verdict on moving a task to one column: allowed, or guarded by a declared rule."""
type Move {
  """The column's state id."""
  to: String!
  allowed: Boolean!
  reason: String!
  skill: String!
  """The actors the machine declares for the event behind the move; empty when any actor may make it."""
  writers: [String!]!
  """The verdict for an actor a guard treats apart from the rest; any other actor meets the move's own."""
  actors: [ActorVerdict!]!
  warnings: [RuleBreak!]!
}


"""One phase of one task: the tokens its steps burned, and the task's total against its cell's norm. Field names match the REST `SpendPhase`."""
type SpendPhase {
  task: String!
  """`claim`, `implement`, `qa`, `deliver` or `review_fix`."""
  phase: String!
  kind: String
  size: Int
  steps: Int!
  side_steps: Int!
  input: Int!
  output: Int!
  cache_read: Int!
  cache_write: Int!
  """Uncached input + 1.25 x cache write + 0.1 x cache read + 5 x output."""
  wte: Float!
  peak_context: Int!
  compactions: Int!
  models: [String!]!
  profile: String!
  first_at: Float!
  last_at: Float!
  """`wte` summed over the task's phases."""
  task_wte: Float!
  norm_wte: Float
  """`task_wte` is over three times `norm_wte`."""
  above_norm: Boolean!
  phase_norm_wte: Float
  norm_profile: String
  """Why `phase_norm_wte` is null: `batch umbrella`, `no kind or size`, or `under 5 peers in kind × size`; null when there is a norm."""
  no_norm_reason: String
  """`wte` is over three times `phase_norm_wte`."""
  phase_above_norm: Boolean!
}

"""One finished task of the last day, as the stored board body's `settled` map holds it. `state` is `completed` or the other settled state, `at` when it settled and `created` when it was made (null when the read model does not hold it)."""
type SettledTask {
  id: ID!
  state: String!
  at: Float
  created: Float
  title: String!
  model: String!
  milestone: String!
  labels: [String!]!
}

"""One milestone's count of tasks completed in the last day."""
type MilestoneCount {
  milestone: String!
  done: Int!
}

"""One step of a machine task's trail: the state it entered, the event that moved it and when."""
type TrailStep {
  state: String!
  event: String!
  at: Float!
  id: String
}

"""One task of a machine other than the board, as the stored body draws it under `machine`."""
type MachineTask {
  machine: String!
  id: ID!
  title: String!
  model: String!
  "The board task it is tied to, null when none."
  task: String
  state: String!
  steps: Int!
  active: Float!
  trail: [TrailStep!]!
}

"""A page of the open tasks a read found, how many it found, and the stream position it was read at: a `taskChanges` subscription from it carries each change after the read. `settled`, `milestoneDone`, `archivedToday` and `machineTasks` hold the whole board, never narrowed by the arguments."""
type TaskPage {
  position: Int!
  items: [Task!]!
  """Every open task the narrowing arguments keep, whatever page `offset` and `limit` cut from them."""
  total: Int!
  "The finished window: each task settled or created in the last 24 hours."
  settled: [SettledTask!]!
  "Each milestone's completed count: its settled tasks plus the completed ones older than the window."
  milestoneDone: [MilestoneCount!]!
  "The tasks archived since local midnight."
  archivedToday: Int!
  "The tasks of every machine but the board."
  machineTasks: [MachineTask!]!
}

"""One task that changed: `task` is its card now, null when the board no longer holds it. `machine` names the machine it moved on (`board` for a board task); `settled` is its settled entry when it is one, and `machineTask` the machine task a move on another machine left."""
type TaskChange {
  id: ID!
  machine: String!
  task: Task
  settled: SettledTask
  machineTask: MachineTask
}

"""Any JSON value: a ledger row's `runs` and `fails` map workflow names to the page's own shapes, and a run's `steps` and `params` map names to values."""
scalar JSON

"""The pull request a merge came from."""
type OccurrencePull {
  repo: String!
  number: Int!
  url: String!
}

"""One occurrence of a ledger's event: the merge (or event) and what each workflow did with it."""
type Occurrence {
  key: String!
  at: Float!
  tasks: [String!]!
  sha: String
  pr: OccurrencePull
  """The merge is in a repository the parent pins: `appliedBy` is the parent merge whose pin bump applied it, null until one has."""
  child: Boolean!
  appliedBy: String
  applies: [String!]
  runs: JSON!
  fails: JSON!
  pinned: Boolean!
}

"""One bucket of the merge strip: merges that landed, those whose workflows failed, and forced reruns."""
type MergeBucket {
  merges: Int!
  failed: Int!
  reruns: Int!
}

"""The merge ledger's 24-hour strip: `buckets` of `bucket` seconds from epoch second `since`."""
type MergeStrip {
  since: Float!
  bucket: Float!
  buckets: [MergeBucket!]!
}

"""A page of a ledger's occurrences, newest first, whether older ones remain inside the 24-hour window, and how many the window holds."""
type OccurrencePage {
  rows: [Occurrence!]!
  more: Boolean!
  total: Int!
  """The merge ledger's 24-hour strip, counted over every row; null on any other event."""
  mergeStrip: MergeStrip
  """The pinned merge rows of the last day that the newest page leaves out; empty on any other event."""
  mergePins: [Occurrence!]!
}

"""One `occurrenceChanges` event: the newest page when `head` (the first event of a connection), then only the rows that changed."""
type OccurrenceChange {
  head: Boolean!
  rows: [Occurrence!]!
  more: Boolean!
  """The merge ledger's strip, sent whole with each change; null on any other event."""
  mergeStrip: MergeStrip
  """The merge ledger's pins, sent whole with each change; empty on any other event."""
  mergePins: [Occurrence!]!
}

"""A run, a step or a job's status: the engine's own state mapped onto these, kept in `raw` when it differs."""
enum JobStatus {
  not_started
  queued
  running
  succeeded
  failed
  aborted
  skipped
}

"""One step of a job in its latest run."""
type JobStep {
  name: String!
  depends: [String!]!
  status: JobStatus!
  raw: String
  kind: String
  precondition: String
  lock: String
  """The step's outcomes in the runs that are over, newest first, at most five."""
  last: [JobStatus!]!
}

"""A job's runs over the last seven days."""
type JobStats {
  runs: Int!
  hours: Float!
  medianSeconds: Float
  p95Seconds: Float
  failureShare: Float
}

"""What a job declares about a rerun of it: safe (all null), once per `key`, or repeating its effects."""
type JobRerun {
  key: String
  repeats: String
  step: String
}

"""One run of a job that is running or queued now; `steps` maps each step name to its JobStatus in this run."""
type JobActiveRun {
  runId: String!
  url: String!
  status: JobStatus!
  raw: String
  startedAt: String!
  step: String!
  stepStartedAt: String!
  steps: JSON!
  task: String
  pr: Int
  commit: String
  attempt: Int
  failure: String
}

"""One run of a job within the last day; `params` maps the parameters it started with to their values and `steps` each step name to its JobStatus."""
type JobRecentRun {
  runId: String!
  task: String
  url: String!
  status: JobStatus!
  raw: String
  startedAt: String!
  finishedAt: String!
  params: JSON!
  steps: JSON!
  pr: Int
  commit: String
  attempt: Int
  failure: String
}

"""A runs workflow as the jobs page draws it, the `DagBody` of `POST /api/jobs`: the latest run, the runs in flight and the pool it runs on."""
type Job {
  name: String!
  status: JobStatus!
  raw: String
  runId: String!
  startUrl: String!
  startedAt: String!
  finishedAt: String!
  steps: [JobStep!]!
  schedule: [String!]!
  stats: JobStats
  rerun: JobRerun
  active: [JobActiveRun!]
  failed: [JobRecentRun!]
  closed: [JobRecentRun!]
  pool: String
}

"""The jobs after one change: every job now, each as `POST /api/jobs` lists it, and the error a runs instance reported."""
type JobChange {
  jobs: [Job!]!
  error: String
  domains: [JobDomain!]!
  cues: [JobCue!]!
  pools: [JobPool!]!
}

"""A domain's DAGs, as `POST /api/jobs` lists it; `processes` package them when configured."""
type JobDomain {
  name: String!
  dags: [JobDagName!]!
  processes: [JobProcess!]!
}

"""A named package of a domain's DAGs."""
type JobProcess {
  name: String!
  dags: [JobDagName!]!
}

type JobDagName {
  name: String!
}

"""A DAG that runs on the same trigger as a Board event's writer but writes no lane itself."""
type JobCue {
  dag: String!
  event: String!
  state: String!
  on: String!
  """How a failed run clears: forced or next."""
  resolves: String
  """Seconds after the event a run may take to start before the Ledger draws the merge overdue."""
  grace: Int
}

"""One concurrency pool, named `<instance>/<pool>`: its cap and the runs holding or awaiting it."""
type JobPool {
  name: String!
  cap: Int!
  running: Int!
  queued: Int!
}

"""
The scheduler's status after one change, as `GET /api/admin` serves it: whether it admits tasks and the capacity strip's readings.
A field a server without a dispatch loop does not serve is null.
"""
type SchedulerChange {
  enabled: Boolean!
  harness: String!
  quietHours: SchedulerQuietHours
  sessionCap: SchedulerSessionCap
  capacityLimits: SchedulerCapacityLimits
  """Seconds since the epoch of the last sample, null before the first."""
  sampledAt: Float
  dimensions: [SchedulerDimension!]!
  inFlight: [SchedulerSession!]
  next: SchedulerNext
  pauses: [SchedulerPause!]
  sessionsByHarness: [SchedulerHarnessSessions!]
  blockedBy: [SchedulerBlock!]
  gateHistory: [SchedulerGateRow!]
  needsOperator: [SchedulerOperatorTask!]
}

"""One capacity dimension's use against its limit: `cpu`, `memory`, `sessions` or `review`."""
type SchedulerDimension {
  name: String!
  use: Float!
  limit: Float!
}

"""One gate holding admission back; `count` is the refusals since a start last landed, for `start-limit`."""
type SchedulerBlock {
  name: String!
  use: Float!
  limit: Float!
  count: Int
}

"""One kept row of the gate history."""
type SchedulerGateRow {
  at: Float!
  dimensions: [SchedulerDimension!]!
  blockedBy: [SchedulerBlock!]!
}

"""A session the scheduler started whose task is still running."""
type SchedulerSession {
  task: String!
  title: String!
  model: String!
  started: Float!
  url: String!
}

"""The task the loop would admit next, and whether it fits now or what it waits on."""
type SchedulerNext {
  task: String!
  title: String!
  verdict: String!
  reason: String!
  priority: String!
}

"""A harness whose admission is paused until `until`."""
type SchedulerPause {
  harness: String!
  until: Float!
  reason: String!
}

"""A daily window, `HH:MM` in `timezone`, in which the scheduler admits nothing."""
type SchedulerQuietHours {
  start: String!
  end: String!
  timezone: String!
}

"""One harness's sessions in flight against its own session cap."""
type SchedulerHarnessSessions {
  harness: String!
  use: Float!
  limit: Float!
}

"""The session cap the selected harness runs under: `source` is `admin` or `starpulse.toml`."""
type SchedulerSessionCap {
  harness: String!
  limit: Float!
  source: String!
  configLimit: Float!
}

"""The cpu or memory limit in percent: `source` is `admin` or `starpulse.toml`."""
type SchedulerCapacityLimit {
  limit: Float!
  source: String!
  configLimit: Float!
}

type SchedulerCapacityLimits {
  cpu: SchedulerCapacityLimit!
  memory: SchedulerCapacityLimit!
}

"""A `kind-decide` task in the eligible lane, which waits on the operator."""
type SchedulerOperatorTask {
  task: String!
  title: String!
}

"""One lane change of a task."""
type LaneStep {
  """Seconds since the epoch."""
  at: Float!
  """The lane it left, null for the task's first."""
  from: String
  to: String!
  """The actor that made the change, null on a change recorded before actors were kept."""
  by: String
}

"""One event of a task on a lifecycle machine, with the state it left the task in."""
type MachineStep {
  at: Float!
  event: String!
  state: String!
}

"""A task's path on one machine, and how many steps it has taken."""
type MachinePath {
  path: [MachineStep!]!
  steps: Int!
}

"""One machine event of a task, with the states it moved the task between."""
type MachineEvent {
  at: Float!
  machine: String!
  event: String!
  from: String!
  to: String!
}

"""One state of a machine."""
type MachineState {
  id: String!
  name: String!
  initial: Boolean!
  final: Boolean!
  """The type the machine declares the state: `initial`, `final`, `resting`, `waiting_on_fact` or `waiting_on_person`; null when it declares none."""
  role: String
  """Which state wins when a task's dependencies would put it in more than one: the higher number wins, a tie keeps the task where it is."""
  priority: Int!
}

"""The sentence of a skill that sends a session down a transition."""
type Cite {
  skill: String!
  quote: String!
}

"""One move a machine allows."""
type Transition {
  source: String!
  target: String!
  event: String!
  """The skill sentence that authorizes the transition; null when its YAML cites none."""
  cite: Cite
}

"""Where a Board state opens into another machine."""
type Submachine {
  state: String!
  machine: String!
  """Each inner final state to the Board event it fires."""
  exits: JSON!
  """The machine the link opens under: `board`, or the machine whose `state` it hangs off."""
  parent: String!
  """What has to hold for the inner machine to run under `state`; empty when always."""
  when: String!
  """Inner event to the Board event it fires; empty when the link routes none."""
  routes: JSON!
  """The skill a session runs while the inner machine does; empty when the link names none."""
  skill: String!
}

"""The edge a finished skill hands to."""
type HeldNext {
  """`skill` or `operation`."""
  kind: String!
  """The skill or operation the edge hands to."""
  name: String!
}

"""A machine the page draws: its states, transitions and the machines that open under it. `name` is the machine's key; the rest match the REST `Machine`."""
type Machine {
  name: String!
  """The third party whose events move this machine; null for a machine StarPulse's own actors move."""
  source: String
  states: [MachineState!]!
  transitions: [Transition!]!
  submachines: [Submachine!]
  """Only the board machine: the skill machine each launching DAG starts, by DAG name."""
  launches: JSON
  """Its YAML-declared writers per event."""
  writers: JSON
  next: HeldNext
  """Only the board machine: the writers that are runs workflows."""
  dagActors: [String!]
  """Only the board machine: the state ids along its axis, in order."""
  mainLine: [String!]
  """Only the board machine: the state ids the Star Map draws at each stage, left to right."""
  tiers: [[String!]!]
}

"""Which of the board's states play which part, as its machine declares them: read these, never a state's name."""
type StateRoles {
  """Where a task starts."""
  initial: String
  """Where a task is settled for good."""
  final: String
  """Where the work is done."""
  done: String
  """Where a session works a task."""
  working: String
  """Where a task waits to be picked up."""
  ready: String
  """Where a task waits on its Start Criteria or dependencies."""
  waiting: String
  """Where a task waits on its pull request."""
  review: String
  """Where a merged task rests while its post-merge QA runs."""
  verifying: String
  """Where a task waits on a person."""
  attention: String
  """The states a session starts a task from."""
  startable: [String!]!
  """The open lanes the kanban draws, in the machine's order: every state but the initial and final."""
  lanes: [String!]!
}

"""What the board, task show and snapshot views draw beside the tasks: the board's columns and roles, every machine and every job."""
type Board {
  """The board machine's states, in the order its columns are drawn."""
  columns: [MachineState!]!
  roles: StateRoles!
  """Every machine the page draws, the board's first."""
  machines: [Machine!]!
  """Every runs workflow, as `POST /api/jobs` lists it."""
  dags: [Job!]!
  """The error a runs instance reported, null when none."""
  error: String
}

type Query {
  """
  A page of the open tasks: `limit` of them (every one when null) after the first `offset`. `filter` keeps those whose
  id, title or a label holds it (case aside); `source`, `lane` and `milestone` keep those equal to it.
  """
  tasks(filter: String, source: String, lane: String, milestone: String, offset: Int! = 0, limit: Int): TaskPage!
  """One open or settled Done task, or null when the board holds neither by that id (another archived task included)."""
  task(id: ID!): Task
  """
  A page of an event's ledger, newest first: `limit` occurrences (1 to 100) after the first `offset`, or null when no
  workflow is tied to `event`.
  """
  occurrences(event: String!, offset: Int! = 0, limit: Int! = 50): OccurrencePage
  """One pull request the PR store holds, whatever task cites it, or null when it holds none."""
  pull(repo: String!, number: Int!): PullRequest
  """
  The ids among `ids` a dependency no longer waits on, in their order: each task archived or Done of any age, in one
  read. An id the board does not hold still waits.
  """
  finished(ids: [ID!]!): [ID!]!
  """The board's columns, state roles, machines and jobs: what the CLI's board, task show and snapshot verbs read beside the tasks."""
  board: Board!
}

type Subscription {
  """
  Each task change after stream position `from`, one `next` event each. A `from` the server no longer holds is answered
  with HTTP 410 and the error code `REREAD`: read the list again.
  """
  taskChanges(from: Int!): TaskChange!
  """
  An event's newest page as the first event (`head`), then one event for each change to its rows. A 404 when no workflow is
  tied to `event`.
  """
  occurrenceChanges(event: String!): OccurrenceChange!
  """
  Each jobs change after stream position `from`, one `next` event each: the position `POST /api/jobs` answered. A `from`
  the server no longer holds is answered with HTTP 410 and the error code `REREAD`: read the list again.
  """
  jobChanges(from: Int!): JobChange!
  """
  Each scheduler status after stream position `from`, one `next` event each: the position `GET /api/admin` answered. A `from`
  the server no longer holds is answered with HTTP 410 and the error code `REREAD`: read the status again.
  """
  schedulerChanges(from: Int!): SchedulerChange!
  """
  The server's health, sent when the subscription connects and again each time its components, build or restarting change.
  """
  health: Health!
}

"""What a page reads of the server: whether it can serve the board, which build it runs, whether it announced a restart."""
type Health {
  """Each readiness component, as `GET /api/health` reports it."""
  components: [HealthComponent!]!
  """The build id the server runs, or null when it names none."""
  build: String
  """True once the server announced it is restarting: the stream ends soon after."""
  restarting: Boolean!
  """The server's clock, in epoch seconds, when this event was made."""
  at: Float!
}

type HealthComponent {
  name: String!
  ready: Boolean!
  detail: String!
}
