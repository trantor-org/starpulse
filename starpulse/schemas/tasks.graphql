type RequiredCheck {
  name: String!
  """`pass`, `failing`, `pending` or `missing`."""
  result: String!
}

type UnresolvedThread {
  id: String!
  """Null for a deleted account."""
  author: String
}

"""A pull request the PR store holds, as of `fetchedAt`."""
type PullRequest {
  repo: String!
  number: Int!
  """`OPEN`, `MERGED` or `CLOSED`."""
  state: String!
  isDraft: Boolean!
  mergeable: String!
  baseRefName: String!
  """Null for a record saved before the branch was kept."""
  headRefName: String
  headRefOid: String!
  body: String!
  """`pass`, `failing`, `pending` or `none`."""
  checks: String!
  requiredChecks: [RequiredCheck!]!
  """Open review threads."""
  threads: Int!
  """Each open thread's id and its first comment's author, among the first 100 threads; null for a record saved before they were kept."""
  unresolvedThreads: [UnresolvedThread!]
  mergedAt: String
  """The merge commit, null until merged."""
  mergeSha: String
  """GitHub's last update of it, an ISO time."""
  updatedAt: String
  """Seconds since the epoch the store last read it."""
  fetchedAt: Float!
  """The paths it changes, null for a record saved before they were kept."""
  files: [String!]
}

"""One open task as a card draws it."""
type Task {
  id: ID!
  title: String!
  """The lane the task is in: its state, lower-cased, spaces as `_`."""
  lane: String!
  profile: String
  impact: String!
  urgency: String!
  tier: String!
  """Where the task came from: the `source` its creation recorded, empty for none."""
  source: String!
  assignee: String
  labels: [String!]!
  milestone: String!
  type: String!
  dependencies: [String!]!
  workable: Boolean!
  """Seconds since the epoch the task was made."""
  createdAt: Float!
  """Seconds since the epoch the task last moved."""
  movedAt: Float!
  description: String!
  """The pull requests the task cites, as the PR store holds them."""
  prs: [PullRequest!]!
  """The task's lane changes, oldest first; none for a task the history has never seen."""
  lanePath: [LaneStep!]!
  """The task's path on a machine the page draws, an error for any other."""
  machinePath(machine: String!): MachinePath!
  """How many times the task's plan was rewritten after work began."""
  planRevisions: Int!
  """The task's events on every machine since the epoch second `since`, oldest first."""
  events(since: Float!): [MachineEvent!]!
  """The verdict on each column the task may move to, judged by the board's guards now."""
  moves: [Move!]!
  """
  The task's tokens by phase over the last week, none for a task that spent nothing in it; null, with an error, when
  the telemetry cannot be read.
  """
  spend: [SpendPhase!]
}

"""One board rule a move breaks: what it needs and the skill that produces it."""
type RuleBreak {
  reason: String!
  skill: String!
}

"""What a guard says to one actor about a move."""
type ActorVerdict {
  actor: String!
  allowed: Boolean!
  reason: String!
  skill: String!
  warnings: [RuleBreak!]!
}

"""The verdict on moving a task to one column: allowed, or guarded by a declared rule."""
type Move {
  """The column's state id."""
  to: String!
  allowed: Boolean!
  reason: String!
  skill: String!
  """The actors the machine declares for the event behind the move; empty when any actor may make it."""
  writers: [String!]!
  """The verdict for an actor a guard treats apart from the rest; any other actor meets the move's own."""
  actors: [ActorVerdict!]!
  warnings: [RuleBreak!]!
}


"""One phase of one task: the tokens its steps burned, and the task's total against its cell's norm. Field names match the REST `SpendPhase`."""
type SpendPhase {
  task: String!
  """`claim`, `implement`, `qa`, `deliver` or `review_fix`."""
  phase: String!
  kind: String
  size: Int
  steps: Int!
  side_steps: Int!
  input: Int!
  output: Int!
  cache_read: Int!
  cache_write: Int!
  """Uncached input + 1.25 x cache write + 0.1 x cache read + 5 x output."""
  wte: Float!
  peak_context: Int!
  compactions: Int!
  models: [String!]!
  profile: String!
  first_at: Float!
  last_at: Float!
  """`wte` summed over the task's phases."""
  task_wte: Float!
  norm_wte: Float
  """`task_wte` is over three times `norm_wte`."""
  above_norm: Boolean!
  phase_norm_wte: Float
  norm_profile: String
  """`wte` is over three times `phase_norm_wte`."""
  phase_above_norm: Boolean!
}

"""One finished task of the last day, as the stored board body's `settled` map holds it. `state` is `completed` or the other settled state, `at` when it settled and `created` when it was made (null when the read model does not hold it)."""
type SettledTask {
  id: ID!
  state: String!
  at: Float
  created: Float
  title: String!
  model: String!
  milestone: String!
  labels: [String!]!
}

"""One milestone's count of tasks completed in the last day."""
type MilestoneCount {
  milestone: String!
  done: Int!
}

"""One step of a machine task's trail: the state it entered, the event that moved it and when."""
type TrailStep {
  state: String!
  event: String!
  at: Float!
  id: String
}

"""One task of a machine other than the board, as the stored body draws it under `machine`."""
type MachineTask {
  machine: String!
  id: ID!
  title: String!
  model: String!
  "The board task it is tied to, null when none."
  task: String
  state: String!
  steps: Int!
  active: Float!
  trail: [TrailStep!]!
}

"""The open tasks a read found, and the stream position it was read at: a `taskChanges` subscription from it carries each change after the read. `settled`, `milestoneDone`, `archivedToday` and `machineTasks` hold the whole board, never narrowed by the arguments."""
type TaskList {
  position: Int!
  items: [Task!]!
  "The finished window: each task settled or created in the last 24 hours."
  settled: [SettledTask!]!
  "Each milestone's completed count: its settled tasks plus the completed ones older than the window."
  milestoneDone: [MilestoneCount!]!
  "The tasks archived since local midnight."
  archivedToday: Int!
  "The tasks of every machine but the board."
  machineTasks: [MachineTask!]!
}

"""One task that changed: `task` is its card now, null when the board no longer holds it. `machine` names the machine it moved on (`board` for a board task); `settled` is its settled entry when it is one, and `machineTask` the machine task a move on another machine left."""
type TaskChange {
  id: ID!
  machine: String!
  task: Task
  settled: SettledTask
  machineTask: MachineTask
}

"""Any JSON value: a ledger row's `runs` and `fails` map workflow names to the page's own shapes."""
scalar JSON

"""The pull request a merge came from."""
type OccurrencePull {
  repo: String!
  number: Int!
  url: String!
}

"""One occurrence of a ledger's event: the merge (or event) and what each workflow did with it."""
type Occurrence {
  key: String!
  at: Float!
  tasks: [String!]!
  sha: String
  pr: OccurrencePull
  """The merge is in a repository the parent pins: `appliedBy` is the parent merge whose pin bump applied it, null until one has."""
  child: Boolean!
  appliedBy: String
  applies: [String!]
  runs: JSON!
  fails: JSON!
  pinned: Boolean!
}

"""A page of a ledger's occurrences, newest first, and whether older ones remain inside the 24-hour window."""
type OccurrencePage {
  rows: [Occurrence!]!
  more: Boolean!
}

"""One `occurrenceChanges` event: the newest page when `head` (the first event of a connection), then only the rows that changed."""
type OccurrenceChange {
  head: Boolean!
  rows: [Occurrence!]!
  more: Boolean!
}

"""Any JSON value: a job is the `DagBody` of the OpenAPI document."""
scalar Json

"""The jobs after one change: every job now, each as `POST /api/jobs` lists it, and the error a runs instance reported."""
type JobChange {
  jobs: Json!
  error: String
}

"""One lane change of a task."""
type LaneStep {
  """Seconds since the epoch."""
  at: Float!
  """The lane it left, null for the task's first."""
  from: String
  to: String!
  """The actor that made the change, null on a change recorded before actors were kept."""
  by: String
}

"""One event of a task on a lifecycle machine, with the state it left the task in."""
type MachineStep {
  at: Float!
  event: String!
  state: String!
}

"""A task's path on one machine, and how many steps it has taken."""
type MachinePath {
  path: [MachineStep!]!
  steps: Int!
}

"""One machine event of a task, with the states it moved the task between."""
type MachineEvent {
  at: Float!
  machine: String!
  event: String!
  from: String!
  to: String!
}

type Query {
  """
  The open tasks. `filter` keeps those whose id, title or a label holds it (case aside); `source`, `lane` and
  `milestone` keep those equal to it.
  """
  tasks(filter: String, source: String, lane: String, milestone: String): TaskList!
  """One open task, or null when the board holds none by that id."""
  task(id: ID!): Task
  """
  An event's ledger, `limit` occurrences (1 to 100, default 20) older than `before` (null: the newest), or null when no
  workflow is tied to `event`.
  """
  occurrences(event: String!, before: Float, limit: Int = 20): OccurrencePage
  """One pull request the PR store holds, whatever task cites it, or null when it holds none."""
  pull(repo: String!, number: Int!): PullRequest
}

type Subscription {
  """
  Each task change after stream position `from`, one `next` event each. A `from` the server no longer holds is answered
  with HTTP 410 and the error code `REREAD`: read the list again.
  """
  taskChanges(from: Int!): TaskChange!
  """
  An event's newest page as the first event (`head`), then one event for each change to its rows. A 404 when no workflow is
  tied to `event`.
  """
  occurrenceChanges(event: String!): OccurrenceChange!
  """
  Each jobs change after stream position `from`, one `next` event each: the position `POST /api/jobs` answered. A `from`
  the server no longer holds is answered with HTTP 410 and the error code `REREAD`: read the list again.
  """
  jobChanges(from: Int!): JobChange!
}
