"""One open task as a card draws it."""
type Task {
  id: ID!
  title: String!
  """The lane the task is in: its state, lower-cased, spaces as `_`."""
  lane: String!
  profile: String
  impact: String!
  urgency: String!
  tier: String!
  """Where the task came from: the `source` its creation recorded, empty for none."""
  source: String!
  assignee: String
  labels: [String!]!
  milestone: String!
  type: String!
  dependencies: [String!]!
  workable: Boolean!
  """Seconds since the epoch the task last moved."""
  movedAt: Float!
  description: String!
  """The verdict on each column the task may move to, judged by the board's guards now."""
  moves: [Move!]!
  """
  The task's tokens by phase over the last week, none for a task that spent nothing in it; null, with an error, when
  the telemetry cannot be read.
  """
  spend: [SpendPhase!]
}

"""One board rule a move breaks: what it needs and the skill that produces it."""
type RuleBreak {
  reason: String!
  skill: String!
}

"""What a guard says to one actor about a move."""
type ActorVerdict {
  actor: String!
  allowed: Boolean!
  reason: String!
  skill: String!
  warnings: [RuleBreak!]!
}

"""The verdict on moving a task to one column: allowed, or guarded by a declared rule."""
type Move {
  """The column's state id."""
  to: String!
  allowed: Boolean!
  reason: String!
  skill: String!
  """The actors the machine declares for the event behind the move; empty when any actor may make it."""
  writers: [String!]!
  """The verdict for an actor a guard treats apart from the rest; any other actor meets the move's own."""
  actors: [ActorVerdict!]!
  warnings: [RuleBreak!]!
}


"""One phase of one task: the tokens its steps burned, and the task's total against its cell's norm. Field names match the REST `SpendPhase`."""
type SpendPhase {
  task: String!
  """`claim`, `implement`, `qa`, `deliver` or `review_fix`."""
  phase: String!
  kind: String
  size: Int
  steps: Int!
  side_steps: Int!
  input: Int!
  output: Int!
  cache_read: Int!
  cache_write: Int!
  """Uncached input + 1.25 x cache write + 0.1 x cache read + 5 x output."""
  wte: Float!
  peak_context: Int!
  compactions: Int!
  models: [String!]!
  profile: String!
  first_at: Float!
  last_at: Float!
  """`wte` summed over the task's phases."""
  task_wte: Float!
  norm_wte: Float
  """`task_wte` is over three times `norm_wte`."""
  above_norm: Boolean!
  phase_norm_wte: Float
  norm_profile: String
  """`wte` is over three times `phase_norm_wte`."""
  phase_above_norm: Boolean!
}

"""The open tasks a read found, and the stream position it was read at: a `taskChanges` subscription from it carries each change after the read."""
type TaskList {
  position: Int!
  items: [Task!]!
}

"""One task that changed: `task` is its card now, null when the board no longer holds it."""
type TaskChange {
  id: ID!
  task: Task
}

"""Any JSON value: a ledger row's `runs` and `fails` map workflow names to the page's own shapes."""
scalar JSON

"""The pull request a merge came from."""
type OccurrencePull {
  repo: String!
  number: Int!
  url: String!
}

"""One occurrence of a ledger's event: the merge (or event) and what each workflow did with it."""
type Occurrence {
  key: String!
  at: Float!
  tasks: [String!]!
  sha: String
  pr: OccurrencePull
  """The merge is in a repository the parent pins: `appliedBy` is the parent merge whose pin bump applied it, null until one has."""
  child: Boolean!
  appliedBy: String
  applies: [String!]
  runs: JSON!
  fails: JSON!
  pinned: Boolean!
}

"""A page of a ledger's occurrences, newest first, and whether older ones remain inside the 24-hour window."""
type OccurrencePage {
  rows: [Occurrence!]!
  more: Boolean!
}

"""One `occurrenceChanges` event: the newest page when `head` (the first event of a connection), then only the rows that changed."""
type OccurrenceChange {
  head: Boolean!
  rows: [Occurrence!]!
  more: Boolean!
}

type Query {
  """
  The open tasks. `filter` keeps those whose id, title or a label holds it (case aside); `source`, `lane` and
  `milestone` keep those equal to it.
  """
  tasks(filter: String, source: String, lane: String, milestone: String): TaskList!
  """One open task, or null when the board holds none by that id."""
  task(id: ID!): Task
  """
  An event's ledger, `limit` occurrences (1 to 100, default 20) older than `before` (null: the newest), or null when no
  workflow is tied to `event`.
  """
  occurrences(event: String!, before: Float, limit: Int = 20): OccurrencePage
}

type Subscription {
  """
  Each task change after stream position `from`, one `next` event each. A `from` the server no longer holds is answered
  with HTTP 410 and the error code `REREAD`: read the list again.
  """
  taskChanges(from: Int!): TaskChange!
  """
  An event's newest page as the first event (`head`), then one event for each change to its rows. A 404 when no workflow is
  tied to `event`.
  """
  occurrenceChanges(event: String!): OccurrenceChange!
}
