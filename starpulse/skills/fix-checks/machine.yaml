# The fix-checks phase: a task PR's failing checks read, placed and fixed through delivery, then the task moved to
# review, or parked on the owner of a fault that is not the branch's. Each transition cites the sentence of this
# skill that authorizes it, and `writers` names who fires each event.
name: FixChecks
states:
  start: {initial: true}
  review_recorded: {final: true}
  redeliver: {final: true}
  parked: {final: true}
events:
  GREEN:
    - {from: start, to: start, cite: {skill: fix-checks, quote: "A failure that changes behavior gets a failing test first, then the fix"}}
  LINT_GREEN:
    - {from: start, to: redeliver, cite: {skill: fix-checks, quote: "the change goes back to delivery, which"}}
  PARKED:
    - {from: start, to: parked, cite: {skill: fix-checks, quote: "Done when the task waits on the owner, or a redelivery turned the check green."}}
  REVIEW_RECORDED:
    - {from: start, to: review_recorded, cite: {skill: fix-checks, quote: "Done when `starpulse task show PROJ-45` shows the task in review with the PR linked."}}
writers:
  GREEN:
    - {actor: agent, trigger: "starpulse command run test"}
  LINT_GREEN:
    - {actor: agent, trigger: "starpulse command run check"}
  PARKED:
    - {actor: agent, trigger: "starpulse task park"}
  REVIEW_RECORDED:
    - {actor: agent, trigger: "starpulse task review"}
