name: github-pull-request
states:
  start: {initial: true}
  open: {}
  checks_failed: {}
  checks_passed: {}
  merged: {final: true}
  closed: {role: resting}  # a reopen leaves it, so it is no final state
events:
  PR_OPENED:
    - {from: start, to: open}
  CHECKS_PASSED:
    - {from: [open, checks_failed, checks_passed], to: checks_passed}
  CHECKS_FAILED:
    - {from: [open, checks_failed, checks_passed], to: checks_failed}
  PR_MERGED:
    - {from: [open, checks_failed, checks_passed], to: merged}
  PR_CLOSED:
    - {from: [open, checks_failed, checks_passed], to: closed}
  PR_REOPENED:
    - {from: closed, to: open}
  CONFLICTED:
    - {from: open, to: open}
    - {from: checks_failed, to: checks_failed}
    - {from: checks_passed, to: checks_passed}
  MERGEABLE:
    - {from: open, to: open}
    - {from: checks_failed, to: checks_failed}
    - {from: checks_passed, to: checks_passed}
  THREADS_CHANGED:
    - {from: open, to: open}
    - {from: checks_failed, to: checks_failed}
    - {from: checks_passed, to: checks_passed}
writers:
  PR_OPENED: [{actor: github, trigger: "the events consumer, from a saved GitHub pull_request opened delivery"}]
  PR_MERGED: [{actor: github, trigger: "the events consumer, from a saved GitHub pull_request closed as merged delivery"}]
  PR_CLOSED: [{actor: github, trigger: "the events consumer, from a saved GitHub pull_request closed delivery"}]
  PR_REOPENED: [{actor: github, trigger: "the events consumer, from a saved GitHub pull_request reopened delivery"}]
  CHECKS_PASSED: [{actor: github, trigger: "the events consumer, from a saved GitHub check_suite success delivery"}]
  CHECKS_FAILED: [{actor: github, trigger: "the events consumer, from a saved GitHub check_suite or check_run failure delivery"}]
  CONFLICTED: [{actor: ci, trigger: "the pre-push hook on a task branch and main-follow, from a local git merge-tree"}]
  MERGEABLE: [{actor: ci, trigger: "the pre-push hook on a task branch and main-follow, from a local git merge-tree"}]
  THREADS_CHANGED:
    - {actor: reviewer, trigger: ".github/workflows/review-threads.yml"}
