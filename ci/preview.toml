# The demo config the UI preview renders StarPulse against (ci/ui_preview.py). It names no real board or runs
# system: the board is the synthetic workspace in `ci/demo_workspace.py` (its machines in `ci/workspace`), the one runs
# instance points at a closed port, and the domains give the DAG layer a working team's job layout to draw.
# `starpulse._internal.cli.demo` then seeds every task, session and run.
mode = "ic"

[board]
type = "ci.demo_workspace"

# The shipped ci machine under the Board states that hold a pull request; the demo seeds each task's trail (`starpulse._internal.cli.demo`).
[ci]
states = ["in_progress", "review"]

[[runs]]
name = "dagu"
type = "dagu"
url = "http://127.0.0.1:9"

# Nested process packages (doc-230 Approach A). Flat domain lists remain valid elsewhere.
[runs.domains."Delivery & CI"]
"Merge apply" = ["merge-apply", "release-cut"]
"CI gates" = ["full-repo-gate", "flaky-test-sweep", "coverage-report", "preview-deploy"]
"PR hygiene" = ["deliver"]
"Metrics & drift" = ["ruleset-drift", "ci-queue-metrics", "mutation-sweep"]

[runs.domains.Board]
Reconcile = ["backlog-sweep", "board-scheduler", "dependency-promotion", "duplicate-detect"]
Hygiene = ["board-lint", "drift-to-task", "stale-branch-reap", "main-follow"]

[runs.domains."Agent jobs & evals"]
Triage = ["alert-triage", "dependency-update-review", "ci-fix"]
Evals = ["eval-suite", "skill-conformance", "prompt-optimize"]
Audits = ["nightly-audit", "session-stats", "weekly-code-audit"]

[runs.domains."Retrieval & search"]
Index = ["index-refresh", "docs-reindex", "embedding-backfill"]
Quality = ["search-metrics", "tag-optimizer", "link-check", "rag-audit"]

[runs.domains."Host ops & backups"]
Health = ["healthcheck", "disk-report", "metrics-snapshot"]
Backup = ["db-backup", "db-restore-verify"]
Housekeeping = ["image-prune", "log-rotate", "cert-renew"]

# The level the gate's seeded server parses (ci/seeded_server.py). An IC instance parses it and draws no level, so the
# UI preview is unchanged.
[level]
machine = "board"
goal = "done"
gates = ["review"]
terminals = [
  { id = "done", role = "goal" },
  { id = "archived", role = "abandoned" },
]

[level.orbit]
suns = "working"
working = ["ready", "in_progress", "review"]
