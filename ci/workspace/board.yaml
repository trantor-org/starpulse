# The UI preview's Board: the nine lanes a team's tracker walks a task through, with the workflows that move it.
name: Board
states:
  new: {initial: true}
  # Off the lanes: an agent's suggestion waits here until the operator promotes or drops it (the Proposals view).
  proposed: {role: proposed}
  ready: {role: waiting_on_fact, waits: {criteria_unmet: WAIT_ON_DEPS}}
  waiting: {role: waiting_on_fact, waits: {criteria_met: DEPS_DONE}}
  in_progress: {role: resting}
  review: {role: waiting_on_fact}
  # A merged task whose post-merge QA items are still running.
  verifying: {role: resting}
  needs_attention: {role: waiting_on_person}
  # Done reopens (REOPEN), so the machine declares it open; the preview draws it as an end (`ci/demo_workspace.py`).
  done: {role: resting}
  archived: {final: true}
events:
  CREATE_PROPOSED:
    - {from: new, to: proposed}
  PROMOTE:
    - {from: proposed, to: ready}
  DROP:
    - {from: proposed, to: archived}
  CREATE_READY:
    - {from: new, to: ready}
  CREATE_WAITING:
    - {from: new, to: waiting}
  CREATE_IN_PROGRESS:
    - {from: new, to: in_progress}
  CLAIM:
    - {from: ready, to: in_progress}
  WAIT_ON_DEPS:
    - {from: ready, to: waiting}
  PARK:
    - {from: in_progress, to: waiting}
  START_WAITING:
    - {from: waiting, to: in_progress}
  DEPS_DONE:
    - {from: waiting, to: ready}
  PR_READY:
    - {from: in_progress, to: review}
  SEND_BACK:
    - {from: [review, verifying], to: in_progress}
  DEFER:
    - {from: in_progress, to: needs_attention}
  RETURN_READY:
    - {from: [needs_attention, in_progress], to: ready}
  RESUME:
    - {from: needs_attention, to: in_progress}
  FINALIZE:
    - {from: in_progress, to: done}
  MERGED:
    - {from: review, to: done}
  MERGED_WITH_QA:
    - {from: review, to: verifying}
  POST_MERGE_QA_PASSED:
    - {from: verifying, to: done}
  ARCHIVE:
    - {from: [ready, waiting, in_progress, review, verifying, needs_attention], to: archived}
  REOPEN:
    - {from: done, to: ready}
    - {from: done, to: waiting}
    - {from: done, to: in_progress}
    - {from: done, to: review}
    - {from: done, to: needs_attention}
writers:
  CREATE_PROPOSED:
    - {actor: agent, trigger: "tracker create --propose"}
  PROMOTE:
    - {actor: operator, trigger: "promote a proposal in the Proposals view"}
  DROP:
    - {actor: operator, trigger: "drop a proposal in the Proposals view"}
  CREATE_READY:
    - {actor: agent, trigger: "tracker create"}
    - {actor: dagu/drift-to-task, trigger: "file a drift task"}
  CREATE_WAITING:
    - {actor: agent, trigger: "tracker create --depends"}
  CLAIM:
    - {actor: dagu/board-scheduler, trigger: "dispatch the next Ready task"}
    - {actor: agent, trigger: "tracker start"}
  WAIT_ON_DEPS:
    - {actor: dagu/dependency-promotion, trigger: "hold a task on an open dependency"}
  PARK:
    - {actor: agent, trigger: "tracker park"}
  START_WAITING:
    - {actor: operator, trigger: "start a waiting task"}
  CREATE_IN_PROGRESS:
    - {actor: agent, trigger: "tracker create --start"}
  RESUME:
    - {actor: operator, trigger: "answer the blocker and resume"}
  FINALIZE:
    - {actor: agent, trigger: "tracker finalize"}
  DEPS_DONE:
    - {actor: dagu/dependency-promotion, trigger: "promote a task whose dependencies are done"}
  PR_READY:
    - {actor: dagu/deliver, trigger: "mark the pull request ready"}
  SEND_BACK:
    - {actor: operator, trigger: "request changes"}
  DEFER:
    - {actor: agent, trigger: "tracker park --operator"}
  RETURN_READY:
    - {actor: operator, trigger: "answer the blocker"}
  MERGED:
    - {actor: operator, trigger: "merge the pull request"}
  MERGED_WITH_QA:
    - {actor: operator, trigger: "merge a pull request with post-merge QA items"}
  POST_MERGE_QA_PASSED:
    - {actor: agent, trigger: "every post-merge QA item passes"}
  ARCHIVE:
    - {actor: operator, trigger: "archive"}
  REOPEN:
    - {actor: operator, trigger: "reopen a done task"}
cues:
  - {event: MERGED, dag: dagu/merge-apply, on: "each merge to main", resolves: next}
  - {event: MERGED, dag: dagu/index-refresh, on: "each merge to main", resolves: next}
