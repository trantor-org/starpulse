# What an agent session works through while its task is In Progress: build it, pass the qa lenses, deliver it, then fix
# what review finds. Each phase is its own machine (`build.yaml`, `qa.yaml`, `deliver.yaml`, `review_fix.yaml`) that `ci/demo_workspace.py` links as a
# submachine; its end state fires the move to the next phase here.
name: InProgress
states:
  build: {initial: true}
  qa: {role: resting}
  deliver: {role: resting}
  review_fix: {role: resting}
  review_recorded: {final: true}
  needs_attention: {final: true}
  parked: {final: true}
events:
  BUILD_DONE:
    - {from: build, to: qa}
  QA_PASSED:
    - {from: qa, to: deliver}
  CHANGES_FIXED:
    - {from: qa, to: build}
  DELIVER_DONE:
    - {from: deliver, to: review_fix}
  REDELIVER:
    - {from: review_fix, to: deliver}
  CI_BLOCKED:
    - {from: deliver, to: needs_attention}
  REVIEW_RECORDED:
    - {from: review_fix, to: review_recorded}
  PARKED:
    - {from: [build, qa, deliver, review_fix], to: parked}
